  function setView(next, skipRender){
    view = next === 'grid' ? 'grid' : 'list';
    saveView();
    syncViewUI();
    if (!skipRender) renderList();
  }

  var curTab = DATA.tabs.length ? DATA.tabs[0].key : STAR_KEY;
  var open = false, curIdx = 0, slideCount = 0, rafId = 0, lastRow = null, curTopic = null;

  function tabOf(key){
    for (var i=0;i<DATA.tabs.length;i++) if (DATA.tabs[i].key === key) return DATA.tabs[i];
    return null;
  }

  /* 난이도 — 주제 자체의 속성. 탭을 옮겨도 이 주제의 난이도가 따라갑니다. */
  /* 난이도 4단계 — 초급 · 중급 · 상급 · 실무. 예전 수첩 표기(입문·기초·심화)도 받아 준다. */
  var LEVEL_TOKEN = {
    '초급':'intro', '중급':'mid', '상급':'deep', '실무':'prac',
    '입문':'intro', '기초':'intro', '심화':'deep'
  };
  function levelOf(topic){ return (topic && topic.level) || ''; }
  function levelToken(topic){
    var lv = levelOf(topic);
    return LEVEL_TOKEN.hasOwnProperty(lv) ? LEVEL_TOKEN[lv] : 'etc';
  }

  function allTabs(){
    var a = [];
    DATA.tabs.forEach(function(t){ a.push(t); });
    a.push(STAR_TAB);
    a.push(GLOSS_TAB);
    a.push(ART_TAB);
    return a;
  }

  function getTab(key){
    if (key === STAR_KEY) return STAR_TAB;
    if (key === GL_KEY) return GLOSS_TAB;
    if (key === ART_KEY) return ART_TAB;
    return tabOf(key);
  }

  /* 지금 이 주제가 보이는 탭 — 옮긴 적이 있으면 그 탭, 아니면 원래 탭 */
  function homeKey(topic){
    var m = moves[topic.id];
    return (m && tabOf(m)) ? m : (topic.origin || curTab);
  }

  /* 한 탭에 지금 보이는 주제 — 옮겨 온 주제까지 합쳐 날짜 → 번호 순 */
  function tabTopics(key){
    var out = [];
    DATA.tabs.forEach(function(t){
      t.topics.forEach(function(tp){ if (homeKey(tp) === key) out.push(tp); });
    });
    out.sort(function(a, b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var na = parseInt(a.num, 10) || 0, nb = parseInt(b.num, 10) || 0;
      return na - nb;
    });
    return out;
  }

  function partLabel(t){
    if (!t) return '';
    return t.key === 'ip' ? 'IP' : (t.label || '');
  }

  /* 별표한 주제 — 최근 날짜 먼저, 같은 날짜면 IP → 라이선스 → 필수지식, 번호순 */
  var TAB_ORDER = {ip:0, license:1, basics:2};
  function starred(){
    var out = [];
    DATA.tabs.forEach(function(t){
      t.topics.forEach(function(tp){ if (stars[tp.id]) out.push({topic:tp, tab:getTab(homeKey(tp))}); });
    });
    out.sort(function(a, b){
      var da = a.topic.date || '', db = b.topic.date || '';
      if (da !== db) return da < db ? 1 : -1;
      if (a.tab.key !== b.tab.key){
        var ra = TAB_ORDER.hasOwnProperty(a.tab.key) ? TAB_ORDER[a.tab.key] : 9;
        var rb = TAB_ORDER.hasOwnProperty(b.tab.key) ? TAB_ORDER[b.tab.key] : 9;
        return ra - rb;
      }
      return String(a.topic.num) < String(b.topic.num) ? -1 : 1;
    });
    return out;
  }

  /* ── 탭 ───────────────────────────── */
  function renderTabs(){
    tabsEl.innerHTML = '';
    allTabs().forEach(function(t){
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role','tab');
      b.setAttribute('data-key', t.key);
      b.setAttribute('aria-selected', t.key === curTab ? 'true' : 'false');
      var lb = document.createElement('span');
      lb.className = 'lb';
      lb.textContent = t.label;
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      b.appendChild(lb);
      b.appendChild(cnt);
      b.addEventListener('click', function(){ if (curTab !== t.key) selectTab(t.key); });
      tabsEl.appendChild(b);
    });
    updateTabCounts();
  }

  /* 탭 이름 옆 숫자 — 그 탭에 지금 보이는 콘텐츠 수(옮긴 카드까지 반영) */
  function tabCountOf(key){
    if (key === STAR_KEY) return starred().length;
    if (key === GL_KEY) return GLOSS.length;
    if (key === ART_KEY) return ARTS.length;
    return tabTopics(key).length;
  }

  function updateTabCounts(){
    Array.prototype.forEach.call(tabsEl.children, function(b){
      var k = b.getAttribute('data-key');
      if (!k) return;
      var n = tabCountOf(k);
      var c = b.querySelector('.cnt');
      if (c) c.textContent = n ? String(n) : '';
      if (k === STAR_KEY){
        b.setAttribute('aria-label', n ? '중요 — 별표한 주제 ' + n + '개' : '중요 — 별표한 주제 모아보기');
      } else if (k === GL_KEY){
        b.setAttribute('aria-label', '사전 — 용어 ' + n + '개');
      } else if (k === ART_KEY){
        b.setAttribute('aria-label', '기사 — ' + n + '건');
      } else {
        var t = getTab(k);
        b.setAttribute('aria-label', (t ? t.label : k) + ' — ' + n + '개 주제');
      }
    });
  }

  /* 목록 맨 위 한 줄 — '주제 21개 · 최근 11/25' 처럼 지금 탭의 건수 */
  function listHeadText(){
    if (curTab === ART_KEY){
      var last = ARTS.length ? ARTS[0].date : '';
      return '기사 ' + ARTS.length + '건' + (last ? ' · 최근 ' + last.slice(5).replace('-', '/') : '');
    }
    if (curTab === GL_KEY){
      var found = glMatches().length;
      return '용어 ' + GLOSS.length + '개' + (found !== GLOSS.length ? ' · 찾은 ' + found + '개' : '');
    }
    if (curTab === STAR_KEY){
      return '별표 ' + starred().length + '개';
    }
    var tops = tabTopics(curTab);
    var recent = tops.length ? tops[tops.length - 1].date : '';
    return '주제 ' + tops.length + '개' + (recent ? ' · 최근 ' + recent.slice(5).replace('-', '/') : '');
  }

  function appendListHead(){
    if (!lheadEl) return;
    lheadEl.textContent = listHeadText();
    lheadEl.style.display = '';
  }

  function updateStarBadge(){ updateTabCounts(); }

  function applyAccent(t){
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-soft', t.accentSoft);
    var logo = document.querySelector('.logo');
    if (logo) logo.textContent = t.key === STAR_KEY ? '★' : (t.key === ART_KEY ? '📰' : (t.key === GL_KEY ? '사전' : 'IP'));
  }

  function selectTab(key){
    var t = getTab(key);
    if (!t) return;
    curTab = key;
    document.body.setAttribute('data-tab', key);
    applyAccent(t);
    syncGlossBar();
    Array.prototype.forEach.call(tabsEl.children, function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-key') === key ? 'true' : 'false');
    });
    renderList();
    window.scrollTo({top:0});
    /* 탭이 가로로 넘칠 때 선택한 탭이 보이도록 */
    var sel = tabsEl.querySelector('[data-key="' + key + '"]');
    if (sel && sel.scrollIntoView) {
      try { sel.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); } catch(e){}
    }
  }

  /* ── 목록 ───────────────────────────── */
  function showEmpty(icon, msg){
    listEl.innerHTML = '';
    if (lheadEl) lheadEl.style.display = 'none';
    var e = document.createElement('div');
    e.className = 'empty';
    var i = document.createElement('span');
    i.className = 'empty-ico';
    i.setAttribute('aria-hidden','true');
    i.textContent = icon;
    var m = document.createElement('span');
    m.className = 'empty-msg';
    m.textContent = msg;
    e.appendChild(i);
    e.appendChild(m);
    listEl.appendChild(e);
  }

  function renderList(){
    var isArt = curTab === ART_KEY;
    var isGl = curTab === GL_KEY;
    listEl.innerHTML = '';
    /* 기사·사전 탭은 글 목록이라 보기 방식과 상관없이 목록으로 그립니다 */
    listEl.className = 'list' + (!isArt && !isGl && view === 'grid' ? ' grid' : '') +
                       (isArt ? ' arts' : '') + (isGl ? ' gloss' : '');
    if (isArt){ renderArticles(); return; }
    if (isGl){ renderGlossary(); return; }
    if (curTab === STAR_KEY){
      var items = starred();
      if (!items.length){
        showEmpty('☆', '아직 별표한 주제가 없어요.\n제목 왼쪽 ☆를 눌러 모아 보세요!');
        return;
      }
      appendListHead();
      items.forEach(function(it){ appendTopic(it.topic, it.tab); });
      return;
    }
    var t = tabOf(curTab);
    if (!t){
      showEmpty('🗂', '아직 카드가 없어요.');
      return;
    }
    var tops = tabTopics(curTab);
    if (!tops.length){
      showEmpty('🗂', '아직 카드가 없어요.');
      return;
    }
    appendListHead();
    tops.forEach(function(topic){ appendTopic(topic, null); });
  }

  /* ── 🔍 통합 검색 — 제목·본문·기사·사전 용어를 한 번에 ── */
  var FIND_LIMIT = 40;
  var findOpen = false;
  var FIND_INDEX = null;

  function topicTotal(){
    var n = 0;
    DATA.tabs.forEach(function(t){ n += t.topics.length; });
    return n;
  }

  function findIndexOf(){
    if (FIND_INDEX) return FIND_INDEX;
    var out = [];
    DATA.tabs.forEach(function(tab){
      tab.topics.forEach(function(tp){
        out.push({
          kind: 'topic',
          badge: tab.label,
          badgeKey: tab.key,
          title: tp.title,
          text: tp.text || tp.meta || '',
          topic: tp
        });
      });
    });
    ARTS.forEach(function(a){
      var pts = (a.points || []).map(function(pt){
        return (pt.label ? pt.label + ': ' : '') + (pt.text || '');
      }).join(' ');
      out.push({
        kind: 'article',
        badge: '기사',
        badgeKey: 'article',
        title: a.title,
        text: [a.summary || '', a.insight || '', pts, a.tag || '', a.source || ''].join(' '),
        art: a
      });
    });
    GLOSS.forEach(function(t){
      out.push({
        kind: 'term',
        badge: '사전',
        badgeKey: 'term',
        title: t.ko + (t.en ? '  ' + t.en : ''),
        text: [t.field || '', t.meaning || '', t.tip || ''].join(' '),
        term: t
      });
    });
    FIND_INDEX = out;
    return out;
  }

  function findHits(q){
    var list = findIndexOf(), out = [];
    for (var i=0;i<list.length;i++){
      var it = list[i];
      var titleHit = q ? normText(it.title).indexOf(q) >= 0 : false;
      var hit = !q || titleHit || normText(it.text).indexOf(q) >= 0;
      if (!hit && isChosungQuery(q)){
        var parts = (it.title + ' ' + it.text).split(/[^\uAC00-\uD7A3]+/);
        for (var k=0;k<parts.length;k++){
          if (parts[k] && chosungOf(parts[k]).indexOf(q) >= 0){ hit = true; break; }
        }
      }
      if (hit) out.push({it: it, titleHit: titleHit});
    }
    out.sort(function(a, b){ return (b.titleHit ? 1 : 0) - (a.titleHit ? 1 : 0); });
    return out;
  }

  /* 검색어가 걸린 자리 주변을 잘라 스니펫으로 */
  function snipFrom(text, q){
    text = String(text || '');
    if (!text) return '';
    var i = -1;
    if (q){
      i = text.toLowerCase().indexOf(q);
      if (i < 0){
        var norm = '', map = [];
        for (var k=0;k<text.length;k++){
          var ch = text.charAt(k).toLowerCase();
          if (/\s/.test(ch)) continue;
          norm += ch; map.push(k);
        }
        var j = norm.indexOf(q);
        if (j >= 0) i = map[j];
      }
    }
    if (i < 0) return text.slice(0, 76) + (text.length > 76 ? '…' : '');
    var start = Math.max(0, i - 20), end = Math.min(text.length, i + 56);
    return (start > 0 ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
  }

  function makeFindRow(res, q){
    var r = res.it;
    var row = document.createElement('div');
    row.className = 'fres';
    row.tabIndex = 0;
    row.setAttribute('role','option');
    row.setAttribute('data-kind', r.kind);
    row.setAttribute('aria-label', r.badge + ' · ' + r.title);

    var kd = document.createElement('span');
    kd.className = 'fkind';
    kd.setAttribute('data-kind', r.badgeKey);
    kd.textContent = r.badge;

    var body = document.createElement('span');
    body.className = 'fbody';
    var tt = document.createElement('span');
    tt.className = 'fttl';
    tt.textContent = r.title;
    var sn = document.createElement('span');
    sn.className = 'fsnip';
    sn.textContent = res.titleHit ? snipFrom(r.text, '') : snipFrom(r.text, q);
    body.appendChild(tt);
    body.appendChild(sn);

    row.appendChild(kd);
    row.appendChild(body);
    row.addEventListener('click', function(){ goFindResult(r); });
    row.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); goFindResult(r); }
    });
    return row;
  }

  function renderFindResults(){
    if (!findListEl) return;
    findListEl.innerHTML = '';
    var q = normText(findqEl ? findqEl.value : '');
    if (!q){
      syncFindState(false, false);
      return;
    }
    var hits = findHits(q);
    if (!hits.length){
      syncFindState(false, true);
      var none = document.createElement('div');
      none.className = 'fhint';
      none.textContent = '찾는 내용이 없어요.\n다른 단어나 초성(예: ㅅㅊㅇ)으로 해보세요.';
      findListEl.appendChild(none);
      return;
    }
    syncFindState(true, true);
    hits.slice(0, FIND_LIMIT).forEach(function(res){
      findListEl.appendChild(makeFindRow(res, q));
    });
    if (hits.length > FIND_LIMIT){
      var more = document.createElement('div');
      more.className = 'fhint';
      more.textContent = (hits.length - FIND_LIMIT) + '개 더 있어요. 검색어를 좁혀 보세요.';
      findListEl.appendChild(more);
    }
  }

  /* 결과 유무에 따라 검색바를 살짝 올리고 지우기 버튼을 보인다 */
  function syncFindState(hasResults, hasQuery){
    if (findEl){
      if (hasResults) findEl.classList.add('has-results');
      else findEl.classList.remove('has-results');
      if (!hasResults && hasQuery) findEl.classList.add('no-results');
      else findEl.classList.remove('no-results');
    }
    if (findClearBtn) findClearBtn.hidden = !(findqEl && findqEl.value);
  }

  /* 키보드가 올라와도 가리지 않게 — 보이는 영역(visualViewport)에 맞춰 다시 잡는다 */
  function syncFindViewport(){
    if (!findEl || !findEl.style) return;
    var vv = window.visualViewport, h = 0, top = 0;
    if (vv && vv.height){ h = vv.height; top = vv.offsetTop || 0; }
    else if (window.innerHeight){ h = window.innerHeight; }
    else if (document.documentElement && document.documentElement.clientHeight){
      h = document.documentElement.clientHeight;
    }
    if (!h) return;
    if (h === findVH && top === findVTop) return;
    findVH = h; findVTop = top;
    var st = findEl.style;
    if (st.setProperty) st.setProperty('--find-h', h + 'px');
    else st['--find-h'] = h + 'px';
    st.height = h + 'px';
    st.top = top + 'px';
    st.bottom = 'auto';
  }

  function openFind(){
    if (!findEl) return;
    findOpen = true;
    findEl.classList.add('open');
    findEl.setAttribute('aria-hidden','false');
    document.body.classList.add('locked');
    document.body.classList.add('find-open');
    document.documentElement.classList.add('locked');
    findVH = 0; findVTop = 0;
    syncFindViewport();
    renderFindResults();
    if (findqEl) findqEl.focus({preventScroll:true});
  }

  function closeFind(){
    if (!findEl || !findOpen) return;
    findOpen = false;
    findEl.classList.remove('open');
    findEl.setAttribute('aria-hidden','true');
    document.body.classList.remove('find-open');
    if (findqEl && findqEl.blur) findqEl.blur();
    if (!(open || artOpen || moverOpen)){
      document.body.classList.remove('locked');
      document.documentElement.classList.remove('locked');
    }
  }

  /* 결과를 누르면 해당 카드뉴스 뷰어 / 기사 읽기 / 사전 용어로 이동 */
  function goFindResult(r){
    closeFind();
    if (r.kind === 'topic'){
      selectTab(homeKey(r.topic));
      openViewer(r.topic);
      return;
    }
    if (r.kind === 'article'){
      openArticle(r.art);
      return;
    }
    glField = '';
    glQuery = r.term.ko;
    if (gqEl) gqEl.value = r.term.ko;
    renderGlossFields();
    syncGlossClear();
    selectTab(GL_KEY);
  }

  /* ── 🔍 사전(용어) ─────────────────── */
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function chosungOf(s){
    var out = '';
    for (var i=0;i<s.length;i++){
      var c = s.charCodeAt(i);
      if (c >= 0xAC00 && c <= 0xD7A3) out += CHO.charAt(Math.floor((c - 0xAC00) / 588));
    }
    return out;
  }
  function normText(s){ return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ''); }
  function isChosungQuery(q){ return /^[ㄱ-ㅎ]{1,}$/.test(q); }
  function glFieldToken(f){
    if (f === '상표·IP') return 'ip';
    if (f === '라이선스') return 'license';
    if (f === '계약·분쟁') return 'contract';
    return 'etc';
  }
  /* 검색 — 용어명·영문·뜻·실무 포인트 안에서 찾고, 초성(ㅅㅊㅇ)도 받아 줍니다 */
  function glossMatch(t, q){
    if (!q) return true;
    var hay = normText(t.ko + ' ' + (t.en || '') + ' ' + (t.field || '') + ' ' +
                      (t.meaning || '') + ' ' + (t.tip || ''));
    if (hay.indexOf(q) >= 0) return true;
    if (isChosungQuery(q)){
      var parts = (t.ko + ' ' + (t.en || '') + ' ' + (t.field || '') + ' ' +
                   (t.meaning || '') + ' ' + (t.tip || '')).split(/[^\uAC00-\uD7A3]+/);
      for (var i=0;i<parts.length;i++){
        if (parts[i] && chosungOf(parts[i]).indexOf(q) >= 0) return true;
      }
    }
    return false;
  }
  function glMatches(){
    var q = normText(glQuery);
    var out = GLOSS.filter(function(t){
      if (glField && t.field !== glField) return false;
      return glossMatch(t, q);
    });
    out.sort(function(a, b){
      var ra = GL_FIELD_ORDER.hasOwnProperty(a.field) ? GL_FIELD_ORDER[a.field] : 9;
      var rb = GL_FIELD_ORDER.hasOwnProperty(b.field) ? GL_FIELD_ORDER[b.field] : 9;
      return ra - rb;
    });
    return out;
  }
  function syncGlossBar(){
    var on = curTab === GL_KEY;
    if (gbarEl) gbarEl.hidden = !on;
    if (gfieldsEl) gfieldsEl.hidden = !on;
  }
  function syncGlossClear(){ if (gclearEl) gclearEl.hidden = !glQuery; }

  /* 분야 필터 칩 — 전체 / 상표·IP / 라이선스 / 계약·분쟁 */
  function renderGlossFields(){
    if (!gfieldsEl) return;
    gfieldsEl.innerHTML = '';
    var opts = ['', '상표·IP', '라이선스', '계약·분쟁'];
    opts.forEach(function(f){
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-field', f);
      b.setAttribute('aria-pressed', glField === f ? 'true' : 'false');
      b.textContent = f ? f : '전체';
      b.addEventListener('click', function(){
        glField = f;
        updateGlossChips();
        if (curTab === GL_KEY) renderGlossary();
      });
      gfieldsEl.appendChild(b);
    });
    updateGlossChips();
  }

  /* 칩을 다시 그리지 않고 선택 상태만 바꿉니다(포커스 유지) */
  function updateGlossChips(){
    if (!gfieldsEl) return;
    for (var i=0;i<gfieldsEl.children.length;i++){
      var c = gfieldsEl.children[i];
      var f = c.getAttribute('data-field') || '';
      c.setAttribute('aria-pressed', glField === f ? 'true' : 'false');
    }
  }

  function makeTerm(t){
    var box = document.createElement('div');
    box.className = 'gterm';
    box.setAttribute('data-id', t.ko);
    box.setAttribute('data-field', glFieldToken(t.field));

    var head = document.createElement('div');
    head.className = 'gthead';
    var nm = document.createElement('span');
    nm.className = 'gname';
    nm.textContent = t.ko;
    head.appendChild(nm);
    if (t.en){
      var en = document.createElement('span');
      en.className = 'gen';
      en.textContent = t.en;
      head.appendChild(en);
    }
    var tag = document.createElement('span');
    tag.className = 'gtag';
    tag.setAttribute('data-field', glFieldToken(t.field));
    tag.textContent = t.field;
    head.appendChild(tag);

    var mean = document.createElement('p');
    mean.className = 'gmean';
    mean.textContent = t.meaning;

    var tip = document.createElement('p');
    tip.className = 'gtip';
    var tb = document.createElement('b');
    tb.textContent = '실무';
    var tt = document.createElement('span');
    tt.textContent = ' ' + t.tip;
    tip.appendChild(tb);
    tip.appendChild(tt);

    box.appendChild(head);
    box.appendChild(mean);
    if (t.tip) box.appendChild(tip);
    return box;
  }

  function renderGlossary(){
    if (!GLOSS.length){
      showEmpty('📖', '아직 등록된 용어가 없어요.\n새 용어는 공부하면서 계속 쌓입니다.');
      return;
    }
    var items = glMatches();
    listEl.innerHTML = '';
    listEl.className = 'list gloss';
    appendListHead();
    if (!items.length){
      var none = document.createElement('div');
      none.className = 'gnone';
      none.textContent = '찾은 용어가 없어요.\n다른 말로 검색하거나 분야를 바꿔 보세요.';
      listEl.appendChild(none);
      return;
    }
    var seen = null;
    items.forEach(function(t){
      if (t.field !== seen){
        seen = t.field;
        var h = document.createElement('div');
        h.className = 'gsec';
        h.textContent = t.field;
        listEl.appendChild(h);
      }
      listEl.appendChild(makeTerm(t));
    });
  }

  /* 사전 탭 시작 — 필터 칩 그리고 검색창 입력 리스너를 붙입니다 */
  function initGloss(){
    renderGlossFields();
    syncGlossClear();
    if (gqEl){
      gqEl.addEventListener('input', function(){
        glQuery = gqEl.value || '';
        syncGlossClear();
        if (curTab === GL_KEY) renderGlossary();
      });
      gqEl.addEventListener('keydown', function(ev){
        if (ev.key === 'Escape' && glQuery){ ev.preventDefault(); clearGlossQuery(); }
      });
    }
    if (gclearEl){
      gclearEl.addEventListener('click', function(){
        clearGlossQuery();
        if (gqEl && gqEl.focus) gqEl.focus();
      });
    }
  }
  function clearGlossQuery(){
    glQuery = '';
    if (gqEl) gqEl.value = '';
    syncGlossClear();
    if (curTab === GL_KEY) renderGlossary();
  }

  /* ── 📰 기사 목록 ───────────────────── */
  var WEEKDAY = ['일','월','화','수','목','금','토'];
  function artDateLabel(date){
    if (!date) return '';
    var p2 = date.split('-');
    if (p2.length !== 3) return date;
    var d = new Date(Number(p2[0]), Number(p2[1]) - 1, Number(p2[2]));
    var w = isNaN(d.getDay()) ? '' : ' ' + WEEKDAY[d.getDay()];
    return Number(p2[1]) + '/' + Number(p2[2]) + w;
  }

  function trackLabel(track){ return track === 'license' ? '라이선스' : 'IP'; }

  function renderArticles(){
    if (!ARTS.length){
      showEmpty('📰', '아직 정리된 기사가 없어요.\n매일 아침 모닝 패키지 기사가 여기에 쌓입니다.');
      return;
    }
    appendListHead();
    var lastDate = '';
    ARTS.forEach(function(a){
      if (a.date !== lastDate){
        lastDate = a.date;
        var h = document.createElement('div');
        h.className = 'ahead';
        h.textContent = artDateLabel(a.date);
        listEl.appendChild(h);
      }
      listEl.appendChild(makeArtRow(a));
    });
  }

  function makeArtRow(a){
    var row = document.createElement('div');
    row.className = 'arow';
    row.tabIndex = 0;
    row.setAttribute('role','button');
    row.setAttribute('data-id', a.id || '');
    row.setAttribute('aria-label', a.title + ' — 기사 읽기');

    var trk = document.createElement('span');
    trk.className = 'atrk';
    trk.setAttribute('data-track', a.track === 'license' ? 'license' : 'ip');
    trk.textContent = trackLabel(a.track);

    var txt = document.createElement('span');
    txt.className = 'atxt';
    if (a.oneliner){
      var one = document.createElement('span');
      one.className = 'aone';
      one.textContent = a.oneliner;
      txt.appendChild(one);
    }
    var ti = document.createElement('span');
    ti.className = 'atitle';
    ti.textContent = a.title;
    var me = document.createElement('span');
    me.className = 'ameta';
    var tagTxt = (a.tag && a.tag !== trackLabel(a.track)) ? a.tag + ' · ' : '';
    me.textContent = tagTxt + (a.source || '') +
                     (a.published ? ' · ' + a.published.slice(5).replace('-', '/') : '');
    txt.appendChild(ti); txt.appendChild(me);

    var ch = document.createElement('span');
    ch.className = 'ache';
    ch.setAttribute('aria-hidden','true');
    ch.textContent = '›';

    row.appendChild(trk); row.appendChild(txt); row.appendChild(ch);
    row.addEventListener('click', function(){ openArticle(a); });
    row.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openArticle(a); }
    });
    return row;
  }

  /* ── 📰 기사 읽기 ───────────────────── */
  var artOpen = false, curArt = null;

  function artSection(label, body){
    var sec = document.createElement('section');
    sec.className = 'asec';
    var h = document.createElement('h3');
    h.className = 'alabel';
    h.textContent = label;
    var p = document.createElement('p');
    p.className = 'atext';
    p.textContent = body || '';
    sec.appendChild(h); sec.appendChild(p);
    return sec;
  }

  function openArticle(a){
    if (!a) return;
    curArt = a;
    artInner.innerHTML = '';

    var badge = document.createElement('span');
    badge.className = 'art-badge';
    badge.setAttribute('data-track', a.track === 'license' ? 'license' : 'ip');
    badge.textContent = trackLabel(a.track) +
                        (a.tag && a.tag !== trackLabel(a.track) ? ' · ' + a.tag : '');
    artBadge.innerHTML = '';
    artBadge.appendChild(badge);

    /* 제목 위 재치 한 줄 — 목록과 같은 톤으로 */
    if (a.oneliner){
      var one = document.createElement('p');
      one.className = 'aone-main';
      one.textContent = a.oneliner;
      artInner.appendChild(one);
    }

    var h1 = document.createElement('h2');
    h1.className = 'atitle-main';
    h1.textContent = a.title;
    artInner.appendChild(h1);

    var meta = document.createElement('p');
    meta.className = 'ameta-main';
    meta.textContent = (a.source || '') + (a.published ? ' · ' + a.published : '');
    artInner.appendChild(meta);

    if (a.summary) artInner.appendChild(artSection('핵심 요약', a.summary));
    if (a.insight) artInner.appendChild(artSection('시사점', a.insight));

    (a.points || []).forEach(function(pt){
      var box = document.createElement('div');
      box.className = 'apoint';
      box.setAttribute('data-side', /방어|라이선시/.test(pt.label || '') ? 'b' : 'a');
      var lb = document.createElement('span');
      lb.className = 'alabel2';
      lb.textContent = pt.label || '';
      var tx = document.createElement('p');
      tx.className = 'atext';
      tx.textContent = pt.text || '';
      box.appendChild(lb); box.appendChild(tx);
      artInner.appendChild(box);
    });

    if (a.url){
      var link = document.createElement('a');
      link.className = 'alink';
      link.setAttribute('href', a.url);
      link.setAttribute('target','_blank');
      link.setAttribute('rel','noopener noreferrer');
      link.textContent = '원문 기사 보기 ↗';
      artInner.appendChild(link);
    }

    artOpen = true;
    artEl.classList.add('open');
    artEl.setAttribute('aria-hidden','false');
    document.body.classList.add('locked');
    document.documentElement.classList.add('locked');
    artScroll.scrollTop = 0;
    try { history.pushState({ipnote:1, art:1}, ''); } catch(e){}
    artCloseBtn.focus({preventScroll:true});
  }

  function closeArticle(fromPop){
    if (!artOpen) return;
    artOpen = false;
    artEl.classList.remove('open');
    artEl.setAttribute('aria-hidden','true');
    if (!open && !moverOpen){
      document.body.classList.remove('locked');
      document.documentElement.classList.remove('locked');
    }
    if (!fromPop && history.state && history.state.art){
      popIgnore++;
      try { history.back(); } catch(e){ popIgnore = Math.max(0, popIgnore - 1); }
    }
  }

  /* 현재 보기 방식에 맞는 카드(행 또는 그리드 카드)를 붙입니다. */
  function appendTopic(topic, partTab){
    listEl.appendChild(view === 'grid' ? makeCard(topic, partTab) : makeRow(topic, partTab));
  }

  function toggleStar(topic, btn){
    if (stars[topic.id]) delete stars[topic.id]; else stars[topic.id] = true;
    var on = !!stars[topic.id];
    if (btn){
      btn.textContent = on ? '★' : '☆';
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('aria-label', topic.title + (on ? ' 중요 해제' : ' 중요 표시'));
      btn.classList.toggle('on', on);
    }
    saveStars();
    updateStarBadge();
    /* 중요 탭은 목록 구성 자체가 바뀌므로 다시 그립니다 */
    if (curTab === STAR_KEY) renderList();
  }

  /* 별표 버튼 — 목록 보기와 그리드 보기가 같은 상태(stars)를 쓰므로 항상 동기화됩니다. */
  function makeStarBtn(topic, extraClass){
    var on = !!stars[topic.id];
    var star = document.createElement('button');
    star.type = 'button';
    star.className = 'star' + (extraClass ? ' ' + extraClass : '') + (on ? ' on' : '');
    star.textContent = on ? '★' : '☆';
    star.setAttribute('aria-pressed', on ? 'true' : 'false');
    star.setAttribute('aria-label', topic.title + (on ? ' 중요 해제' : ' 중요 표시'));
    star.addEventListener('click', function(ev){
      if (ev && ev.stopPropagation) ev.stopPropagation();
      if (ev && ev.preventDefault) ev.preventDefault();
      toggleStar(topic, star);
    });
    star.addEventListener('keydown', function(ev){
      /* 행/카드의 열기 동작으로 새지 않게만 막고, 토글은 버튼 기본 클릭에 맡김 */
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.stopPropagation) ev.stopPropagation();
    });
    return star;
  }

  /* 그리드 카드 톤 — IP 네이비/블루, 라이선스 오렌지/코랄, 필수지식 그린, 중요(혼합) 차콜 */
  function toneOf(partTab){
    var key = partTab ? partTab.key : curTab;
    if (key === 'ip') return 'ip';
    if (key === 'license') return 'license';
    if (key === 'basics') return 'basics';
    return 'star';
  }

  function makeRow(topic, partTab){
    var cards = topic.cards || [];
    var row = document.createElement('div');
    row.className = 'row' + (cards.length ? '' : ' soon');
    row.tabIndex = 0;
    row.setAttribute('role','button');
    row.setAttribute('data-id', topic.id);
    if (!cards.length) row.setAttribute('aria-disabled','true');

    /* 제목 왼쪽 별표 버튼 (터치 영역 40×40) */
    var star = makeStarBtn(topic, '');

    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = topic.num;

    var txt = document.createElement('span');
    txt.className = 'txt';
    var tt = document.createElement('span');
    tt.className = 't';
    tt.textContent = topic.title;
    if (topic.fullTitle) { tt.title = topic.fullTitle; row.setAttribute('aria-label', topic.fullTitle); }
    var mm = document.createElement('span');
    mm.className = 'm';
    if (partTab){
      var pb = document.createElement('span');
      pb.className = 'part';
      pb.textContent = partLabel(partTab);
      mm.appendChild(pb);
    }
    if (levelOf(topic)){
      var lv = document.createElement('span');
      lv.className = 'lvl';
      lv.setAttribute('data-lvl', levelToken(topic));
      lv.textContent = levelOf(topic);
      mm.appendChild(lv);
    }
    var mt = document.createElement('span');
    mt.className = 'mtxt';
    mt.textContent = topic.meta;
    mm.appendChild(mt);
    txt.appendChild(tt); txt.appendChild(mm);

    var mvb = makeMoveBtn(topic, '');

    row.appendChild(star); row.appendChild(num); row.appendChild(txt);
    row.appendChild(mvb);
    row.addEventListener('click', function(){ lastRow = row; openViewer(topic); });
    row.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); lastRow = row; openViewer(topic); }
    });
    return row;
  }

  /* ── 2열 그리드 카드 ─────────────────── */
  function makeCard(topic, partTab){
    var cards = topic.cards || [];
    var tone = toneOf(partTab);
    var card = document.createElement('div');
    card.className = 'gcard' + (cards.length ? '' : ' soon');
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.setAttribute('data-id', topic.id);
    card.setAttribute('data-tone', tone);
    if (topic.fullTitle) card.setAttribute('aria-label', topic.fullTitle + (levelOf(topic) ? ' · ' + levelOf(topic) : ''));
    if (!cards.length) card.setAttribute('aria-disabled','true');

    /* 썸네일 — 통일된 톤 바탕 + 상단 번호/파트 배지 + 큼직한 메인 제목 */
    var thumb = document.createElement('div');
    thumb.className = 'gthumb';

    var wm = document.createElement('span');
    wm.className = 'gwm';
    wm.setAttribute('aria-hidden','true');
    /* 모서리 워터마크에 그 카드의 난이도를 적는다 (탭이 아니라 주제 속성) */
    wm.setAttribute('data-lvl', levelToken(topic));
    wm.textContent = levelOf(topic) || (tone === 'license' ? 'LIC' : (tone === 'basics' ? '초급' : 'IP'));

    var top = document.createElement('div');
    top.className = 'gbtop';
    var num = document.createElement('span');
    num.className = 'gnum';
    num.textContent = topic.num;
    top.appendChild(num);
    if (partTab){
      var pb = document.createElement('span');
      pb.className = 'gpart';
      pb.textContent = partLabel(partTab);
      top.appendChild(pb);
    }
    if (levelOf(topic)){
      var glv = document.createElement('span');
      glv.className = 'glvl';
      glv.setAttribute('data-lvl', levelToken(topic));
      glv.textContent = levelOf(topic);
      top.appendChild(glv);
    }
    top.appendChild(makeMoveBtn(topic, 'gmv'));

    var tt = document.createElement('span');
    tt.className = 'gtitle';
    tt.textContent = topic.title;
    if (topic.fullTitle) tt.title = topic.fullTitle;

    thumb.appendChild(wm);
    thumb.appendChild(top);
    thumb.appendChild(tt);

    /* 하단 — 왼쪽 날짜·장수, 오른쪽 별표 */
    var foot = document.createElement('div');
    foot.className = 'gfoot';
    var meta = document.createElement('span');
    meta.className = 'gmeta';
    var day = topic.date ? topic.date.slice(5).replace('-', '/') : '';
    meta.textContent = day + (cards.length ? ' · ' + cards.length + '장' : ' · 준비 중');
    var star = makeStarBtn(topic, 'gstar');
    foot.appendChild(meta);
    foot.appendChild(star);

    card.appendChild(thumb);
    card.appendChild(foot);
    card.addEventListener('click', function(){ lastRow = card; openViewer(topic); });
    card.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); lastRow = card; openViewer(topic); }
    });
    return card;
  }

  /* ── 카드 옮기기(탭 이동) ───────────── */
  var moverOpen = false, moveTopic = null, toastTimer = 0, undoFn = null, popIgnore = 0;

  function makeMoveBtn(topic, extra){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mvb' + (extra ? ' ' + extra : '');
    b.textContent = '이동';
    b.setAttribute('aria-label', topic.title + ' — 다른 탭으로 옮기기');
    b.setAttribute('title', '다른 탭으로 옮기기');
    b.addEventListener('click', function(ev){
      if (ev && ev.stopPropagation) ev.stopPropagation();
      if (ev && ev.preventDefault) ev.preventDefault();
      openMover(topic);
    });
    b.addEventListener('keydown', function(ev){
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.stopPropagation) ev.stopPropagation();
    });
    return b;
  }

  function renderMoverOptions(){
    mOptsEl.innerHTML = '';
    if (!moveTopic) return;
    var cur = homeKey(moveTopic);
    DATA.tabs.forEach(function(t){
      var isCur = t.key === cur;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mopt' + (isCur ? ' cur' : '');
      b.setAttribute('data-key', t.key);
      b.setAttribute('aria-pressed', isCur ? 'true' : 'false');
      if (isCur) b.setAttribute('aria-disabled', 'true');
      var em = document.createElement('span');
      em.className = 'mem';
      em.setAttribute('aria-hidden', 'true');
      em.textContent = t.emoji || '';
      var lb = document.createElement('span');
      lb.className = 'mlb';
      lb.textContent = t.label;
      var ct = document.createElement('span');
      ct.className = 'mct';
      var n = tabTopics(t.key).length;
      ct.textContent = isCur ? '지금 탭' : n + '개 → ' + (n + 1) + '개';
      b.appendChild(em); b.appendChild(lb); b.appendChild(ct);
      b.addEventListener('click', function(){ chooseDest(t.key); });
      mOptsEl.appendChild(b);
    });
    mResetEl.hidden = !moves[moveTopic.id];
  }

  function openMover(topic){
    if (!topic) return;
    moveTopic = topic;
    mSubEl.textContent = topic.fullTitle || topic.title;
    renderMoverOptions();
    moverOpen = true;
    moverEl.classList.add('open');
    moverEl.setAttribute('aria-hidden', 'false');
    document.body.classList.add('locked');
    document.documentElement.classList.add('locked');
    /* 뒤로가기로 시트만 닫히도록 */
    try { history.pushState({ipnote:1, mover:1}, ''); } catch(e){}
  }

  function closeMover(fromPop){
    if (!moverOpen) return;
    moverOpen = false;
    moveTopic = null;
    moverEl.classList.remove('open');
    moverEl.setAttribute('aria-hidden', 'true');
    if (!open){
      document.body.classList.remove('locked');
      document.documentElement.classList.remove('locked');
    }
    if (!fromPop && history.state && history.state.mover){
      popIgnore++;
      try { history.back(); } catch(e){ popIgnore = Math.max(0, popIgnore - 1); }
    }
  }

  /* 옮긴 설정만 바꾸고 탭 건수·목록을 바로 다시 그립니다 */
  function writeMove(id, tabKey){
    if (tabKey) moves[id] = tabKey; else delete moves[id];
    saveMoves();
    updateTabCounts();
    renderList();
    if (open) updateTopicNav();
  }

  function chooseDest(tabKey){
    var topic = moveTopic;
    if (!topic || !tabOf(tabKey)) return;
    var from = homeKey(topic);
    if (tabKey === from){ closeMover(); return; }
    var prev = moves[topic.id] || null;
    writeMove(topic.id, tabKey);
    closeMover();
    showToast('‘' + topic.title + '’ → ' + tabOf(tabKey).label + ' 탭으로 옮겼어요',
              function(){ writeMove(topic.id, prev); });
  }

  function showToast(msg, fn){
    toastMsgEl.textContent = msg;
    undoFn = fn || null;
    toastEl.classList.add('show');
    toastEl.setAttribute('aria-hidden', 'false');
    if (toastTimer && typeof clearTimeout === 'function') clearTimeout(toastTimer);
    if (typeof setTimeout === 'function') toastTimer = setTimeout(hideToast, 6000);
  }

  function hideToast(){
    if (typeof clearTimeout === 'function' && toastTimer) clearTimeout(toastTimer);
    toastTimer = 0;
    undoFn = null;
    toastEl.classList.remove('show');
    toastEl.setAttribute('aria-hidden', 'true');
  }

  /* ── 뷰어 ───────────────────────────── */
  function openViewer(topic){
    var cards = (topic && topic.cards) || [];
    if (!cards.length) return;

    fillViewer(topic);

    open = true;
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden','false');
    document.body.classList.add('locked');
    document.documentElement.classList.add('locked');
    themeEl.setAttribute('content', DARK);

    requestAnimationFrame(function(){ deckEl.scrollLeft = curIdx * deckEl.clientWidth; });

    if (!(history.state && history.state.ipnote)){
      try { history.pushState({ipnote:1}, ''); } catch(e){}
    }
    closeBtn.focus({preventScroll:true});
  }

  /* 뷰어의 카드 세트를 새 주제로 다시 채웁니다 — 주제 이동도 이 함수를 쓴다 */
  function fillViewer(topic){
    var cards = (topic && topic.cards) || [];
    if (!cards.length) return;
    curTopic = topic;

    labelEl.textContent = topic.title;
    if (topic.fullTitle) labelEl.setAttribute('title', topic.fullTitle);
    dateEl.textContent = (topic.date ? topic.date.slice(5).replace('-', '.') : '') +
                         (levelOf(topic) ? ' · ' + levelOf(topic) : '');
    deckEl.innerHTML = '';
    cards.forEach(function(s, i){
      var el = document.createElement('div');
      el.className = 'slide';
      var img = document.createElement('img');
      img.src = s.src;
      img.alt = s.alt;
      img.decoding = 'async';
      img.draggable = false;
      el.appendChild(img);
      deckEl.appendChild(el);
    });
    slideCount = cards.length;

    dotsEl.innerHTML = '';
    for (var i=0;i<slideCount;i++){
      (function(idx){
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', (idx+1) + '번째 카드');
        b.appendChild(document.createElement('i'));
        b.addEventListener('click', function(){ go(idx); });
        dotsEl.appendChild(b);
      })(i);
    }

    curIdx = 0;
    deckEl.scrollLeft = 0;
    sync();
    updateTopicNav();
  }

  /* ── 뷰어 안 주제 이동(이전/다음 주제) ── */
  function viewerSequence(){
    if (curTab === STAR_KEY){
      return starred().map(function(it){ return it.topic; });
    }
    return tabTopics(curTab);
  }

  function curTopicPos(){
    var seq = viewerSequence(), i = -1;
    for (var k=0;k<seq.length;k++){
      if (curTopic && seq[k].id === curTopic.id){ i = k; break; }
    }
    return {seq: seq, idx: i};
  }

  function updateTopicNav(){
    if (!prevTopicBtn || !nextTopicBtn) return;
    var p = curTopicPos();
    var has = p.idx >= 0 && p.seq.length > 0;
    prevTopicBtn.disabled = !(has && p.idx > 0);
    nextTopicBtn.disabled = !(has && p.idx < p.seq.length - 1);
    if (topicPosEl) topicPosEl.textContent = has ? (p.idx + 1) + ' / ' + p.seq.length : '';
  }

  function goTopic(delta){
    var p = curTopicPos();
    var j = p.idx + delta;
    if (p.idx < 0 || j < 0 || j >= p.seq.length) return;
    var t = p.seq[j];
    if (!(t.cards && t.cards.length)) return;
    fillViewer(t);            /* 새 주제는 1번 장부터 */
    requestAnimationFrame(function(){ deckEl.scrollLeft = 0; });
  }

  function closeViewer(fromPop){
    if (!open) return;
    open = false;
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden','true');
    document.body.classList.remove('locked');
    document.documentElement.classList.remove('locked');
    themeEl.setAttribute('content', PAPER);
    if (lastRow && document.contains(lastRow) && lastRow.focus) lastRow.focus({preventScroll:true});
    if (!fromPop && history.state && history.state.ipnote){
      try { history.back(); } catch(e){}
    }
  }

  function currentIndex(){
    var w = deckEl.clientWidth || 1;
    var i = Math.round(deckEl.scrollLeft / w);
    return Math.max(0, Math.min(slideCount - 1, i));
  }

  function sync(){
    var i = currentIndex();
    if (i !== curIdx) curIdx = i;
    Array.prototype.forEach.call(dotsEl.children, function(b, k){
      if (k === curIdx) b.setAttribute('aria-current','true');
      else b.removeAttribute('aria-current');
    });
    countEl.textContent = slideCount ? (curIdx + 1) + ' / ' + slideCount : '';
    prevBtn.disabled = curIdx <= 0;
    nextBtn.disabled = curIdx >= slideCount - 1;
  }

  function go(i){
    i = Math.max(0, Math.min(slideCount - 1, i));
    deckEl.scrollTo({left: i * deckEl.clientWidth, behavior: 'smooth'});
  }

  deckEl.addEventListener('scroll', function(){
    if (!open || rafId) return;
    rafId = requestAnimationFrame(function(){ rafId = 0; sync(); });
  }, {passive:true});

  prevBtn.addEventListener('click', function(){ go(curIdx - 1); });
  nextBtn.addEventListener('click', function(){ go(curIdx + 1); });
  closeBtn.addEventListener('click', function(){ closeViewer(false); });

  /* 주제 이동 바 · 뷰어 안 옮기기 버튼 · 시트 닫기 */
  if (prevTopicBtn) prevTopicBtn.addEventListener('click', function(){ goTopic(-1); });
  if (nextTopicBtn) nextTopicBtn.addEventListener('click', function(){ goTopic(1); });
  if (vMoveBtn) vMoveBtn.addEventListener('click', function(){ if (curTopic) openMover(curTopic); });
  if (mCancelEl) mCancelEl.addEventListener('click', function(){ closeMover(false); });
  if (moverBg) moverBg.addEventListener('click', function(){ closeMover(false); });
  if (mResetEl) mResetEl.addEventListener('click', function(){
    if (!moveTopic) return;
    var topic = moveTopic, prev = moves[topic.id] || null;
    writeMove(topic.id, null);
    closeMover();
    showToast('‘' + topic.title + '’ 을(를) 원래 탭으로 되돌렸어요',
              function(){ writeMove(topic.id, prev); });
  });
  if (toastUndoBtn) toastUndoBtn.addEventListener('click', function(){
    var f = undoFn;
    hideToast();
    if (f) f();
  });
  if (artCloseBtn) artCloseBtn.addEventListener('click', function(){ closeArticle(false); });

  document.addEventListener('keydown', function(ev){
    if (findOpen && ev.key === 'Escape'){ closeFind(); return; }
    if (artOpen && ev.key === 'Escape'){ closeArticle(false); return; }
    if (!open) return;
    if (ev.key === 'Escape') { closeViewer(false); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); go(curIdx + 1); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); go(curIdx - 1); }
  });
  window.addEventListener('popstate', function(){
    if (popIgnore > 0){ popIgnore--; return; }
    if (findOpen){ closeFind(); return; }
    if (artOpen){ closeArticle(true); return; }
    if (moverOpen){ closeMover(true); return; }
    if (open) closeViewer(true);
  });
  window.addEventListener('resize', function(){
    if (open) deckEl.scrollLeft = curIdx * deckEl.clientWidth;
    if (findOpen) syncFindViewport();
  });
  if (window.visualViewport && window.visualViewport.addEventListener){
    window.visualViewport.addEventListener('resize', function(){ if (findOpen) syncFindViewport(); });
    window.visualViewport.addEventListener('scroll', function(){ if (findOpen) syncFindViewport(); });
  }

  /* ── 보기 전환 버튼 ─────────────────── */
  if (viewListBtn) viewListBtn.addEventListener('click', function(){ if (view !== 'list') setView('list'); });
  if (viewGridBtn) viewGridBtn.addEventListener('click', function(){ if (view !== 'grid') setView('grid'); });

  /* ── 통합 검색(돋보기) ─────────────── */
  if (findOpenBtn) findOpenBtn.addEventListener('click', openFind);
  if (findCloseBtn) findCloseBtn.addEventListener('click', function(){ closeFind(); });
  if (findBgEl) findBgEl.addEventListener('click', closeFind);
  if (findClearBtn) findClearBtn.addEventListener('click', function(){
    if (!findqEl) return;
    findqEl.value = '';
    renderFindResults();
    findqEl.focus({preventScroll:true});
  });
  if (findGoBtn) findGoBtn.addEventListener('click', function(){
    if (findqEl && findqEl.blur) findqEl.blur();   /* 키보드만 내려 결과를 넓게 본다 */
  });
  if (findqEl){
    findqEl.addEventListener('input', function(){ renderFindResults(); });
    findqEl.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){
        var first = findListEl ? findListEl.querySelector('.fres') : null;
        if (first) first.click();
      }
    });
  }

  /* ── 시작 ───────────────────────────── */
  var built = document.getElementById('built');
  /* 빌드 시각까지 표시 — 폰에 예전 파일이 남아 있는지 바로 알아볼 수 있게 */
  if (built){
    var stamp = DATA.latest ? DATA.latest.slice(5).replace('-', '.') : '';
    if (DATA.builtAt && DATA.builtAt.length >= 16) stamp += ' · ' + DATA.builtAt.slice(11, 16);
    built.textContent = stamp;
  }
  syncViewUI();          /* 저장된 보기 방식을 먼저 적용한 뒤 그립니다 */
  initGloss();
  renderTabs();
  selectTab(curTab);
})();
</script>
</body>
</html>
