토·정산 점검)을 월 리테이너로 묶으면 반복 수익이 되고, 여기에 콜라보·서브라이선싱 중개와 로열티 셰어를 얹으면 브랜드가 커질수록 매출이 같이 큽니다. 계약서는 AI·역직구·인플루언서 조항을 넣어 연 1회 개정하는 것 자체를 서비스로 만드세요. 사례 연결: 경고장 한 장으로 끝난 고객은 다음 사건 때 다시 견적을 비교합니다. 반면 매달 리포트를 받아 보는 고객은 담당자가 바뀌거나 예산이 줄어도 \"계속 필요한 비용\"으로 남습니다. 실무 포인트: 리테이너 범위(월 스캔 횟수·계약 검토 건수·리포트 형식)를 숫자로 못 박고 초과분은 별도 과금하세요. 중개 수수료는 성사 기준·지급 시점·환수 조항까지 정해야 나중에 다툼이 없습니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t10-1.webp","alt":"에이전시 수익화 — 단발 분쟁에서 반복 수익으로 카드 1 / 4","sha":"6be53e451409"},{"src":"assets/cards/2026-11-24-basics-t10-2.webp","alt":"에이전시 수익화 — 단발 분쟁에서 반복 수익으로 카드 2 / 4","sha":"031a217064e6"},{"src":"assets/cards/2026-11-24-basics-t10-3.webp","alt":"에이전시 수익화 — 단발 분쟁에서 반복 수익으로 카드 3 / 4","sha":"555957cc3c47"},{"src":"assets/cards/2026-11-24-basics-t10-4.webp","alt":"에이전시 수익화 — 단발 분쟁에서 반복 수익으로 카드 4 / 4","sha":"80f32a68ec7f"}]},{"id":"basics-2026-11-24-11","num":"11","title":"IP 컨설팅 필수 리스크 3가지","fullTitle":"IP 컨설팅 필수 리스크 3가지","level":"실무","text":"핵심: 에이전시가 조사·분석·전략·중개까지 하는 것과 법률사무·특허사무를 대신하는 것은 다릅니다. 소송·법률상담·감정은 변호사, 출원·심판 대리는 변리사의 영역이므로 제휴 범위와 역할 분담을 문서로 정해야 합니다. 외주·AI 제작물은 Chain of Title(권리 승계 사슬)을 확인해야 하고, 동종 브랜드를 동시에 맡을 때는 이해상충 고지·NDA가 필요합니다. 사례 연결: 외주 디자이너가 만든 캐릭터를 라이선스했는데 도급계약서에 양도 조항이 없어 원 권리자가 이의를 제기하는 구조, 경쟁사 두 곳의 계약서를 같은 담당자가 검토해 비밀이 섞이는 구조가 대표적입니다. 실무 포인트: ① 산출물에 \"법률의견 아님\" 고지와 근거 조문 병기 ② 제휴 로펌·특허법인의 역할표를 계약에 붙이기 ③ 착수 시 권리 승계 확인서(양도계약·외주계약·AI 도구 약관) 받기 ④ 경쟁 관계 고객은 담당자·자료를 분리하세요.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t11-1.webp","alt":"IP 컨설팅 필수 리스크 3가지 카드 1 / 4","sha":"4d3ac19d21da"},{"src":"assets/cards/2026-11-24-basics-t11-2.webp","alt":"IP 컨설팅 필수 리스크 3가지 카드 2 / 4","sha":"b584ab480195"},{"src":"assets/cards/2026-11-24-basics-t11-3.webp","alt":"IP 컨설팅 필수 리스크 3가지 카드 3 / 4","sha":"cde0ad2baeec"},{"src":"assets/cards/2026-11-24-basics-t11-4.webp","alt":"IP 컨설팅 필수 리스크 3가지 카드 4 / 4","sha":"d86f7e734fb9"}]},{"id":"basics-2026-11-24-12","num":"12","title":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도","fullTitle":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도","level":"실무","text":"핵심: 지정상품은 1~34류가 물건(제품), 35~45류가 서비스입니다. 브랜드·굿즈·콜라보에서 실제로 쓰는 류는 12개 남짓으로, 3류(화장품·향수) · 9류(폰케이스·앱/SW) · 14류(주얼리·키링) · 16류(문구·스티커) · 18류(가방·파우치) · 21류(머그·텀블러) · 25류(의류·모자) · 28류(인형·피규어·완구) · 30류(디저트·커피) · 35류(온라인 소매업·판매대행) · 41류(전시·공연·콘텐츠) · 43류(카페·음식점)입니다. 이름 하나를 지켜도 이 12칸을 각각 채워야 그 상품에서 독점이 생깁니다. 사례 연결: 옷(25류)만 등록한 브랜드가 문구·머그·인형 굿즈를 내면 16·21·28류는 권리 밖이 되어 형태모방·성과도용으로만 다툴 수 있습니다. 반대로 제품류만 내고 35류(온라인 소매업·판매대행) 를 빼면, 자사몰·스마트스토어·팝업에서 같은 이름의 판매업을 막지 못합니다. '제품은 등록했는데 파는 일은 등록 안 한' 구조가 가장 흔한 구멍입니다. 실무 포인트: ① 굿즈 3종 세트(16·21·28류) + 폰케이스(9류) 는 한 번에 출원하세요. ② 25류만 있고 35류가 없으면 쇼핑몰·팝업에서 이름을 지킬 수 없으니 판매 채널을 여는 즉시 35류를 함께 검토하세요. ③ 앱이 있으면 9류(앱·소프트웨어 자체)와 42류(소프트웨어 개발·제공 서비스)를 구분해 지정하고, ④ 팝업·클래스·전시는 41류, 매장에서 직접 파는 일은 43류입니다.","meta":"11/24 · 7장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t12-1.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 1 / 7","sha":"93e6f2fc949d"},{"src":"assets/cards/2026-11-24-basics-t12-2.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 2 / 7","sha":"f64246fe60f3"},{"src":"assets/cards/2026-11-24-basics-t12-3.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 3 / 7","sha":"afd97135a8ec"},{"src":"assets/cards/2026-11-24-basics-t12-4.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 4 / 7","sha":"d7a82134bc8c"},{"src":"assets/cards/2026-11-24-basics-t12-5.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 5 / 7","sha":"658bb9d060e9"},{"src":"assets/cards/2026-11-24-basics-t12-6.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 6 / 7","sha":"a2e06b59b062"},{"src":"assets/cards/2026-11-24-basics-t12-7.webp","alt":"많이 쓰는 지정상품 — NICE 12개 류 실무 지도 카드 7 / 7","sha":"000eb0d6fbe8"}]},{"id":"basics-2026-11-24-13","num":"13","title":"자주 쓰는 계약서 필수 용어 12개","fullTitle":"자주 쓰는 계약서 필수 용어 12개","level":"실무","text":"핵심: 계약은 NDA(비밀유지계약) → LOI·MOU(의향서·양해각서) → Term Sheet(주요조건합의서) → 본계약 순서로 진행되고, 그 안에서 R&R(역할·책임) 로 누가 무엇을 하는지 나눕니다. 본계약에서는 돈의 기준(Gross vs Net Sales 총매출·순매출, Deductions 공제항목, Audit Right 감사권, Kill Fee 중도해지 보상금)과 위험 배분(Indemnification 면책·손해배상, Exclusivity 독점권, Termination & Cure Period 해지·시정기간, Governing Law 준거법·관할)을 확인합니다. 사례 연결: 로열티를 '순매출(Net)' 기준으로 정했는데 공제항목에 물류비·마케팅비·반품·할인까지 넣어 두면, 총매출의 절반만 남는 일이 생깁니다. 감사권(Audit Right)이 없으면 그 계산을 확인할 방법조차 없습니다. 반대로 Kill Fee를 위약금과 같은 것으로 알고 중도 해지했다가 예상 밖의 보상금을 물기도 합니다. 실무 포인트: ① Gross/Net 옆에 공제항목 목록을 붙여 무엇이 빠지는지 숫자로 확인하세요. ② 독점(Exclusivity)이면 최소판매량·MG·해지 조건을 함께 적습니다. ③ 해지 조항에는 시정기간(Cure Period, 보통 30일) 을 넣어 바로 끊기지 않게 합니다. ④ 상대가 해외면 준거법·관할을 우리 법원으로 두거나 중재로 정해 소송 비용을 계산하세요. ⑤ Kill Fee는 '중도 해지 시 얼마를, 언제까지' 보상하는지 금액과 기한으로 적습니다.","meta":"11/24 · 6장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t13-1.webp","alt":"자주 쓰는 계약서 필수 용어 12개 카드 1 / 6","sha":"589bd0db0883"},{"src":"assets/cards/2026-11-24-basics-t13-2.webp","alt":"자주 쓰는 계약서 필수 용어 12개 카드 2 / 6","sha":"d79dbc9c5fff"},{"src":"assets/cards/2026-11-24-basics-t13-3.webp","alt":"자주 쓰는 계약서 필수 용어 12개 카드 3 / 6","sha":"8efa3860628b"},{"src":"assets/cards/2026-11-24-basics-t13-4.webp","alt":"자주 쓰는 계약서 필수 용어 12개 카드 4 / 6","sha":"69aee7cbcc3c"},{"src":"assets/cards/2026-11-24-basics-t13-5.webp","alt":"자주 쓰는 계약서 필수 용어 12개 카드 5 / 6","sha":"7f9d50c738af"},{"src":"assets/cards/2026-11-24-basics-t13-6.webp","alt":"자주 쓰는 계약서 필수 용어 12개 카드 6 / 6","sha":"0692e3a6f027"}]},{"id":"basics-2026-11-24-14","num":"14","title":"라이선싱·비즈니스 업계 용어 15개","fullTitle":"라이선싱·비즈니스 업계 용어 15개","level":"실무","text":"핵심: 현장 용어는 만들기 · 팔기 · 지키기 세 묶음으로 읽으면 대화가 통합니다. 만들기는 SKU(품목 관리 단위) · MOQ(최소주문수량) · OEM(설계는 발주자, 생산은 위탁) vs ODM(설계까지 제조사), 팔기는 B2B · B2C · D2C(브랜드 직판) · Co-branding(공동브랜딩) · Capsule/Drop(한정판 드롭), 지키기는 IP 홀더(권리자) · 에이전트 커미션(중개 수수료) · Style Guide(디자인 사용 규칙) · Approval/QC(샘플·디자인 승인) · Royalty Report(정산 리포트) · Tail-off/Sell-off(종료 후 재고 소진기간)입니다. 사례 연결: MOQ 3,000개로 발주하고 Sell-off 3개월을 받았는데 재고가 절반 남으면, 남은 재고는 계약상 팔 수 없는 물건이 됩니다(또는 재협상 대상). Style Guide에 없는 색으로 굿즈를 찍었다가 승인 반려로 납기를 놓치는 일도 흔합니다. Royalty Report를 받지 않으면 실제 판매량과 정산액이 맞는지 알 수 없습니다. 실무 포인트: ① 견적을 받을 때 MOQ·단가·리드타임을 한 표에 놓고 비교하세요. ② OEM/ODM은 '설계 도면·금형의 권리자가 누구인지'를 계약서에 적습니다. ③ D2C는 채널이 아니라 가격·데이터를 직접 갖는 구조라는 점이 다릅니다. ④ 에이전트 커미션은 요율·지급 시점·환수 조건까지, ⑤ Tail-off는 기간·수량·채널을 숫자로 정해야 재고 분쟁이 없습니다.","meta":"11/24 · 7장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t14-1.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 1 / 7","sha":"e776ad0e699d"},{"src":"assets/cards/2026-11-24-basics-t14-2.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 2 / 7","sha":"aa2135628dca"},{"src":"assets/cards/2026-11-24-basics-t14-3.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 3 / 7","sha":"bcd8b036e427"},{"src":"assets/cards/2026-11-24-basics-t14-4.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 4 / 7","sha":"0bdf4cd56814"},{"src":"assets/cards/2026-11-24-basics-t14-5.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 5 / 7","sha":"cbe3aeb8fe8d"},{"src":"assets/cards/2026-11-24-basics-t14-6.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 6 / 7","sha":"bd9f2d38539e"},{"src":"assets/cards/2026-11-24-basics-t14-7.webp","alt":"라이선싱·비즈니스 업계 용어 15개 카드 7 / 7","sha":"16b87d8693ac"}]},{"id":"basics-2026-11-24-15","num":"15","title":"IP·라이선싱 실무 필수 기관 & 사이트","fullTitle":"IP·라이선싱 실무 필수 기관 & 사이트","level":"실무","text":"핵심: 어디에 물어야 할지가 실무 속도를 가릅니다. 출원·검색은 지식재산처(moip.go.kr, 2025년 10월 1일 옛 특허청에서 승격) · 특허로(patent.go.kr, 전자출원·등록원부·수수료) · 키프리스(kipris.or.kr, 상표·디자인 선행조사·상태조회), 저작권·심판은 한국저작권위원회(copyright.or.kr, 상담·분쟁조정)와 저작권등록시스템(cros.or.kr, 저작물 등록) · 특허심판원(kipo.go.kr/ipt, 거절불복·무효·취소심판), 보호·라이선싱·공정거래는 한국지식재산보호원(koipa.re.kr, 위조상품·해외 K-브랜드 분쟁 지원·산업재산권분쟁조정) · 한국콘텐츠진흥원(kocca.kr, 콘텐츠·캐릭터 라이선싱 지원·표준계약서) · 공정거래위원회(ftc.go.kr, 불공정 약관·표시광고), 해외는 WIPO(wipo.int, 마드리드 국제출원·글로벌 브랜드 DB) · USPTO(uspto.gov, 미국) · EUIPO(euipo.europa.eu, 유럽연합 상표)입니다. 사례 연결: 상대가 판매를 멈추지 않을 때 어디로 가야 하는지 몰라 시간을 버리는 경우가 많습니다. 국내 오픈마켓은 권리침해 신고, 위조상품 유통은 한국지식재산보호원, 해외 판매는 플랫폼 신고와 함께 WIPO·현지 대리인, 계약 조항이 불공정하면 공정거래위원회 신고—이렇게 갈래가 다릅니다. 거절결정을 받았는데 재출원만 반복하면 기간만 날리고, 특허심판원 불복(거절결정불복심판은 결정일부터 3개월) 기한을 놓치게 됩니다. 실무 포인트: ① 이름은 항상 현재 명칭으로 적으세요(특허청 → 지식재산처, 영문 KIPO → MOIP). ② 특허로는 공동인증서·특허고객번호가 있어야 전자출원이 되므로 첫 출원 전에 준비합니다. ③ 선행조사는 키프리스에서 호칭·유사군코드·지정상품 세 갈래로, 조사 결과는 날짜와 함께 저장하세요. ④ 계약서에 인용할 때는 기관의 표준계약서·가이드(콘텐츠진흥원·저작권위원회)를 근거로 붙이면 협상이 빨라집니다. ⑤ 해외는 마드리드(WIPO)로 한 번에 내되, 지정국마다 심사가 따로라는 점을 기억하세요.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t15-1.webp","alt":"IP·라이선싱 실무 필수 기관 & 사이트 카드 1 / 4","sha":"a1ef59b21b35"},{"src":"assets/cards/2026-11-24-basics-t15-2.webp","alt":"IP·라이선싱 실무 필수 기관 & 사이트 카드 2 / 4","sha":"51edec5583eb"},{"src":"assets/cards/2026-11-24-basics-t15-3.webp","alt":"IP·라이선싱 실무 필수 기관 & 사이트 카드 3 / 4","sha":"4c6c693ab65b"},{"src":"assets/cards/2026-11-24-basics-t15-4.webp","alt":"IP·라이선싱 실무 필수 기관 & 사이트 카드 4 / 4","sha":"10aba66c39a1"}]},{"id":"basics-2026-11-24-16","num":"16","title":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항","fullTitle":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항","level":"실무","text":"핵심: 라이선스가 끝나면 상표·캐릭터를 쓸 권리는 종료일 그날로 끝납니다. 상품·포장·상세페이지·SNS·광고 어디에도 더는 쓸 수 없고, 예외는 계약서에 명시한 재고 소진(Sell-off, Tail-off) 기간뿐입니다. Sell-off는 ① 기간 제한(보통 30~90일, 종료일부터 기산) ② 신규 생산·종료 직전 밀어내기 발주 금지 ③ 종료일 기준 재고 목록 사전 보고 ④ 덤핑·과도한 할인 금지(브랜드 가치 보호) 네 조건 안에서만 허용되고, 기간이 지나 남은 재고는 폐기(폐기확인서) 하거나 권리자가 원가로 매입(Buy-back) 합니다. 여기에 소진 기간 판매분까지 포함한 최종 로열티 정산(Royalty Report), 스타일가이드·원본 디자인 파일·금형/몰드 반환, 비밀자료 파기가 함께 남습니다. 사례 연결: 90일 Sell-off를 받은 라이선시가 종료 직전에 대량 발주해 재고를 밀어내고, 기간이 지나도 할인 판매를 이어가다 권리자 감사에서 미보고 판매분과 함께 문제가 되는 구조가 전형적입니다. Sell-off 조항 없이 끝난 계약에서 재고를 계속 팔면 그 자체가 상표권 침해라, 남은 재고 전량을 폐기하고 폐기확인서를 보내야 합니다. 반대로 해지 사유가 라이선시 귀책일 때는 계약서에 \"귀책 해지 시 Sell-off 불인정\" 특약을 넣어 두면 이 밀어내기를 막을 수 있습니다. 실무 포인트: ① Sell-off는 기간·수량·채널·가격 네 가지를 숫자로 적고, 기산일은 \"종료일 익일부터\"처럼 못 박습니다. ② 종료 30일 전까지 재고 목록(수량·SKU·로트) 을 받아 두고 종료 후 실사와 대조합니다. ③ 기간 만료 후 남은 재고는 폐기 또는 Buy-back 중 무엇으로 할지, 비용 부담자까지 미리 정합니다. ④ 최종 정산 보고서는 Sell-off 판매분·반품·할인을 포함해 받고, 미지급분·감사권(Audit Right) 은 종료 후에도 살아 있는 조항으로 남깁니다. ⑤ 비밀유지(NDA)·손해배상·준거법·관할을 존속조항(Survival) 으로 묶어 두지 않으면, 계약서가 끝나는 순간 그 조항도 함께 사라집니다.","meta":"11/24 · 6장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t16-1.webp","alt":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항 카드 1 / 6","sha":"9a28c0f023ef"},{"src":"assets/cards/2026-11-24-basics-t16-2.webp","alt":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항 카드 2 / 6","sha":"24bf8dae3f6e"},{"src":"assets/cards/2026-11-24-basics-t16-3.webp","alt":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항 카드 3 / 6","sha":"464e8d2474da"},{"src":"assets/cards/2026-11-24-basics-t16-4.webp","alt":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항 카드 4 / 6","sha":"8084e17a0f27"},{"src":"assets/cards/2026-11-24-basics-t16-5.webp","alt":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항 카드 5 / 6","sha":"be08436b5c07"},{"src":"assets/cards/2026-11-24-basics-t16-6.webp","alt":"계약 종료 후 필수 의무 — 재고 소진(Sell-off)·폐기·존속조항 카드 6 / 6","sha":"9e9772369e70"}]},{"id":"basics-2026-11-24-17","num":"17","title":"디자인권 vs 저작권 — 제품·캐릭터 보호 기준 차이","fullTitle":"디자인권 vs 저작권 — 제품·캐릭터 보호 기준 차이","level":"초급","text":"핵심: 저작권은 창작하는 순간 자동으로 발생하고(등록은 선택, 안 해도 권리는 생김) 침해 판단에 의거관계 + 실질적 유사성이 필요합니다. 반대로 디자인권은 지식재산처에 출원·등록해야만 생기고(미등록이면 보호 없음), 출원일로부터 20년간 물품의 외관(형상·모양·색채)을 독점하며, 독자적으로 창작했어도 동일·유사하면 침해입니다. 보호 대상도 달라서 저작권은 창작적 표현·캐릭터·일러스트를, 디자인권은 물품의 외관을 지킵니다. 실무 함정은 두 가지 — ① 텀블러·가방·가구 같은 양산품 디자인은 기능과 분리되는 예술성(분리가능성)이 인정돼야 응용미술저작물로 보호되고, ② 디자인은 제품을 공개(출시·SNS·크라우드펀딩)한 뒤 12개월(공지예외주장)이 지나면 등록 자체가 막힙니다. 사례 연결: 캐릭터 원화를 그려 굿즈를 만들면 그림은 그리는 순간 저작권이 생기지만, 텀블러에 인쇄된 그 그림의 '텀블러 외관'은 디자인권으로 따로 등록해야 남의 모방을 막을 수 있습니다. 출시 기사를 내고 SNS에 제품 사진을 올린 뒤 1년이 지나 디자인 출원을 하려 하면 신규성 상실로 거절되는 구조가 가장 흔한 사고입니다. 반대로 짝퉁이 내 디자인을 보고 따라 했는지 증명할 수 없어도, 디자인권이 있으면 독자 창작을 주장해도 침해가 성립합니다. 실무 포인트: ① 캐릭터·패턴은 저작권(원화 등록) + 디자인권(제품별 외관) + 상표권(로고·이름) 3중으로 겹쳐 두세요. ② 디자인 출원은 상세페이지·SNS 공개 전에 접수해 출원일을 확보하고, 불가피하게 공개했다면 12개월 안에 공지예외주장을 붙여 출원합니다. ③ 미처 디자인 출원을 못 하고 출시한 신제품의 짝퉁은 부정경쟁방지법(상품형태 모방, 시제품 제작 후 3년) 으로 대응합니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t17-1.webp","alt":"디자인권 vs 저작권 — 제품·캐릭터 보호 기준 차이 카드 1 / 4","sha":"b9af00a6e1a4"},{"src":"assets/cards/2026-11-24-basics-t17-2.webp","alt":"디자인권 vs 저작권 — 제품·캐릭터 보호 기준 차이 카드 2 / 4","sha":"9201566a17cb"},{"src":"assets/cards/2026-11-24-basics-t17-3.webp","alt":"디자인권 vs 저작권 — 제품·캐릭터 보호 기준 차이 카드 3 / 4","sha":"cb3373f5472f"},{"src":"assets/cards/2026-11-24-basics-t17-4.webp","alt":"디자인권 vs 저작권 — 제품·캐릭터 보호 기준 차이 카드 4 / 4","sha":"e1020eed8d8c"}]},{"id":"basics-2026-11-24-18","num":"18","title":"상표권 핵심 특징 & 상표·디자인·저작권 3자 총비교","fullTitle":"상표권 핵심 특징 & 상표·디자인·저작권 3자 총비교","level":"초급","text":"핵심: 상표권은 창작물을 보호하는 권리가 아니라 '출처 표시(누구 브랜드인지)'를 보호하는 권리입니다. 그래서 '애플'처럼 원래 있던 흔한 단어라도 그 상품에서 식별력만 있으면 등록됩니다. 세 권리를 나란히 놓으면 — 보호 대상은 상표(이름·로고·출처) / 디자인(물품 외관) / 저작권(창작적 표현), 발생·기간은 상표(등록 · 10년마다 갱신해 반영구) / 디자인(등록 · 20년 만료) / 저작권(창작 즉시 · 사후 70년), 독점 범위는 상표(지정상품·유사군 범위) / 디자인(물품 외관의 동일·유사) / 저작권(의거관계 필요)입니다. 상표권에만 있는 제도는 ① 10년 갱신으로 영구 보유 ② 3년 불사용 취소심판(등록만 해두고 안 쓰면 날아감) ③ 선출원주의(먼저 쓴 사람이 아니라 먼저 출원한 사람) ④ 공지예외 없음(이미 팔고 있어도 출원 가능 — 디자인의 12개월 룰과 다름)입니다. 사례 연결: 이름과 로고만 상표로 등록해 두고 제품 외관은 아무 권리도 없이 출시하면, 모양만 그대로 베낀 짝퉁에는 상표권으로 대응할 수 없습니다. 반대로 디자인권만 있으면 상표를 바꿔 붙인 가품에 손을 못 대고, 저작권만 있으면 '보고 그렸다'는 증명 부담이 생깁니다. 세 권리를 겹쳐 둔 브랜드는 같은 침해에 대해 가장 유리한 권리를 골라 청구할 수 있습니다. 실무 포인트: 브랜드 론칭·분쟁 대응은 이름·로고(상표권, 갱신으로 영구) + 제품 외관(디자인권, 출원일부터 20년) + 캐릭터·아트워크(저작권, 자동·사후 70년) 3중 결합으로 설계하세요. 상표는 출시 전에 지정상품(35류 판매업 포함)까지 묶어 출원하고, 등록 후 3년 안에 실제 사용 증거를 쌓아 불사용취소를 막습니다. 디자인은 공개 전 출원, 저작권은 원화 등록으로 창작 시점을 고정해 두면 분쟁에서 셋을 함께 걸 수 있습니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t18-1.webp","alt":"상표권 핵심 특징 & 상표·디자인·저작권 3자 총비교 카드 1 / 4","sha":"89f9e6047557"},{"src":"assets/cards/2026-11-24-basics-t18-2.webp","alt":"상표권 핵심 특징 & 상표·디자인·저작권 3자 총비교 카드 2 / 4","sha":"6adc52e63f05"},{"src":"assets/cards/2026-11-24-basics-t18-3.webp","alt":"상표권 핵심 특징 & 상표·디자인·저작권 3자 총비교 카드 3 / 4","sha":"ba39f4df018f"},{"src":"assets/cards/2026-11-24-basics-t18-4.webp","alt":"상표권 핵심 특징 & 상표·디자인·저작권 3자 총비교 카드 4 / 4","sha":"646fd24696de"}]},{"id":"basics-2026-11-24-19","num":"19","title":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호","fullTitle":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호","level":"초급","text":"핵심: 베른협약(1886년 체결, WIPO 관리, 180여 개국 가입)은 문학·예술 저작물을 나라 사이에서 보호하는 저작권의 기본 조약입니다. 세 가지 원칙 위에 서 있습니다 — ① 무방식주의: 등록이나 © 표시 없이 창작하는 순간 자동으로 권리가 생깁니다(제5조 제2항). ② 내국민대우: 외국인 저작물도 그 나라 국민의 저작물과 똑같이 보호합니다(제5조 제1항). ③ 독립적 보호·최소보호기준: 본국에서 보호를 받는지와 상관없이 보호되고, 보호 범위와 구제 방법은 보호가 주장되는 나라(침해국)의 법을 따르며, 기간은 원칙적으로 저작자 사후 50년 이상(제7조 제1항)입니다. 한국은 1996년 5월 21일 가입서를 기탁해 1996년 8월 21일 발효됐고, 저작권법 제3조가 \"외국인의 저작물은 대한민국이 가입한 조약에 따라 보호된다\"고 받쳐 줍니다. 한국의 실제 보호기간은 사후 70년으로 협약의 최소기준보다 깁니다. 사례 연결: 한국 저작권 등록이 전혀 없는 일본·미국 캐릭터 원화를 국내 업체가 그대로 굿즈에 써도, 그 나라가 베른협약 가입국이면 국내에서 침해를 주장할 수 있습니다. 반대로 상표는 속지주의라서 나라마다 따로 출원해야 하므로, 해외 브랜드가 한국에 상표를 등록해 두지 않았다면 국내에서 상표권으로 막을 수 없습니다. 같은 해외 IP라도 저작권은 자동으로, 상표는 출원한 나라에서만 힘이 생기는 셈입니다. 다만 저작권도 보호의 범위·기간·구제는 침해국 법이 정하므로, \"한국 법으로 미국 침해를 처벌한다\"는 식이 아니라 그 나라 법 안에서 다퉈야 하고, 미국처럼 등록이 소송·법정손해배상의 요건이 되는 나라도 있습니다. 실무 포인트: ① 해외 IP를 받아 쓸 때는 원권리자에서 라이선서로 이어지는 계약 체인을 먼저 확인하세요(수출입 계약서·해외 등록원부). ② 등록이 없어도 권리는 있지만 증명 부담은 내 몫이므로, 원본 파일(PSD·AI)·최초 공표일·제작 과정 기록을 날짜와 함께 남깁니다. ③ 해외 저작권 등록은 선택이지만, 등록해 두면 침해 주장·손해배상 협상에서 훨씬 빨라집니다. ④ 우리 콘텐츠를 해외에서 지킬 때도 같은 원리가 적용되니, 상표는 나라별 출원(마드리드)과 함께 저작권 증거를 세트로 챙기세요.","meta":"11/24 · 6장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t19-1.webp","alt":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호 카드 1 / 6","sha":"03f9ebe44294"},{"src":"assets/cards/2026-11-24-basics-t19-2.webp","alt":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호 카드 2 / 6","sha":"56bdc350bd99"},{"src":"assets/cards/2026-11-24-basics-t19-3.webp","alt":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호 카드 3 / 6","sha":"5f1e08e31568"},{"src":"assets/cards/2026-11-24-basics-t19-4.webp","alt":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호 카드 4 / 6","sha":"ad650e691e1c"},{"src":"assets/cards/2026-11-24-basics-t19-5.webp","alt":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호 카드 5 / 6","sha":"11f3d8e119b1"},{"src":"assets/cards/2026-11-24-basics-t19-6.webp","alt":"베른협약 — 저작권은 해외에서도 등록 없이 자동 보호 카드 6 / 6","sha":"069d0d6ef744"}]},{"id":"basics-2026-11-24-20","num":"20","title":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기","fullTitle":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기","level":"실무","text":"핵심: 상표법 제119조 제1항 제3호는 상표권자·전용사용권자 또는 통상사용권자 중 어느 누구도 정당한 이유 없이 등록상표를 그 지정상품에 대하여 취소심판청구일 전 계속하여 3년 이상 국내에서 사용하지 아니한 경우 누구든지 취소심판을 청구할 수 있게 합니다(2016년 9월 1일 개정으로 이해관계인에서 누구든지로 청구인 적격 확대). 입증책임은 상표권자에게 있어, 피청구인은 청구에 관계되는 지정상품 중 하나 이상을 심판청구일 전 3년 이내에 국내에서 정당하게 사용하였음을 증명해야 하고(제119조 제3항), 못 하면 취소를 면하지 못합니다. '사용'은 상표법 제2조 제1항 제11호의 행위 — 상품·포장에의 표시, 표시한 상품의 양도·인도·전시·수출입, 광고·정가표·거래서류에 표시해 전시·널리 알리는 행위 — 를 말하고, 거래통념상 동일하게 볼 수 있는 형태의 사용은 인정되지만 유사상표 사용이나 유사상품에의 사용은 인정되지 않습니다. 지정상품이 여럿이면 일부만 겨냥해 청구할 수 있고(제119조 제2항), 일부만 사용한 경우 쓰지 않은 상품이 취소 대상이 됩니다. 정당한 이유는 천재지변·법률상 규제처럼 권리자가 통제할 수 없는 객관적·외부적 사유만 인정되고, 영업 부진이나 분쟁 우려 같은 주관적 사정은 인정되지 않습니다. 사례 연결: 내 출원이 선등록 상표 때문에 거절됐는데 그 상표가 3년 넘게 국내에서 실제로 팔린 흔적이 없다면, 불사용취소심판으로 유령 상표를 걷어내고 다시 출원하는 것이 정석입니다. 반대로 고객사 상표를 지키는 쪽이라면 청구가 들어온 뒤에 증거를 만들 수 없으므로, 평소에 날짜가 보이는 국내 사용 증거를 쌓아 두어야 합니다. 실무에서 자주 갈리는 지점은 동일성인데, 영문과 한글 음역이 함께 된 등록상표에서 한쪽만 쓴 경우도 거래통념상 동일하다고 본 대법원 전원합의체 판결(2012후2463)이 있는 반면, 지정상품인 완제품 화장품 대신 원재료를 판매한 것은 동일성 있는 상품 사용으로 보지 않은 판결(대법원 2019후12100)도 있습니다. 실무 포인트: ① 청구 전에 등록 후 3년이 지났는지와 기산일(취소심판청구일 전 계속 3년)을 먼저 확인하세요. ② 지정상품 일부만 겨냥할 때는 같은 유사군코드에 속한 상품을 함께 청구해야, 남은 유사상품이 나중에 다시 거절이유가 되지 않습니다. ③ 사용 증거는 거래명세서·세금계산서(상표 표시), 쇼핑몰 판매 화면 캡처, 패키지·라벨 사진, 광고물·SNS 게시물처럼 날짜와 지정상품이 함께 보이는 형태로 모읍니다. ④ 취소심판과 별개로 거절결정불복심판 기한(거절결정등본 송달일부터 3개월)은 따로 흐르니 일정을 함께 관리하세요. ⑤ 권리자 입장에서는 청구 후에 사용을 시작해도 청구일 전 3년을 채우지 못하므로, 3년치 증거를 상시 보관하는 것이 유일한 방어입니다.","meta":"11/24 · 6장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t20-1.webp","alt":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기 카드 1 / 6","sha":"a6e6ef61b133"},{"src":"assets/cards/2026-11-24-basics-t20-2.webp","alt":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기 카드 2 / 6","sha":"650e12679c49"},{"src":"assets/cards/2026-11-24-basics-t20-3.webp","alt":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기 카드 3 / 6","sha":"20cf392301d9"},{"src":"assets/cards/2026-11-24-basics-t20-4.webp","alt":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기 카드 4 / 6","sha":"797b4ac93c36"},{"src":"assets/cards/2026-11-24-basics-t20-5.webp","alt":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기 카드 5 / 6","sha":"f4ae97adbaba"},{"src":"assets/cards/2026-11-24-basics-t20-6.webp","alt":"불사용취소심판 — 3년 안 쓴 상표를 정리하는 실무 무기 카드 6 / 6","sha":"cc0025a8cb8d"}]},{"id":"basics-2026-11-25-21","num":"21","title":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무","fullTitle":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무","level":"실무","text":"핵심: 분쟁은 두 개의 트랙으로 갑니다. 가처분(보전처분) 은 본안 판결이 나기 전에 법원이 임시로 지위를 정해 주는 절차로, 요건은 ① 피보전권리(상표권·저작권이 있고 침해가 있다는 소명) ② 보전의 필요성(지금 막지 않으면 회복하기 어려운 손해가 생긴다는 소명) 두 가지입니다. 결정에는 통상 담보 제공이 붙고(현금 예탁이나 보증보험증권), 신청 → 심문 → 결정까지 몇 주에서 두세 달이 걸립니다. 반면 본안 소송은 정식 재판으로 1심에 6개월~1년 이상, 항소까지 가면 2~3년이 걸리지만 확정적 결론(금지·폐기·손해배상)을 받습니다. 그래서 정석은 가처분으로 먼저 멈추고 → 본안으로 돈을 받는 병행 구조입니다. 가처분은 잠정적이라 본안에서 뒤집힐 수 있고, 반대로 가처분이 기각되면 본안에도 불리한 신호가 됩니다. 결정에 불복하면 이의신청·항고로 다툽니다. 사례 연결: 온라인 침해는 속도가 전부입니다. 짝퉁·모방 상세페이지·무단 이미지는 상대가 눈치를 채는 순간 수정·삭제되므로, 증거보전(문서·전산자료 사전 조사) → 판매금지·게시중단 가처분 → 본안 손해배상 순으로 시간표를 잡습니다. 반대로 방어하는 쪽은 가처분 신청을 받으면 ① 피보전권리(등록 무효·불사용·권리 범위 밖) ② 보전 필요성(이미 판매 중단·손해 회복 가능) ③ 담보로 인한 상대방 손해를 조목조목 반박하고, 필요하면 담보 제공을 조건으로 한 채무부존재 확인이나 본안에서 권리 무효를 다툽니다. 실무 포인트: ① 가처분은 담보 자금이 준비되어야 실제로 신청할 수 있으니, 의뢰인에게 예상 담보액과 비용을 먼저 알려주세요. ② 신청 전 소명 자료 세트(등록원부·원본 파일·침해 비교표·판매 화면 캡처)를 완성합니다 — 가처분은 '증명'이 아니라 '소명'이지만 자료가 부실하면 바로 기각됩니다. ③ 상대방 심문 기회가 있어 기습은 어렵고, 결정 뒤 집행(직접 강제) 단계까지 일정에 넣습니다. ④ 사건이 약하면 가처분보다 내용증명 → 조정·화해 협상이 효율적입니다(기각 리스크와 비용). ⑤ 형사 고소는 별개 트랙으로, 경고장과 병행하면 협상력이 올라갑니다. ⑥ 전체 타임라인(가처분 2~3개월, 본안 1심 6개월~1년)을 사업 일정과 함께 그려 드리는 것이 상담의 기본입니다.","meta":"11/25 · 6장","date":"2026-11-25","cards":[{"src":"assets/cards/2026-11-25-basics-t21-1.webp","alt":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무 카드 1 / 6","sha":"38bdc7ad4fb5"},{"src":"assets/cards/2026-11-25-basics-t21-2.webp","alt":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무 카드 2 / 6","sha":"e7d0d18f94ba"},{"src":"assets/cards/2026-11-25-basics-t21-3.webp","alt":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무 카드 3 / 6","sha":"fbfc46dd03d2"},{"src":"assets/cards/2026-11-25-basics-t21-4.webp","alt":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무 카드 4 / 6","sha":"2230cc0c6dfe"},{"src":"assets/cards/2026-11-25-basics-t21-5.webp","alt":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무 카드 5 / 6","sha":"b83f426b44ac"},{"src":"assets/cards/2026-11-25-basics-t21-6.webp","alt":"가처분 vs 본안 소송 — 임시 지위를 먼저 잡는 보전처분 실무 카드 6 / 6","sha":"32984d19b0c5"}]},{"id":"basics-2026-11-28-22","num":"22","title":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항","fullTitle":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항","level":"실무","text":"핵심: 첫 미팅은 승패를 말하는 자리가 아니라 ① 누가 권리자(공격)이고 누가 상대방(방어)인지 ② 언제를 기준으로 다툴지 ③ 얼마가 오갔는지 세 축을 고정하는 자리입니다. 권리자(공격) 쪽 4문항 — ㉠ 등록이 살아 있는지(존속기간·갱신일·무효심판 이력) ㉡ 지정상품에 실제로 썼는지(취소심판청구일 전 3년 불사용이면 권리 자체가 흔들림) ㉢ 침해를 처음 안 날과 증거의 첫 날짜(손해배상 소멸시효·가처분 필요성의 기산) ㉣ 상대의 판매 물량·판가·채널(손해액의 판을 잡는 숫자). 상대방(방어) 쪽 4문항 — ㉠ 경고장 도달일과 요구한 답변 기한 ㉡ 권리 무효·불사용·권리범위 밖 항변거리 ㉢ 선사용·독자 개발을 뒷받침하는 날짜 있는 자료 ㉣ 지금도 판매·게시 중인지(계속 팔면 손해가 매일 늘어남). 받아 둘 서류는 등록원부·사용 증거·경고장(봉투 포함)·정산·매출 자료·계약서 다섯 가지입니다. 사례 연결: 권리자라고 생각하고 상담에 왔는데 등록상표가 3년 넘게 지정상품에 쓰이지 않아 무효·취소 위험이 더 큰 경우가 흔하고, 반대로 경고장을 받고 겁에 질려 찾아온 쪽이 사실은 먼저 사용한 쪽이라 상대 등록이 불사용취소 대상인 경우도 많습니다. 첫 통화에서 \"이길 수 있나요\"에 답부터 하면 방향을 잘못 잡고, 등록원부 한 장을 받으면 사건의 절반이 정리됩니다. 실무 포인트: ① 첫 미팅에서는 결론 대신 근거·확률·비용·기간으로 말합니다. ② 변호사법·변리사법 경계를 넘지 않도록 \"법률 자문은 변호사, 출원·심판 대리는 변리사\"라는 역할 구분을 먼저 고지합니다. ③ 예상 비용(가처분 담보·인지대·감정)과 예상 기간을 첫 자리에서 숫자로 제시해야 신뢰가 생깁니다. ④ 받은 서류는 받은 날짜·출처를 적어 스캔해 두고, 원본은 고객사에 돌려줍니다. ⑤ 상대방 상담이면 답변 기한을 달력에 먼저 못 박고, 그 안에 무응답이 기본값이 되지 않게 합니다.","meta":"11/28 · 7장","date":"2026-11-28","cards":[{"src":"assets/cards/2026-11-28-basics-t22-1.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 1 / 7","sha":"e9d703e85dae"},{"src":"assets/cards/2026-11-28-basics-t22-2.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 2 / 7","sha":"711176ba98f4"},{"src":"assets/cards/2026-11-28-basics-t22-3.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 3 / 7","sha":"3fa2f38e9090"},{"src":"assets/cards/2026-11-28-basics-t22-4.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 4 / 7","sha":"faa540253c4f"},{"src":"assets/cards/2026-11-28-basics-t22-5.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 5 / 7","sha":"7c2c39ac35e4"},{"src":"assets/cards/2026-11-28-basics-t22-6.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 6 / 7","sha":"c29cbdeef711"},{"src":"assets/cards/2026-11-28-basics-t22-7.webp","alt":"분쟁 상담 첫 미팅 — 고객사 1차 확인 8문항 카드 7 / 7","sha":"b63668611726"}]},{"id":"basics-2026-11-28-23","num":"23","title":"로열티 누락 감사(Audit)와 합의금 산정","fullTitle":"로열티 누락 감사(Audit)와 합의금 산정","level":"실무","text":"핵심: 로열티는 라이선시가 스스로 계산해 보고하는 돈이라, 감사권(Audit Right) 조항이 없으면 숫자를 검증할 방법이 없습니다. 계약서에는 ① 감사 주기(통상 1년 1회) ② 사전 통지 기간(보통 15~30일) ③ 감사 범위(장부·판매대장·세금계산서·플랫폼 정산서·출고 기록) ④ 비용 부담(차액이 3~5%를 넘으면 라이선시 부담, 아니면 라이선서 부담) ⑤ 감사로 알게 된 정보의 비밀유지 ⑥ 계약 종료 후 감사 가능 기간(12~24개월)을 숫자로 적습니다. 누락은 늘 같은 자리에서 나옵니다 — 위탁생산(OEM) 물량, 자사몰·플랫폼의 정산 수수료 차감 후 금액 기준 계산, 도매·사입 거래, 증정품·샘플, Territory 밖 수출. 합의금은 ① 미지급 로열티 ② 지연이자 ③ 감사 비용 ④ 손해액 추정 순으로 쌓습니다. 법은 세 갈래를 열어 두는데, 상표는 침해자 이익 추정(상표법 제110조 제3항), 합리적으로 받을 수 있는 금액(제4항), 법정손해배상 1억 원·고의 3억 원(제111조) 이고, 저작권은 이익 추정·일반적으로 받을 수 있는 금액(저작권법 제125조 제1·2항), 법정손해배상 1천만 원·고의 5천만 원(제125조의2, 침해 전 등록 필요) 입니다. 고의 침해로 인정되면 법원은 인정된 손해액의 5배까지 배상액을 정할 수 있습니다(상표법 제110조 제7항, 저작권법 제125조 제4항). 사례 연결: 미보고 매출이 3억 원, 계약 로열티가 8%라면 미지급 로열티는 2,400만 원입니다. 여기에 정산 지연이자와 감사 비용이 붙고, 감사에서 \"플랫폼 수수료를 뺀 금액으로 계산했다\"는 식의 계산 기준 다툼이 가장 자주 나옵니다. 합의서에는 미지급액·이자와 함께 감사권 유지와 재발 시 위약벌을 남겨야 같은 일이 반복되지 않습니다. 실무 포인트: ① 감사는 조항이 있을 때만 할 수 있으니 계약 검토 단계에서 감사권·기간·비용 조항을 먼저 확인합니다. ② 자료 요청은 목록으로(판매대장·세금계산서·플랫폼 정산서·출고·재고) 문서로 남기고, 회신 기한을 정합니다. ③ 전수 조사 대신 채널별 표본으로 차이를 잡고, 차이율을 전체로 확장해 산정합니다. ④ 합의금은 로열티 차액만이 아니라 이자·감사비·재발 방지 조항까지 패키지로 협상합니다. ⑤ 협상이 결렬되면 소송에서 손해액 추정 규정을 근거로 청구액을 다시 설계합니다.","meta":"11/28 · 7장","date":"2026-11-28","cards":[{"src":"assets/cards/2026-11-28-basics-t23-1.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 1 / 7","sha":"9139d8ce56b7"},{"src":"assets/cards/2026-11-28-basics-t23-2.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 2 / 7","sha":"bb852bf00ac1"},{"src":"assets/cards/2026-11-28-basics-t23-3.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 3 / 7","sha":"c32f9a7559ad"},{"src":"assets/cards/2026-11-28-basics-t23-4.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 4 / 7","sha":"6aa74216e53e"},{"src":"assets/cards/2026-11-28-basics-t23-5.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 5 / 7","sha":"3351ce91c5bf"},{"src":"assets/cards/2026-11-28-basics-t23-6.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 6 / 7","sha":"5c72773b8595"},{"src":"assets/cards/2026-11-28-basics-t23-7.webp","alt":"로열티 누락 감사(Audit)와 합의금 산정 카드 7 / 7","sha":"68112c4d365d"}]},{"id":"basics-2026-11-28-24","num":"24","title":"표준계약서 미팅 전 점검 7가지","fullTitle":"표준계약서 미팅 전 점검 7가지","level":"실무","text":"핵심: 표준계약서(한국콘텐츠진흥원 캐릭터·라이선스 표준계약서 등)는 그대로 서명하는 문서가 아니라 어디를 고쳐야 하는지 찾는 지도입니다. 미팅 전에 일곱 조항만 번호로 짚어 가면 협상의 절반이 끝납니다 — ① 독점 범위(채널·지역·품목·기간을 숫자로: 온라인몰 포함 여부, 면세점·해외 제외 여부) ② MG·선급금과 회수(Recoup) 구조(어느 로열티에서 어떤 순서로 깎는지) ③ QC·아트워크 승인 기한(영업일 며칠, 기한 안에 답이 없으면 승인으로 볼지) ④ Sell-off(기간·수량·채널·가격 네 가지) ⑤ 위약금(손해배상액의 예정인지, 감액·조정 가능성) ⑥ 해지·시정(cure) 기간(통지 후 며칠 안에 고치면 계약이 살아나는지) ⑦ 존속조항(종료 후에도 남는 NDA·감사권·손해배상·준거법·관할). 사례 연결: '독점'이라고만 적힌 계약은 온라인몰까지 포함인지, 면세점은 빠지는지에서 싸움이 되고, '승인 후 제작'에 기한이 없으면 라이선서가 답을 미루는 동안 시즌이 지나갑니다. '재고 소진 허용'도 기간·수량이 없으면 종료 후에도 계속 파는 통로가 됩니다. 반대로 개정 협상에서 이 일곱 조항 옆에 합의한 숫자를 별지(부속합의서) 로 붙여 두면 담당자가 바뀌어도 해석이 흔들리지 않습니다. 실무 포인트: ① 미팅 전 표준안을 조항 번호까지 출력해 형광펜으로 긋고, 고칠 조항만 한 장 요약으로 만듭니다. ② 상대의 실적(매출·채널·물량)을 먼저 확인해 독점 범위와 MG를 우리 쪽 숫자로 제안합니다. ③ 승인·통지는 영업일 기준으로 적고 공휴일·시차를 확인합니다. ④ 위약금은 손해배상액의 예정으로 두되, 실제 손해가 그보다 크면 별도 청구가 가능한지 문구를 봅니다. ⑤ 서명 권한자(대표·위임장)를 확인하고, 구두 합의는 그 자리에서 별지로 남깁니다.","meta":"11/28 · 7장","date":"2026-11-28","cards":[{"src":"assets/cards/2026-11-28-basics-t24-1.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 1 / 7","sha":"3a71a1d07c9b"},{"src":"assets/cards/2026-11-28-basics-t24-2.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 2 / 7","sha":"2688aecaae6b"},{"src":"assets/cards/2026-11-28-basics-t24-3.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 3 / 7","sha":"3591c42bcea9"},{"src":"assets/cards/2026-11-28-basics-t24-4.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 4 / 7","sha":"cce1951ad180"},{"src":"assets/cards/2026-11-28-basics-t24-5.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 5 / 7","sha":"c7fe75329d97"},{"src":"assets/cards/2026-11-28-basics-t24-6.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 6 / 7","sha":"30768c24e682"},{"src":"assets/cards/2026-11-28-basics-t24-7.webp","alt":"표준계약서 미팅 전 점검 7가지 카드 7 / 7","sha":"a9ecfbe00fc3"}]}]}],"articles":{"updated":"2026-11-28","count":14,"articles":[{"id":"2026-11-28-ip-fishcake","date":"2026-11-28","track":"ip","tag":"디자인권","title":"CJ제일제당·동원F&B '어묵 포장' 소송… 메로나·크린랲 판결로 본 모방의 기준","oneliner":"닮았다는 말은 주장이고, 법은 '누구 제품으로 보이나'를 묻습니다.","source":"조선비즈","published":"2026-11-26","url":"https://biz.chosun.com/topics/topics_social/2026/11/26/EARMNK6OCFG4BGB6TWZLRFRAQA/","summary":"CJ제일제당이 동원F&B '부산어묵' 포장이 자사 등록디자인과 유사하다며 낸 디자인권 침해 금지 소송의 첫 변론이 2026년 11월 26일 서울중앙지법 민사63부에서 열렸습니다. 쟁점은 CJ가 등록한 디자인의 보호범위와 동원 포장이 그 범위에 드는지이고, 동원 측은 '어묵 시장에서 흔한 색과 디자인'이라는 공지·관용 항변으로 맞섭니다. 지식재산처 특별사법경찰은 지난 9월 10일 동원F&B 사무실을 압수수색해 형사 절차가 병행되고 있습니다.","insight":"포장처럼 기능과 형태가 붙은 디자인은 등록 범위가 좁아지기 쉬워, '디자인권 + 부정경쟁(상품표지 혼동)'을 겹쳐 설계해야 합니다. 메로나 사건은 1심 기각을 항소심이 소비자 조사(인지도 89.1%·오인 79.2%)로 뒤집었습니다.","points":[{"label":"공격 측(권리자)","text":"등록원부·도면·디자인 설명으로 보호범위를 고정하고, 요부 3개 이내의 대비표·판매광고 이력·혼동 조사(인지도·오인율)를 갖춘 뒤 경고장→가처분→본안 순서로 갑니다. 손해액은 양도수량·침해자 이익·실시료 상당액 세 가지 추정(제115조)에 과실 추정(제116조)까지 붙어 유리합니다."},{"label":"방어 측(피고)","text":"공지·관용·기능 불가결 형상을 걷어낸 뒤 남는 요부가 무엇인지 다투고, 신규성·창작비용이성 무효심판과 제94조 효력 제한·이용관계를 검토합니다. 공지 증거는 날짜가 찍힌 해외 카탈로그·옛 기사·SNS 게시물이라야 하며, 손해액에서는 총매출에서 기존 브랜드 기여도를 분리해 기초액을 낮춥니다."}]},{"id":"2026-11-28-lic-sealook","date":"2026-11-28","track":"license","tag":"라이선스","title":"핑크퐁 '씰룩', 日 수족관 전시·유럽 패션·포토부스 14개국… 한 캐릭터에 세 개의 계약","oneliner":"수족관은 체험, 유럽은 옷, 포토부스는 사진 — 계약을 채널로 쪼갭니다.","source":"뉴시스","published":"2026-11-28","url":"https://www.newsis.com/view/NISX20261127_0003885909","summary":"더핑크퐁컴퍼니가 애니메이션 '씰룩'으로 일본 센다이 우미노모리 수족관에서 한국 IP 최초 특별 기획전을 열고(내년 2월 14일까지), 유럽 패션 라이선싱 기업 에르베(ERVE)와 파트너십을 맺어 내년 5월 의류·액세서리를 냅니다. 글로벌 포토부스 브랜드 포토이즘과는 14개국 197개 매장에서 씰룩 포토프레임을 출시해 12월 31일까지 운영합니다.","insight":"같은 캐릭터를 지역·카테고리·기간이 다른 세 개의 채널로 쪼개 계약한 구조입니다. 라이선서는 채널 간 잠식과 가격 충돌을 막는 배타 범위를, 라이선시는 승인 리드타임과 채널 충돌 금지 조항을 확보해야 합니다.","points":[{"label":"라이선서(권리자)","text":"전시(체험)·패션(제품)·포토부스(서비스)로 사용 형태를 나눠 독점 범위를 좁게 주고, 지역(일본/유럽)·기간(2월·12월)·카테고리를 분리해 서로 잠식하지 않게 설계합니다. 대신 채널별 아트워크 승인과 최소실적·판매 보고를 붙여 통제력을 유지해야 합니다."},{"label":"라이선시(실시권자)","text":"같은 IP가 다른 채널에 동시에 풀리면 마케팅 투자 회수가 어려우므로, 카테고리 배타·채널 충돌 금지·경쟁 IP 제한을 문구로 확보해야 합니다. 승인 기한과 무응답 처리, 출시 일정 역산 리드타임, 종료 후 Sell-off 기간도 함께 정합니다."}]},{"id":"2026-11-27-ip-gompyo","date":"2026-11-27","track":"ip","tag":"상표","title":"'곰표국수' 결국 등록취소… 사용을 허락한 상표권자가 진 이유","oneliner":"사용을 허락한 대가로 내 상표가 사라졌다. 감독은 계약서 밖에서도 해야 한다.","source":"챗변(ChatByun) · 서권식 변호사","published":"2026-11-26","url":"https://chatbyun.com/p/2009hu3329","summary":"대한제분과 영동식품(A)은 각각 '곰표' 관련 상표권을 가졌고, 대한제분은 가공식품으로 넓히려 2021년 A에게 2년짜리 '곰표' 사용허락을 받아 국수를 납품받았습니다. 계약이 2023년 갱신 없이 끝난 뒤 A 측 사용업체들이 피자·브리또·토스트·왕만두 포장에 '곰표'를 계속 썼고, 대한제분이 혼동을 이유로 A의 '곰표국수'(등록 제113134호) 등록취소를 청구했습니다. 특허심판원(2025.11.27. 취소심결)에 이어 특허법원(2026.9.15. 선고 2026허10002)도 취소 심결을 유지했습니다 — A가 포장 디자인 일부를 바꾸라고 지시한 것만으로는 소비자 혼동을 막는 '상당한 주의'를 다했다고 볼 수 없다는 판단입니다(확정 여부는 미확인).","insight":"상표법 제119조 제1항 제2호는 사용권자가 지정상품·유사상품에 등록상표와 유사한 표장을 써서 출처를 혼동시키면 그 상표권자의 등록 자체를 취소할 수 있게 합니다. 브랜드를 빌려주는 순간 감독 의무가 생긴다는 뜻이라, 포장·광고 사전승인 조항과 승인·시정 기록이 곧 권리 유지 장치가 됩니다.","points":[{"label":"공격 측(권리자)","text":"① 1955년 등록 이후 밀가루 분야의 사용 실적과 포장 특징(글씨체·색 조합·곰 자세)을 묶어 선사용·인지도를 증명합니다. ② 실제 판매 화면과 소비자 인식 자료로 혼동을 구체화합니다. ③ 침해 본안보다 등록취소심판이 빠른 지렛대입니다 — 상대 등록이 없어지면 이후 사용은 권원이 사라집니다. ④ 상표권 침해·부정경쟁(가목) 청구를 병행해 금전 회수까지 갑니다."},{"label":"방어 측(피고)","text":"① '상당한 주의' 항변을 기록으로 소명합니다 — 표장 사용 가이드, 포장 사전승인 이력, 시정·중단 조치, 시중 점검 보고서(디자인 변경 지시만으로는 부족). ② 지정상품과 실사용 상품의 동일·유사성을 항목별로 다퉈 취소 범위를 좁힙니다. ③ OEM·납품 계약상 묵시적 사용허락이 있었다는 항변을 검토합니다. ④ 일부 지정상품만 취소되면 남은 범위로 사업을 유지하고, 필요하면 표장을 바꿔 재출원합니다."}]},{"id":"2026-11-27-lic-nobrand","date":"2026-11-27","track":"license","tag":"라이선스","title":"노브랜드, 캐릭터 '오리덕후'와 16종… PB가 캐릭터 IP로 매대를 채운다","oneliner":"티슈부터 양말까지 16종, 캐릭터 하나가 매대 한 칸을 통째로 바꾼다.","source":"아이러브캐릭터","published":"2026-11-26","url":"https://www.ilovecharacter.com/news/newsview.php?ncode=1065601680596527","summary":"노브랜드가 인기 캐릭터 '오리덕후'와 협업한 신상품 16종을 선보였습니다. 포켓 티슈·핸드크림·쿠션 중목양말 3족·데일리 라인 노트처럼 생활용품에서 패션·리빙까지 비식품군을 넓힌 구성입니다. 노브랜드는 지난해 '슈퍼말차' 협업을 시작으로 여러 브랜드·IP와 손잡아 올 1~9월 협업 상품 누계 매출이 전년 동기 대비 2배 이상 늘었고, 지난해 10월 아우어 베이커리 협업 상품은 출시 3개월 만에 누적 85만 개를 넘겼습니다.","insight":"권리자에게는 카테고리를 넓혀 로열티 베이스를 키우는 전형이고, PB 유통사에게는 자체 브랜드의 가격 경쟁력을 유지하면서 회전과 객단가를 올리는 수단입니다. 다만 SKU가 16종으로 늘면 표장 사용 승인·품질 검사·채널 관리 비용이 함께 늘어, 계약에서 승인 절차와 불합격·리콜 책임을 숫자로 정해 두지 않으면 마진이 사라집니다.","points":[{"label":"라이선서(캐릭터 권리자)","text":"① 16종 각각의 아트워크·샘플 사전승인과 표장 사용 가이드(색·여백·변형 금지), 승인 기한·거절 사유를 정합니다. ② 생활용품·패션잡화는 로열티 기준과 시세가 달라 SKU군별로 요율·MG를 나눕니다. ③ 저가 잡화에 캐릭터가 붙으면 브랜드가 희석되므로 품질 기준 미달 시 승인 철회·해지 조항이 필요합니다."},{"label":"라이선시(PB 유통사)","text":"① 승인 지연이 곧 판매 차질이므로 승인 기한(예: 10영업일)과 기한 내 무응답 처리, 시즌 상품 역산 일정을 계약서에 붙입니다. ② 마진이 얇아 순매출 공제 항목(반품·할인·PB 자체 할인)을 목록으로 한정해야 합니다. ③ 계약 종료 시 미판매 재고의 Sell-off 기간과 라벨 제거 비용 부담을 미리 정합니다. ④ 리콜·제조물책임은 제조·판매자 부담으로 명확히 합니다."}]},{"id":"2026-11-26-ip-sobaba","date":"2026-11-26","track":"ip","tag":"부정경쟁","title":"bhc·BBQ 다음은 굽네… CJ제일제당 냉동치킨 '소바바', 신제품마다 '닮은꼴' 논란","oneliner":"뿌링클이 뿌리즐링이 되는 순간, 레시피보다 이름이 먼저 문제됩니다.","source":"시사저널e","published":"2026-11-24","url":"https://www.sisajournal-e.com/news/articleView.html?idxno=425293","summary":"CJ제일제당 냉동치킨 '소바바'의 뿌리즐링·황금홀릭·고추 바삭바삭이 bhc 뿌링클, BBQ 황금올리브, 굽네 고추바사삭과 이름·콘셉트가 닮았다는 지적이 이어졌습니다. 한국프랜차이즈산업협회는 '대기업이 중소 외식 브랜드의 인지도에 무임승차한다'며 공식 입장문으로 시정을 요구했고, CJ제일제당은 자체 기술로 개발하고 출시 전 법무 검토를 거쳤으며 판매 채널·소비 방식이 다르다고 반박했습니다. 아직 소송이 아니라 경고장·시정 요구 단계이고, 냉동치킨이 배달 치킨의 대체재가 되며 채널 경계가 무너진 점이 쟁점입니다.","insight":"등록상표가 없어도 주지성과 혼동이 증명되면 가목(상품표지 혼동)이, 상당한 투자로 만든 성과를 그대로 얹혀 먹었다면 파목(성과 무단사용)이 붙습니다. 반대로 '채널이 다르다'는 항변은 소비자의 구매 수요가 겹치는 순간 약해지므로, 양쪽 모두 판매 데이터와 소비 방식 자료를 먼저 확보해야 합니다.","points":[{"label":"공격 측(권리자)","text":"문제된 제품명·콘셉트의 최초 사용 시점과 광고·매출 자료로 주지성과 '상당한 투자'를 입증하고, 소비자 혼동 사례(검색·문의·리뷰)를 모아 내용증명으로 중단·자료 보존을 요구한 뒤 가목과 파목을 함께 청구합니다. 등록상표가 있으면 상표권 침해를 주청구로 올립니다."},{"label":"방어 측(피고)","text":"자체 개발 기록(레시피·시식 테스트·출시 전 법무 검토)으로 독자 개발을 소명하고, 채널·소비 방식·가격대가 달라 혼동이 없다는 자료를 만들며, '고추 바삭바삭'처럼 흔한 맛 묘사는 식별력이 약하다는 점을 근거로 삼습니다. 다만 경고를 받은 뒤 계속 판매하면 고의·손해액이 커지므로 회신과 판매 조정은 서면으로 남깁니다."}]},{"id":"2026-11-26-lic-chiikawa","date":"2026-11-26","track":"license","tag":"캐릭터·테마파크","title":"극장 이어 유통가 점령한 '먼작귀' 치이카와… 에버랜드·더현대에도 떴다","oneliner":"정가 2만4,400원이 44만 원 — 채널을 안 나누면 로열티만 새어 나갑니다.","source":"한국일보","published":"2026-11-25","url":"https://www.hankookilbo.com/news/article/A2026112514210005817","summary":"에버랜드가 일본 캐릭터 '먼작귀(치이카와)'와 12월 19일부터 2027년 3월 24일까지 겨울 축제를 열고, 캐리비안 베이 워터파크 협업(12월 3일~3월 1일)도 함께 진행합니다. 국내 테마파크·워터파크 협업은 처음이고 더현대 팝업은 내년 1월까지 이어집니다. 크림에서는 영화 개봉 직후 검색량이 14배 뛰고 정가 2만4,400원 키링이 최고 44만 원에 거래됐으며, 중국 한정 굿즈를 사려는 타오바오 국내 이용자는 월 102만 명으로 역대 최고를 찍었습니다. 업계에서는 협업을 하려면 최소 반년을 기다려야 한다는 말이 나옵니다.","insight":"수요가 공급을 앞지르는 순간 라이선스의 값은 요율이 아니라 범위에서 갈립니다. 테마파크·팝업·리셀·해외 직구라는 네 채널이 한 캐릭터에서 동시에 움직이므로, 독점 범위와 Territory·채널 제한을 문구로 정해 두지 않으면 리셀 프리미엄과 병행수입이 계약 밖에서 수익을 가져갑니다.","points":[{"label":"라이선서(권리자)","text":"카테고리·채널·기간을 쪼개 비독점으로 여러 곳에 허락하고 경쟁 입찰로 MG를 올립니다. 독점은 대형 채널 한 곳에만 주고 최소실적 미달 시 비독점 전환·해지 조항을 붙입니다. 리셀·해외 직구는 계약 채널 밖이므로 정품 인증·MSRP·재판매 금지로 통제합니다."},{"label":"라이선시(실시권자)","text":"독점이 아니면 마케팅 투자 회수 계획부터 다시 세우고, 독점이면 채널 배타 범위(편의점·면세점·온라인 제외 여부)와 Territory 정의(배송지 기준)를 문구로 확보합니다. MG는 채널별로 쪼개고, 원 라이선서가 같은 채널에 경쟁 라이선시를 들이지 못하게 하는 조항을 넣습니다."}]},{"id":"2026-11-25-ip-code","date":"2026-11-25","track":"ip","tag":"저작권","title":"\"오탈자까지 똑같으면 침해\" … 소스코드 도용, 법원은 아이디어가 아니라 '표현'을 본다","source":"한국저작권위원회 계열 실무 칼럼(kdce.or.kr)","published":"2026-11-24","url":"https://www.kdce.or.kr/columns/software-source-code-copyright-protection-guide-1","summary":"소프트웨어 소스코드는 작성하는 순간 저작권이 생기는 컴퓨터프로그램저작물이지만, 보호되는 것은 기능·알고리즘이 아니라 구체적으로 표현된 코드다. 법원은 ① 아이디어·표준적 표현(표현의 합체)을 걷어내고 ② 의거성(피고가 원고 코드에 접근해 그것을 토대로 작성했는지) ③ 실질적 유사성 순으로 판단한다. 저작자가 실수로 남긴 오탈자까지 그대로 남아 있던 사안은 침해로, 기능은 같아도 언어나 내부 구조를 다르게 재작성한 사안은 침해가 부정됐다. 외주 개발은 계약서에 귀속 특약이 없으면 대금을 다 냈어도 저작권이 개발사에 남는다.","insight":"승부는 '비슷하다'가 아니라 '어디까지가 표현인가'에서 갈린다. 발주사가 돈을 냈다는 사실만으로는 권리가 넘어오지 않으므로, 소송보다 계약서의 귀속 조항이 먼저다.","points":[{"label":"공격 측(권리자)","text":"창작 증거(작업 파일·커밋 로그·최초 공표일), 접근 경로(이직·외주·공유 폴더·납품 이력), '지문' 증거(오탈자·변수명·주석·특이 로직)를 세트로 만든다. 저작권 입증이 버거우면 영업비밀(비밀관리성)을 병행 청구원인으로 검토한다."},{"label":"방어 측(피고)","text":"아이디어·표현의 합체·표준 라이브러리·오픈소스를 비교 대상에서 먼저 여과해 달라고 요구하고, 설계 문서·커밋 히스토리로 독자 개발을 소명한다. 발주사라면 계약서의 귀속·2차 이용 조항으로 방어선을 먼저 친다."}],"oneliner":"변수명까지 똑같다면 그건 우연이 아니라 자백이다."},{"id":"2026-11-25-lic-littleatom","date":"2026-11-25","track":"license","tag":"컬렉터블","title":"'리틀아톰' 한정판 카드에 블록체인… 펑크비즘·레어온·소니움 3자 동맹","source":"메가경제","published":"2026-11-24 17:40","url":"https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065602432382627","summary":"IP 라이선싱·실물 컬렉터블 기업 레어온이 데즈카 프로덕션과 라이선스 계약을 맺고 내놓는 공식 '리틀아톰(GO ASTRO BOY GO!)' 카드에 개별 시리얼 번호와 발행 이력을 블록체인(소니움)에 기록한다. 스마트 컨트랙트는 펑크비즘이 개발·배포하며, 12월 공식 앱으로 정품 여부를 확인하고 가상자산 구매나 지갑 연결 없이 쓸 수 있다. 모든 제품은 한정 수량·개별 시리얼·위조 방지 방식이다.","insight":"발행·유통 기록이 시스템에 남으면 초과 생산(overrun)과 미보고 판매 위험이 줄지만, 그 기록을 '정산의 기준 자료'로 계약서에 지정해야 실제 권리가 된다. 라이선시는 기술 파트너 의존 리스크와 계약 종료 후 데이터 사용(존속 조항)을 함께 봐야 한다.","points":[{"label":"라이선서(데즈카)","text":"기술 파트너 사용의 사전 승인, 발행 수량 상한과 시리얼 관리 의무, 발행 데이터의 소유·열람권, 위조 대응 의무, '이 기록을 정산 기준 자료로 본다'는 문구를 계약서에 넣는다."},{"label":"라이선시(레어온)","text":"한정판·정품 인증으로 프리미엄과 2차 시장 신뢰를 얻는 대신, 파트너 장애·교체 시 인증 중단 리스크, 종료 후 시리얼·이력 데이터 사용권, 추가 원가, 기록이 곧 판매량이 되는 부담을 진다."}],"oneliner":"카드에 블록체인을 얹으니 희소성이 두 배로 비싸졌다."},{"id":"2026-11-24-ip-nomorepizza","date":"2026-11-24","track":"ip","tag":"상표","title":"특허법원 \"로고 속 작은 문구는 요부가 아니다\"… '노모어피자' 상표 거절 취소","source":"블로터","published":"2026-11-23","url":"https://blt.kr/column/?bmode=view&idx=175866349","summary":"노모어피자가 '피자를 든 토끼 캐릭터 + no more pizza'를 결합해 출원했지만, 기존 등록표장('PIZZA ICONIC' 아래 'NO MORE PIZZA')과 비슷하다며 거절됐다. 특허법원은 선등록 표장의 핵심(요부)은 위쪽 'PIZZA ICONIC'이고 아래 작게 적힌 문구는 광고 구호 정도라며 거절 심결을 취소했다.","insight":"거절이유는 내 표장만의 문제가 아니라 '남의 표장 안에서 그 문구가 어디에, 얼마나 크게 놓였는지'에서 갈린다. 비교 대상 표장의 요부를 뜯어보는 작업이 출원 전에 필요하다.","points":[{"label":"공격 측(출원인)","text":"선등록 표장의 요부(위치·크기·색·구성)를 분석한 비교 자료를 준비하고, 문제가 된 부분이 식별력 없는 부기적 표현임을 입증한다. 거절결정불복심판은 송달일부터 30일 안이다."},{"label":"방어 측(권리자)","text":"자기 표장에서 실제로 출처를 표시하는 부분(요부)이 어디인지 사용 실적과 함께 보여 줘야 한다. 요부가 부기적 문구로 흔들리면 권리범위도 같이 좁아진다."}],"oneliner":"작게 써놨다고 안 보이는 건 아니다, 다만 요부는 아니었을 뿐."},{"id":"2026-11-24-lic-gravity","date":"2026-11-24","track":"license","tag":"굿즈·POD","title":"그라비티, 태국 쇼피에 '라그나로크' IP 공식 스토어… 폰케이스 78종","source":"디지털데일리","published":"2026-11-23","url":"https://www.ddaily.co.kr/page/view/2026112315144927248","summary":"그라비티가 라이선싱 브랜드 '프린티즐'과 제작·판매 계약을 맺고 태국 쇼피 공식 스토어에서 라그나로크 폰케이스 78종(개당 약 3만 1천 원, 주문형 생산)을 판매하기 시작했다. 정가의 10%면 개당 약 3,100원, 5%면 약 1,550원이 로열티가 된다.","insight":"제조·판매를 통째로 맡기는 아웃바운드 라이선싱은 채널을 가장 빨리 넓히는 대신, 로열티를 어떻게 세는지(개당 정액 vs 매출 %)가 수익을 좌우한다. 개수가 정확히 집계되는 POD 구조는 개수당 정액이 자연스럽다.","points":[{"label":"라이선서(그라비티)","text":"판매 채널·국가·기간을 한정하고, 개수당 정액이면 최소 판매 수량과 리포트 주기를 함께 정한다. 플랫폼 정산서 열람권(감사)도 확보한다."},{"label":"라이선시(프린티즐)","text":"디자인 승인 절차와 리드타임, 반품·불량 처리 기준을 먼저 정하고, 독점 여부와 갱신 조건을 계약에 묶는다."}],"oneliner":"라그나로크 폰케이스 78종, 태국 팬 지갑에 직통으로 꽂힌다."},{"id":"2026-11-23-ip-ador","date":"2026-11-23","track":"ip","tag":"상표","title":"어도어, 미국 상표 2건에 이의제기… 홍콩 의류몰 '어도어닷컴'과 충돌","source":"테나시아","published":"2026-11-22","url":"https://www.tenasia.co.kr/article/2026112222144","summary":"뉴진스 소속사 어도어가 미국 USPTO에 출원한 의류·연예 매니지먼트 상표 2건에 대해 홍콩 의류몰 '라이트인더박스(어도어닷컴)'가 모방·가치 훼손을 이유로 이의를 제기했다. 어도어는 내년 1월 15일까지 답변서를 제출해야 하고, 주얼리 업체(ADORE)와도 합의를 논의 중이다.","insight":"미국은 출원공고 뒤 이의신청 기간에 제3자가 모방·희석을 이유로 직접 나설 수 있다. 해외 출원 전에 선행상표 조사와 지정상품 정리가 끝나 있어야 답변서 작성도 빨라진다.","points":[{"label":"공격 측(이의신청인)","text":"유사 상호·도메인 사용으로 인한 출처 혼동과 희석을 근거로, 자기 사용 실적과 지정상품 겹침을 함께 제시한다."},{"label":"방어 측(출원인)","text":"지정상품을 좁히거나 문제되는 류를 일부 포기하고, 공존 동의(consent) 가능성을 검토한다. 답변서 기한(1/15)을 넘기면 출원이 그대로 끝난다."}],"oneliner":"한국에선 먼저 출원한 자, 미국에선 먼저 팔아본 자가 이긴다."},{"id":"2026-11-23-ip-quickbeam","date":"2026-11-23","track":"ip","tag":"상표","title":"삼성 'QuickBeam' 美 상표, 3년 미사용 취소 위기","source":"더비즈","published":"2026-11-22","url":"https://www.the-biz.co.kr/news/articleView.html?idxno=731810","summary":"홍콩 아스테라가 삼성전자가 미국에서 보유한 상표 'QuickBeam'이 3년 이상 실제로 사용되지 않았다며 등록 말소(취소)를 청구했다.","insight":"미국도 오랜 기간 사용하지 않은 상표는 포기(abandonment)로 추정돼 취소 위험이 커진다. 국내 불사용취소심판과 구조가 같아, 권리자는 날짜가 보이는 사용 증거를 상시 쌓아 둬야 한다.","points":[{"label":"공격 측(취소 청구인)","text":"등록 후 3년 이상 사용 흔적이 없다는 점과 시장에서 쓰이지 않는 사실을 증거로 제시한다."},{"label":"방어 측(권리자)","text":"거래명세서·광고물·패키지처럼 날짜와 지정상품이 함께 보이는 사용 증거를 모으고, 일부 상품이라도 실제 사용을 소명한다."}],"oneliner":"3년 안 쓴 상표는 창고 정리 대상, 삼성도 예외는 없다."},{"id":"2026-11-23-ip-npe","date":"2026-11-23","track":"ip","tag":"특허","title":"네이버·카카오, 美 NPE에 '키워드 기반 커뮤니티' 특허침해 피소","source":"더비즈","published":"2026-11-22","url":"https://www.the-biz.co.kr/news/articleView.html?idxno=731803","summary":"한국인 발명가의 특허를 사들인 미국 NPE(아이소밸런트)가 '키워드 기반 커뮤니티' 특허를 침해했다며 네이버와 카카오를 텍사스 연방법원에 제소했다.","insight":"NPE는 제품을 만들지 않아 금지청구보다 합의금이 목적이다. 초기에 무효 자료를 얼마나 빨리 모으느냐가 협상 비용을 좌우한다.","points":[{"label":"공격 측(NPE)","text":"특허 청구항을 상대 서비스 기능에 하나씩 맵핑해 침해 주장을 세우고, 관할( 텍사스 )과 합의 압박을 카드로 쓴다."},{"label":"방어 측(피소 기업)","text":"선행기술 조사로 무효심판(IPR)을 준비하고, 청구항 축소 해석과 비침해 논리를 함께 세운다. 관할 이전과 조기 합의의 비용 비교도 초기에 한다."}],"oneliner":"남의 특허로 남의 앱을 두드리는 NPE, 텍사스 법원은 늘 만원이다."},{"id":"2026-11-23-lic-saeukkang","date":"2026-11-23","track":"license","tag":"식품×패션","title":"농심 새우깡 55주년 × 무신사 스탠다드… 스낵 IP로 티셔츠 99가지 조합","source":"NBN TV","published":"2026-11-21","url":"https://www.nbntv.co.kr/news/articleView.html?idxno=4027776","summary":"11월 27일부터 무신사 스탠다드 서울숲·명동중앙점에서 새우깡·포테토칩 등 스낵 IP 그래픽을 태블릿으로 골라 99가지 조합의 티셔츠를 만드는 체험형 콜라보가 열린다. 롯데리아×무신사, 배스킨라빈스×젤라또피케처럼 식품×패션 협업이 늘고 있다.","insight":"식품 IP를 패션 카테고리로 '번역'하는 아웃바운드 협업이다. 원권리자는 로열티와 브랜드 노출을, 라이선시는 화제성과 객단가를 얻는 대신, 카테고리·기간·수량 상한·디자인 승인이라는 울타리가 성패를 가른다.","points":[{"label":"라이선서(농심)","text":"사용 카테고리를 패션 잡화로 한정하고, 디자인 승인 절차와 생산 수량 상한, 로열티 기준(정가·출고가·순매출)을 못 박는다."},{"label":"라이선시(무신사)","text":"협업 기간과 최소보장금(MG), 독점 여부, 행사 종료 후 재고 처리(Sell-off) 조건을 먼저 정한다."}],"oneliner":"과자 봉지가 옷이 됐다, 99가지 조합에 추억까지 얹어서."}]},"glossary":{"updated":"2026-11-28","count":79,"terms":[{"ko":"선출원주의","en":"First-to-File","field":"상표·IP","meaning":"같은 상표가 겹치면 먼저 출원한 사람에게 권리를 주는 원칙.","tip":"먼저 쓰고 있어도 출원이 늦으면 뺏긴다. 이름을 정하자마자 해당 류로 출원한다."},{"ko":"선사용주의","en":"First-to-Use","field":"상표·IP","meaning":"실제로 먼저 사용한 사람에게 권리를 인정하는 원칙(미국 등).","tip":"미국은 사용 증거가 중요해 한국보다 사용 기록·판매 자료를 더 꼼꼼히 남긴다."},{"ko":"상표 vs 상호","en":"Trademark vs Trade Name","field":"상표·IP","meaning":"상표는 상품·서비스의 이름표, 상호는 영업 주체(회사)의 이름.","tip":"상호 등기만으로 상표권이 생기지 않는다. 간판·쇼핑몰명도 상표 출원 대상이다."},{"ko":"식별력","en":"Distinctiveness","field":"상표·IP","meaning":"다른 상품과 구별되게 하는 힘. 상표 등록의 핵심 요건.","tip":"'좋은', '최고', 보통명칭은 식별력이 없어 거절된다. 만든 말(조어)일수록 강하다."},{"ko":"지정상품","en":"Designated Goods","field":"상표·IP","meaning":"출원할 때 권리를 미칠 상품·서비스를 류별로 특정한 것.","tip":"실제 파는 품목보다 좁게 지정하면 그 밖 품목은 보호받지 못한다."},{"ko":"니스 분류","en":"NICE Classification","field":"상표·IP","meaning":"상품 34류·서비스 11류, 모두 45류로 나눈 국제 상품 분류.","tip":"같은 이름이라도 25류(의류)와 35류(유통·판매업)는 별개 상표다. 온라인몰은 35류를 따로 본다."},{"ko":"절대적 거절이유","en":"Absolute Grounds","field":"상표·IP","meaning":"상표 자체의 성질 때문에 거절되는 사유(식별력 없음, 공서양속 위반 등).","tip":"통지서에 '절대적'이 뜨면 상표를 바꿔 재출원하는 편이 빠르다."},{"ko":"상대적 거절이유","en":"Relative Grounds","field":"상표·IP","meaning":"먼저 등록된 남의 상표와 비슷해 거절되는 사유.","tip":"선행상표를 검색해 지정상품을 조정하거나, 권리자에게 사용 동의서를 받는 방법이 있다."},{"ko":"출원공고","en":"Publication of Application","field":"상표·IP","meaning":"심사를 통과한 상표를 공개해 이의를 받는 절차.","tip":"공고 기간에 내 상표와 비슷한 출원을 발견하면 이의신청으로 막는다."},{"ko":"이의신청","en":"Opposition","field":"상표·IP","meaning":"출원공고된 상표에 대해 등록 전에 이의를 제기하는 절차.","tip":"공고일부터 2개월 안에 이유와 증거를 갖춰 제출한다."},{"ko":"마드리드 국제출원","en":"Madrid Protocol","field":"상표·IP","meaning":"출원서 하나로 여러 나라에 상표를 출원하는 국제 제도.","tip":"기초출원(한국)이 살아 있어야 하고, 5년 안에 무효가 되면 국제등록도 흔들린다(중앙공격)."},{"ko":"불사용취소심판","en":"Cancellation for Non-Use","field":"상표·IP","meaning":"등록 후 3년 이상 사용하지 않은 상표를 취소시키는 심판.","tip":"경쟁사의 방해 상표를 정리하는 무기다. 내 상표는 3년마다 사용 증거를 남겨 둔다."},{"ko":"의거관계","en":"Access","field":"상표·IP","meaning":"저작권 침해 판단의 첫 단계. 피고가 원고 작품을 볼 수 있었는지.","tip":"비슷해도 상대가 내 것을 본 적 없다는 증거가 나오면 의거관계가 부정된다."},{"ko":"실질적 유사성","en":"Substantial Similarity","field":"상표·IP","meaning":"보호받는 표현 부분이 실질적으로 비슷한지 보는 판단.","tip":"아이디어·소재는 보호되지 않는다. 겹치는 부분이 '보호되는 표현'인지부터 따진다."},{"ko":"표현의 합체","en":"Merger Doctrine","field":"상표·IP","meaning":"아이디어를 표현하는 방법이 하나뿐이면 그 표현은 보호되지 않는다는 원리.","tip":"기능상 어쩔 수 없는 디자인·문구는 침해 주장이 약하다."},{"ko":"공정이용","en":"Fair Use","field":"상표·IP","meaning":"인용·비평·교육 등 정당한 범위에서 허락 없이 저작물을 쓰는 것.","tip":"이용 목적·원작 성질·이용 분량·시장 영향 네 가지로 판단한다. 상업적 이용은 시장 영향이 크다."},{"ko":"저작권 침해 3요소","en":"Three Elements of Infringement","field":"상표·IP","meaning":"의거관계 · 실질적 유사성 · 보호대상 표현, 세 가지가 모두 갖춰져야 침해.","tip":"하나라도 빠지면 침해가 아니다. 방어 논리도 이 세 가지 중 하나를 깨는 데서 시작한다."},{"ko":"가처분","en":"Preliminary Injunction","field":"상표·IP","meaning":"본안 소송 전에 침해를 잠시 멈추게 하는 보전처분.","tip":"속도가 생명이다. 피해 확대를 막고 합의 협상력을 높이는 무기."},{"ko":"본안","en":"Main Action","field":"상표·IP","meaning":"침해 여부와 손해배상을 최종 판단하는 본소송.","tip":"가처분이 인용돼도 본안 승소를 보장하지는 않는다."},{"ko":"디자인권 vs 저작권","en":"Design Right vs Copyright","field":"상표·IP","meaning":"디자인권은 물품 외관의 독점권(등록), 저작권은 창작물에 자동 발생하는 권리.","tip":"실용품 외관은 디자인권, 캐릭터·그림은 저작권이 더 실효적이다."},{"ko":"키프리스","en":"KIPRIS","field":"상표·IP","meaning":"특허청이 운영하는 무료 지식재산 검색 서비스(상표·특허·디자인).","tip":"출원 전 유사 상표 검색은 여기서. 등록 상태와 류까지 함께 확인한다."},{"ko":"베른협약","en":"Berne Convention","field":"상표·IP","meaning":"저작권을 등록 없이 자동 보호하고 회원국끼리 상호 인정하는 국제 조약.","tip":"해외에 올려도 등록 없이 보호되지만, 분쟁 때 입증을 위해 등록은 해 두는 게 좋다."},{"ko":"5대 지식재산권","en":"Five IP Rights","field":"상표·IP","meaning":"특허 · 실용신안 · 디자인 · 상표 · 저작권. 보호 대상과 기간이 각각 다르다.","tip":"상표 10년(갱신), 특허 20년, 디자인 20년, 저작권은 저작자 사후 70년."},{"ko":"상표권 공유","en":"Co-ownership","field":"상표·IP","meaning":"하나의 상표권을 여러 명이 지분으로 나눠 갖는 상태.","tip":"내 지분 처분은 비교적 자유롭지만, 전용사용권 설정 같은 큰 처분은 다른 공유자의 동의가 필요하다."},{"ko":"유사 판단 3요소","en":"Appearance · Sound · Concept","field":"상표·IP","meaning":"외관(생김새) · 호칭(부르는 소리) · 관념(뜻)으로 상표의 유사 여부를 본다.","tip":"하나만 강하게 겹쳐도 유사로 판단될 수 있다. 영문·한글 표기만 바꿔도 피하기 어렵다."},{"ko":"부정경쟁방지법","en":"Unfair Competition Prevention Act","field":"상표·IP","meaning":"등록 없이도 타인의 상품 표지·영업 비밀을 보호하는 법.","tip":"상표 등록 전이라도 유명 상호를 따라 하면 부정경쟁으로 다툴 수 있다."},{"ko":"라이선스","en":"License","field":"라이선스","meaning":"권리자는 그대로 두고 일정 범위에서 쓰도록 허락하는 계약.","tip":"소유권을 넘기는 양도와 다르다. 지역·기간·품목을 좁게 쓸수록 통제가 쉽다."},{"ko":"인바운드 vs 아웃바운드","en":"Inbound / Outbound Licensing","field":"라이선스","meaning":"인바운드는 남의 IP를 받아 쓰는 것, 아웃바운드는 내 IP를 쓰게 하는 것.","tip":"인바운드는 로열티 지출·품질 통제, 아웃바운드는 수익·브랜드 통제가 핵심이다."},{"ko":"전용실시권 vs 통상실시권","en":"Exclusive vs Non-exclusive License","field":"라이선스","meaning":"전용은 한 사람에게만, 통상은 여러 사람에게 허락하는 권리.","tip":"전용은 등록해야 효력이 생기고 권리자도 그 범위에서 못 쓴다. 통상은 여러 곳과 계약할 수 있다."},{"ko":"크로스라이선스","en":"Cross License","field":"라이선스","meaning":"서로의 특허·상표를 맞바꿔 쓰는 계약.","tip":"특허 분쟁을 소송 대신 계약으로 끝내는 대표적 방법이다(합의금 대신 로열티 상계)."},{"ko":"MG","en":"Minimum Guarantee","field":"라이선스","meaning":"계약 기간에 최소한 이만큼은 로열티를 내겠다는 보장액.","tip":"판매가 부진해도 돌려주지 않는 구조(비환급)가 보통이다. 라이선시에겐 고정비다."},{"ko":"Advance","en":"Advance Payment","field":"라이선스","meaning":"계약할 때 미리 내고 이후 로열티에서 차감(Recoup)하는 돈.","tip":"MG와 함께 쓰이면 상계 방식과 미회수 금액(Shortfall) 처리를 문서에 꼭 적는다."},{"ko":"Running Royalty","en":"Running Royalty","field":"라이선스","meaning":"매출·판매량에 비례해 계속 지급하는 로열티.","tip":"총매출 기준인지 순매출 기준인지, 공제 항목이 무엇인지 명확히 해야 분쟁이 없다."},{"ko":"Recoup","en":"Recoupment","field":"라이선스","meaning":"선급금을 발생 로열티에서 차감해 회수하는 것.","tip":"회수가 끝나기 전에는 추가 지급이 없고, 회수 후부터 실제 정산이 시작된다."},{"ko":"Shortfall","en":"Shortfall","field":"라이선스","meaning":"MG에 못 미친 로열티 차액.","tip":"보통 비환급이지만, 계약에 따라 다음 기간으로 넘기는 이월(캐리포워드)이 가능하다."},{"ko":"Audit","en":"Audit Right","field":"라이선스","meaning":"상대방 장부와 판매 기록을 확인할 수 있는 감사권.","tip":"Audit 조항이 없으면 누락 로열티를 입증하기 어렵다. 오차 허용 범위(예: 5% 초과 시 감사비 부담)를 정한다."},{"ko":"Sell-off","en":"Sell-off Period","field":"라이선스","meaning":"계약이 끝난 뒤 남은 재고를 팔 수 있게 해 주는 기간.","tip":"판매 마감일과 폐기 의무를 함께 정한다. 무기한 재고 판매는 브랜드 가치를 깎는다."},{"ko":"Territory","en":"Territory","field":"라이선스","meaning":"라이선스가 효력을 미치는 지역.","tip":"'전 세계'보다 국가·권역으로 나누고, 온라인 판매의 배송 가능 지역을 따로 규정한다."},{"ko":"Sublicense","en":"Sublicense","field":"라이선스","meaning":"받은 권리를 제3자에게 다시 허락하는 것.","tip":"원칙적으로 권리자의 서면 동의가 필요하다. 재라이선스 수익 배분(보통 50%)도 정한다."},{"ko":"QC","en":"Quality Control","field":"라이선스","meaning":"라이선시 제품의 품질을 권리자가 승인·감독하는 조항.","tip":"품질 통제가 없으면 상표 가치가 훼손되고, 미국 등에서는 상표권 유지에도 문제가 된다."},{"ko":"총매출액 vs 순매출액","en":"Gross vs Net Sales","field":"라이선스","meaning":"로열티 기준을 매출 총액으로 할지, 반품·할인·세금을 뺀 순액으로 할지.","tip":"순매출은 공제 항목을 두고 다투기 쉽다. 공제 목록을 계약서에 하나씩 열거한다."},{"ko":"업종별 로열티 시세","en":"Industry Royalty Rates","field":"라이선스","meaning":"업종마다 통상적으로 쓰이는 로열티율 범위.","tip":"협상 전 같은 업종 계약 사례를 근거로 제시하면 설득력이 생긴다."},{"ko":"라이선싱 수익 지도","en":"Licensing Market Map","field":"라이선스","meaning":"라이선서·라이선시·에이전시가 얽힌 라이선싱 시장의 수익 흐름.","tip":"에이전트 수수료(통상 15~25%)와 최소보장 구조를 알아야 실제 수익이 보인다."},{"ko":"프랜차이즈 로열티","en":"Franchise Royalty","field":"라이선스","meaning":"브랜드와 영업 시스템을 쓰는 대가로 매출의 일정 비율을 본사에 내는 것.","tip":"가맹비·교육비·광고분담금과 구분해 총비용으로 비교해야 한다."},{"ko":"독점 vs 비독점","en":"Exclusive vs Non-exclusive","field":"라이선스","meaning":"한 곳에만 허락하는지(독점), 여러 곳에 허락하는지(비독점).","tip":"독점은 MG가 높고 최소 판매 목표(Minimum Performance) 조항이 붙는 게 보통이다."},{"ko":"NDA","en":"Non-Disclosure Agreement","field":"계약·분쟁","meaning":"상대에게 알려준 비밀 정보를 쓰거나 흘리지 않겠다는 계약.","tip":"라이선스 협상 전에 먼저 맺는다. '비밀 정보의 정의'와 예외·기간을 구체적으로 적는다."},{"ko":"LOI / MOU","en":"Letter of Intent / MOU","field":"계약·분쟁","meaning":"본계약 전에 의사와 조건을 확인하는 문서.","tip":"법적 구속력이 있는지(구속·비구속 조항)를 문서 첫머리에 명시한다."},{"ko":"Complete Agreement","en":"Entire Agreement Clause","field":"계약·분쟁","meaning":"이 계약서가 앞선 구두·문서 합의를 모두 대체한다는 조항.","tip":"협상 중 문자·메일로 한 약속도 계약서에 넣지 않으면 효력이 없다."},{"ko":"Indemnity","en":"Indemnity","field":"계약·분쟁","meaning":"제3자의 침해 주장으로 상대가 입은 손해를 보상하는 조항.","tip":"라이선서는 IP 침해, 라이선시는 제품 결함·소비자 클레임을 각각 부담하도록 나눈다."},{"ko":"Warranty","en":"Warranty","field":"계약·분쟁","meaning":"계약 시점의 사실 상태를 보증하는 조항.","tip":"'권리를 정당히 보유하고 제3자와 분쟁이 없다'는 보증이 깨지면 해지·배상 사유가 된다."},{"ko":"Force Majeure","en":"Force Majeure","field":"계약·분쟁","meaning":"천재지변·전쟁 등 통제할 수 없는 사유로 의무를 못 지킬 때 책임을 면하는 조항.","tip":"코로나·물류 마비 같은 사유를 예시로 넣고, 계속되면 해지할 수 있는 기간을 정한다."},{"ko":"Term & Termination","en":"Term and Termination","field":"계약·분쟁","meaning":"계약 유효기간과 중도 해지 사유를 정한 조항.","tip":"자동갱신 조건, 해지 후 재고·로열티 정산 방법을 함께 정한다."},{"ko":"경고장","en":"Warning Letter","field":"계약·분쟁","meaning":"침해를 멈추라고 공식적으로 요구하는 문서.","tip":"소송 전 필수 코스다. 내용증명으로 보내고, 이후 협상의 기준점이 된다."},{"ko":"합의금","en":"Settlement","field":"계약·분쟁","meaning":"분쟁을 소송 대신 금전과 조건으로 끝내는 것.","tip":"비밀유지·재발 방지·일부 권리 허락을 한 묶음으로 협상한다."},{"ko":"침해 증빙","en":"Evidence of Infringement","field":"계약·분쟁","meaning":"침해 사실을 나중에 증명할 수 있게 남겨 두는 자료.","tip":"구매 영수증·판매 화면·시점이 보이는 녹화를 확보한다. 손해액 산정의 기초가 된다."},{"ko":"경업금지","en":"Non-compete","field":"계약·분쟁","meaning":"계약 기간이나 종료 후 일정 기간 같은 업종에서 경쟁하지 못하게 하는 조항.","tip":"종료 후 효력은 기간·지역·대가에 따라 제한된다. 과도하면 무효가 될 수 있다."},{"ko":"최혜대우 조항","en":"Most Favored Nation (MFN)","field":"계약·분쟁","meaning":"같은 상품에 더 좋은 조건을 준 상대가 있으면 나에게도 똑같이 적용해 달라는 조항.","tip":"대형 유통·플랫폼 계약에서 자주 나온다. 무엇과 비교하는지(같은 류·같은 지역)를 정한다."},{"ko":"상품형태 모방","en":"Product Shape Imitation","field":"상표·IP","meaning":"타인이 만든 상품의 형태에 의거해 실질적으로 동일한 상품을 만들거나 팔·전시·수입하는 행위(부정경쟁방지법 제2조 제1호 자목).","tip":"주지성은 필요 없지만 '시제품 제작 등으로 형태가 갖추어진 날'부터 3년까지만 보호됩니다. 출시일로 계산하면 기간을 놓칩니다."},{"ko":"성과 무단사용(파목)","en":"Free-riding on Achievements","field":"상표·IP","meaning":"상당한 투자나 노력으로 만든 성과를 공정한 거래 관행에 반해 무단 사용해 경제적 이익을 침해하는 행위.","tip":"2021년 개정으로 신설된 보충적 일반조항. 형사처벌은 없어 민사 구제만 가능하고, '어디까지가 아이디어이고 어디부터 성과인가'를 다툽니다."},{"ko":"주지성","en":"Well-knownness","field":"상표·IP","meaning":"국내 수요자 사이에 특정인의 상품·영업으로 널리 알려진 정도.","tip":"가목(상품표지)·나목(영업표지)의 핵심 요건. 광고비보다 판매 기간·물량·실제 인지도 자료가 판단을 가릅니다."},{"ko":"경고장 회신 기한","en":"Response Deadline","field":"계약·분쟁","meaning":"경고장·내용증명에 적힌 회신 요청 기한으로, 법정 기한이 아니라 보낸 쪽이 정한 날짜.","tip":"통상 14~30일. 기한을 넘긴다고 즉시 효력이 생기지는 않지만, 기한 안에 '검토 중' 서면 회신을 남겨 고의성·손해액 다툼을 줄입니다."},{"ko":"마스터 라이선스","en":"Master License","field":"라이선스","meaning":"특정 영역에서 재라이선스 권한과 제조·유통을 한 회사에 통째로 맡기는 구조.","tip":"서브라이선시 관리 의무와 원계약 종료 시 서브 계약 정리 비용이 따라옵니다. 본사로 가는 로열티 비중이 커집니다."},{"ko":"솔 라이선스","en":"Sole License","field":"라이선스","meaning":"라이선시와 라이선서만 사용하고 제3자에게는 허락하지 않는 중간형 독점.","tip":"독점과 비독점 사이에서 가장 자주 협상됩니다. 라이선서의 직접 판매 권한은 남습니다."},{"ko":"최소실적 조항","en":"Performance Clause","field":"라이선스","meaning":"일정 기간 최소 판매량·로열티를 채우지 못하면 독점권을 잃거나 계약이 해지되는 조항.","tip":"독점을 줄 때 반드시 붙입니다. 기준(수량·매출·로열티)과 측정 기간을 숫자로 정하고, 미달 시 비독점 전환·해지 중 무엇인지 명시합니다."},{"ko":"병행수입","en":"Parallel Import","field":"계약·분쟁","meaning":"권리자의 허락 없이 정품을 다른 나라에서 사들여 국내에 파는 것.","tip":"정품이면 원칙적으로 허용되지만 Territory·채널 제한과 충돌합니다. 계약서에 수출 금지·유통 채널 제한·정품 인증 의무를 둡니다."},{"ko":"결합상표","en":"Combined Mark","field":"상표·IP","meaning":"문자와 도형(또는 색채)을 함께 결합해 출원·등록한 상표.","tip":"등록은 결합 전체로 되고 권리는 등록표장과 동일·유사한 표장에만 미칩니다. 문자만·도형만 따로 쓰는 상대에 대응하려면 문자·도형·결합을 각각 출원해 두는 것이 안전합니다."},{"ko":"요부(要部)","en":"Essential Part","field":"상표·IP","meaning":"결합상표에서 식별력이 있어 소비자 인상을 좌우하는 핵심 부분.","tip":"결합상표끼리는 원칙적으로 전체를 대비하지만, 식별력 있는 요부로 분리 인식되면 그 호칭·관념으로 유사 판단을 합니다. '국수·토스트' 같은 보통명칭은 요부에서 빠집니다."},{"ko":"지정상품추가등록","en":"Additional Registration of Designated Goods","field":"상표·IP","meaning":"이미 등록된 상표에 지정상품만 덧붙이는 등록(상표법 제86조).","tip":"같은 상표·같은 권리자여야 하고, 추가분의 존속기간은 원 상표와 같아 함께 갱신·소멸합니다. 표장을 바꿨다면 추가등록이 아니라 새 출원입니다."},{"ko":"상당한 주의","en":"Reasonable Care (Trademark Act §119(1)(2))","field":"상표·IP","meaning":"사용권자의 부정사용으로 인한 등록취소를 면하기 위해 상표권자가 다해야 하는 감독 의무.","tip":"표장 사용 가이드, 포장·광고 사전승인, 시정·중단 조치, 시중 점검 기록으로 소명합니다. 디자인 변경을 지시한 정도로는 부족하다고 본 사례가 있습니다."},{"ko":"아트워크 승인","en":"Artwork Approval","field":"라이선스","meaning":"패키지·라벨·상세페이지 등 표장이 들어간 시안을 라이선서가 사전에 승인하는 절차.","tip":"승인 기한(예: 10영업일), 거절 사유, 재신청 횟수, 긴급 출시용 패스트트랙을 계약서에 숫자로 정하고 승인 이력을 보관합니다."},{"ko":"샘플 승인","en":"Pre-production Sample Approval","field":"라이선스","meaning":"양산 전 실물 샘플로 품질·표장 표시를 확인하고 승인하는 단계.","tip":"시안 승인만으로 끝내면 양산품 색·재질 편차로 분쟁이 납니다. 불합격 시 출하·판매 금지와 시정 기간을 함께 둡니다."},{"ko":"손해배상액의 예정","en":"Liquidated Damages","field":"계약·분쟁","meaning":"위반 시 지급할 금액을 미리 정해 두는 조항(민법 제398조).","tip":"부당하게 과다하면 법원이 감액합니다. 위반 유형별로 금액을 나누고, 실손해와 별도 청구 가능 여부·보증금·이행보증보험을 함께 설계합니다."},{"ko":"공지디자인","en":"Publicly Known Design","field":"상표·IP","meaning":"출원 전에 국내외에서 공지되었거나 공연히 실시된 디자인.","tip":"신규성 판단의 기준이자 침해 단계에서 요부에서 걷어내는 부분입니다. 공지 증거는 날짜가 찍힌 카탈로그·기사·SNS 게시물이어야 힘이 있습니다."},{"ko":"창작비용이성","en":"Ease of Creation","field":"상표·IP","meaning":"그 분야 통상의 지식을 가진 사람이 공지디자인이나 널리 알려진 형상의 결합으로 쉽게 창작할 수 있으면 등록되지 않는 요건(디자인보호법 제33조 제2항).","tip":"흔한 요소의 짜깁기형 디자인은 무효심판의 표적이 됩니다. 출원 전에 유사 디자인을 모아 '무엇이 새로운지' 한 줄로 설명할 수 있어야 합니다."},{"ko":"전체적 심미감","en":"Overall Aesthetic Impression","field":"상표·IP","meaning":"등록디자인과 실시디자인을 대비해 수요자가 받는 전체적인 미적 인상.","tip":"개별 요소가 흔해도 조합 전체가 특정 제품을 떠올리게 하면 유사로 판단될 수 있습니다. 대비표는 부분이 아니라 완성품 사진으로 만드세요."},{"ko":"관련디자인","en":"Related Design","field":"상표·IP","meaning":"자기 기본디자인과만 유사한 디자인을 기본디자인 출원일부터 3년 이내에 등록받는 제도(디자인보호법 제35조).","tip":"변형·부분 형태를 하나의 권리로 묶어 두는 장치입니다. 기본디자인 권리가 먼저 죽으면 관련디자인도 등록되지 않으니 갱신·유지 관리를 함께 봅니다."},{"ko":"과실의 추정","en":"Presumption of Negligence","field":"계약·분쟁","meaning":"디자인권 침해자는 침해행위에 과실이 있는 것으로 추정됩니다(디자인보호법 제116조).","tip":"'몰랐다'는 항변으로 면책되기 어렵습니다. 그래서 경고장을 받은 뒤의 판매는 고의·손해액을 키우므로 즉시 판매·광고를 멈추고 검토 사실을 서면으로 남깁니다."},{"ko":"푸시머니","en":"Push Money","field":"계약·분쟁","meaning":"콜라보·상품화 계약에서 라이선서 계열 채널의 광고나 부대상품 구매를 조건으로 붙이는 판촉비.","tip":"로열티율이 낮아 보여도 푸시머니가 붙으면 총지출이 커집니다. 협상에서는 광고비를 로열티에서 분리하고 집행 내역·성과 보고 의무를 함께 요구하세요."},{"ko":"위탁판매 정산","en":"Consignment Settlement","field":"라이선스","meaning":"상품 소유권은 공급자에게 두고 판매만 맡긴 뒤 판매대금에서 수수료를 뺀 금액을 정산하는 구조.","tip":"소유권·재고 소재·정산 기일 세 줄이 없으면 미지급이 형사 사건으로 번집니다. 월별 판매·재고 명세, 반환·실사·보험 조항을 계약에 넣으세요."}]}};</script>

  /* ⭐ 중요(별표) — ipnote.star.v1 에 {주제ID:true} 로 저장 */
  var stars = {};
  try { stars = JSON.parse(localStorage.getItem(STAR_STORE) || '{}') || {}; } catch(e){ stars = {}; }
  function saveStars(){ try { localStorage.setItem(STAR_STORE, JSON.stringify(stars)); } catch(e){} }

  /* 보기 방식 — 'list' | 'grid' (ipnote.view.v1 에 저장, 새로고침해도 유지) */
  var view = 'list';
  try { var vSaved = localStorage.getItem(VIEW_STORE); if (vSaved === 'grid' || vSaved === 'list') view = vSaved; } catch(e){ view = 'list'; }
  function saveView(){ try { localStorage.setItem(VIEW_STORE, view); } catch(e){} }

  /* 카드 옮기기 — 주제를 다른 탭으로 옮긴 설정을 ipnote.move.v1 에 {주제ID: 탭키} 로 저장 */
  var MOVE_STORE = 'ipnote.move.v1';
  var moves = {};
  try { moves = JSON.parse(localStorage.getItem(MOVE_STORE) || '{}') || {}; } catch(e){ moves = {}; }
  function saveMoves(){ try { localStorage.setItem(MOVE_STORE, JSON.stringify(moves)); } catch(e){} }

  /* 각 주제의 원래 탭(수첩 소속)을 기억해 둡니다 — 옮기기 전 자리로 되돌릴 기준 */
  DATA.tabs.forEach(function(t){
    t.topics.forEach(function(tp){ tp.origin = t.key; });
  });

  function syncViewUI(){
    if (viewListBtn) viewListBtn.setAttribute('aria-pressed', view === 'list' ? 'true' : 'false');
    if (viewGridBtn) viewGridBtn.setAttribute('aria-pressed', view === 'grid' ? 'true' : 'false');
    listEl.className = 'list' + (view === 'grid' ? ' grid' : '');
