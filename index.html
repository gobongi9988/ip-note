<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IP 수첩</title>
<meta name="description" content="상표권·IP, 라이선스, 필수지식 카드뉴스를 한 장씩 넘겨보는 수첩">
<meta name="theme-color" content="#FCFAF3" id="theme">
<!-- 단일 번들(HTML 안에 CSS·JS·이미지 포함)이 항상 최신으로 오도록 재검증 -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IP 수첩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FCFAF3; --ink:#14161C; --ink2:#3F434D; --muted:#8B8F98;
  --line:#E6DFD0; --accent:#2B49E0; --accent-soft:#EDEFFF; --seg:#EFE8D7;
}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  overscroll-behavior-y:none;
}
html.locked,body.locked{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}

.app{max-width:560px;margin:0 auto;padding-bottom:calc(26px + env(safe-area-inset-bottom))}

/* ── 헤더 ─────────────────────────────── */
.top{
  position:sticky;top:0;z-index:10;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  background:rgba(252,250,243,.9);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
}
.brand{display:flex;align-items:center;gap:9px;margin:0 2px 13px}
.logo{
  width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.02em;
  display:grid;place-items:center;transition:background .25s ease;
}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.35px;margin:0;line-height:1}
.brand .built{margin-left:auto;font-size:10px;font-weight:600;color:#A9A294;letter-spacing:.01em;white-space:nowrap}

/* ── 보기 전환 (목록 ☰ ↔ 2열 그리드 ⊞) ── */
.views{
  flex:none;display:flex;gap:2px;margin-left:8px;
  background:var(--seg);border-radius:11px;padding:3px;
}
.views button{
  width:30px;height:26px;padding:0;border:0;background:transparent;
  border-radius:8px;cursor:pointer;color:#8C8368;
  display:grid;place-items:center;font-size:14px;line-height:1;
  -webkit-tap-highlight-color:transparent;
  transition:background .16s ease,color .16s ease,box-shadow .16s ease;
}
.views button[aria-pressed="true"]{
  background:#fff;color:var(--ink);
  box-shadow:0 1px 2px rgba(20,22,28,.12),0 2px 6px rgba(20,22,28,.05);
}
@media (hover:hover){.views button:not([aria-pressed="true"]):hover{color:var(--ink2)}}

/* 탭 5개 — 이름 5개가 390px 한 줄에 들어가고, 그래도 넘치면 가로 스크롤로 */
.tabs{
  display:flex;gap:4px;background:var(--seg);border-radius:14px;padding:4px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  /* 폭이 남으면 5개가 고르게 나눠 채우고, 모자라면 글자를 줄이지 않고 스크롤 */
  flex:1 1 auto;min-width:max-content;
  appearance:none;border:0;background:transparent;
  font-size:12.5px;font-weight:800;color:#5F5849;letter-spacing:-.5px;
  padding:10px 3px;border-radius:11px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:baseline;justify-content:center;gap:3px;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.tabs button .cnt{font-size:11px;font-weight:800;color:#A2916B;letter-spacing:0;
  font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"] .cnt{color:#9A8348}
.tabs button[aria-selected="true"]{
  background:#fff;color:var(--ink);
  box-shadow:0 1px 2px rgba(20,22,28,.10),0 3px 10px rgba(20,22,28,.05);
}


/* ── 목록 ─────────────────────────────── */
.list{padding:6px 10px 0}
.row{
  display:flex;align-items:center;gap:9px;
  padding:13px 10px 13px 4px;border-radius:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .14s ease;
}

/* ── 별표(중요) 버튼 ──────────────────── */
.star{
  flex:none;width:40px;height:40px;padding:0;margin:0;
  border:0;background:transparent;border-radius:10px;cursor:pointer;
  display:grid;place-items:center;
  font-size:21px;line-height:1;color:#C6BEA9;
  transition:color .15s ease,transform .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.star.on{color:#F0B400;text-shadow:0 1px 0 rgba(170,120,0,.16)}
.star:active{transform:scale(.86)}
@media (hover:hover){.star:hover{color:#DFA100}}

/* ── 중요 탭 파트 배지 ────────────────── */
.part{
  flex:none;font-size:9.5px;font-weight:800;letter-spacing:.01em;line-height:1.4;
  padding:1px 5px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent);
}
/* 난이도 — 초급·중급·상급·실무 4단계를 색 pill 로. 탭을 옮겨도 그대로.
   연한 바탕 + 또렷한 글자색 + 같은 색 테두리라 목록에서도 한눈에 갈립니다. */
.lvl{
  flex:none;display:inline-flex;align-items:center;
  font-size:9.5px;font-weight:800;letter-spacing:-.1px;line-height:1;
  padding:2.5px 6px;border-radius:999px;border:1px solid transparent;
  background:#EFEADC;color:#6B6352;border-color:#E2DAC6;
}
.lvl[data-lvl="intro"]{background:#E2F5EA;color:#0C7448;border-color:#B9E4CC}
.lvl[data-lvl="basic"]{background:#E2F5EA;color:#0C7448;border-color:#B9E4CC}
.lvl[data-lvl="mid"]{background:#E5EEFD;color:#1A55BC;border-color:#C0D4F9}
.lvl[data-lvl="deep"]{background:#FCE4E9;color:#AD1B3E;border-color:#F4C4CE}
.lvl[data-lvl="prac"]{background:#EDE8FC;color:#5736C4;border-color:#D5C8F6}
.row + .row{box-shadow:0 -1px 0 var(--line)}
.row:active{background:rgba(20,22,28,.045)}
.num{
  flex:none;width:23px;font-size:12.5px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;transition:color .25s ease;
}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.t{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.35px;line-height:1.34}
.m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.01em}
.row.soon{opacity:.45}
.row.soon:active{background:none}
.empty{padding:46px 24px 54px;text-align:center;color:var(--muted);font-size:13px;line-height:1.75;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-ico{font-size:34px;line-height:1;color:#D8CFB8}
.empty-msg{display:block;white-space:pre-line;word-break:keep-all}

/* ── 2열 썸네일 그리드 ────────────────── */
/* 카드는 div(role="button") + width:100% + min-height 로 높이를 고정합니다.
   aspect-ratio / margin:auto / flex 높이 계산에 기대면 iOS Safari(WebKit)에서
   높이가 0 으로 접혀 카드가 보이지 않는 사례가 있어 그 조합을 쓰지 않습니다. */
.list.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:auto;gap:12px;padding:10px 14px 0;
  width:100%;align-items:stretch;
}
.list.grid .empty{grid-column:1 / -1}
.gcard{
  display:flex;flex-direction:column;
  width:100%;min-width:0;min-height:196px;
  border-radius:14px;overflow:hidden;
  background:#0B0D11;cursor:pointer;
  box-shadow:0 1px 2px rgba(9,11,15,.20),0 8px 20px rgba(9,11,15,.13);
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,box-shadow .16s ease;
}
.gcard:active{transform:scale(.982)}
.gcard.soon{opacity:.5}
.gcard.soon:active{transform:none}
/* 썸네일 — 검정 톤 바탕 + 흰색 굵은 메인 제목. 높이는 내용 + min-height 로만 결정 */
.gthumb{
  position:relative;width:100%;min-height:160px;
  -webkit-box-flex:1;flex:1 1 auto;
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:12px 12px 13px;overflow:hidden;color:#fff;
}
/* 통일 블랙 톤 — 시리즈 구분은 배지의 은은한 포인트 컬러만 */
.gcard[data-tone="ip"] .gthumb{background:linear-gradient(160deg,#1B2029 0%,#14171E 54%,#0B0D11 100%)}
.gcard[data-tone="license"] .gthumb{background:linear-gradient(160deg,#231E1A 0%,#17151A 54%,#0C0B0D 100%)}
.gcard[data-tone="basics"] .gthumb{background:linear-gradient(160deg,#18241E 0%,#121A15 54%,#0A0F0C 100%)}
.gcard[data-tone="star"] .gthumb{background:linear-gradient(160deg,#1D2027 0%,#14161B 54%,#0A0C10 100%)}
.gthumb::after{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:radial-gradient(130% 86% at 88% -12%,rgba(255,255,255,.10),rgba(255,255,255,0) 62%);
}
.gwm{
  position:absolute;right:9px;top:4px;z-index:0;font-size:30px;font-weight:900;
  letter-spacing:-.06em;line-height:1;color:rgba(255,255,255,.07);
  pointer-events:none;-webkit-user-select:none;user-select:none;
}
/* 난이도별 은은한 색 — 카드마다 자기 난이도가 보이게 */
.gwm[data-lvl="intro"]{color:rgba(126,236,176,.15)}
.gwm[data-lvl="basic"]{color:rgba(132,190,255,.15)}
.gwm[data-lvl="mid"]{color:rgba(255,193,120,.17)}
.gwm[data-lvl="deep"]{color:rgba(255,138,170,.17)}
.gwm[data-lvl="prac"]{color:rgba(198,166,255,.17)}
.gbtop{position:relative;z-index:1;display:flex;align-items:center;gap:4px;min-height:16px;flex:none}
.gnum{
  font-size:10.5px;font-weight:800;letter-spacing:.06em;line-height:1.3;
  padding:1px 6px;border-radius:5px;
  background:rgba(255,255,255,.09);color:#D9E1F0;
  border:1px solid rgba(255,255,255,.10);
  font-variant-numeric:tabular-nums;
}
.gcard[data-tone="ip"] .gnum{background:rgba(120,148,255,.14);color:#A9B8FF;border-color:rgba(120,148,255,.20)}
.gcard[data-tone="license"] .gnum{background:rgba(255,152,84,.14);color:#FFC193;border-color:rgba(255,152,84,.20)}
.gcard[data-tone="basics"] .gnum{background:rgba(120,235,175,.14);color:#8FE9BC;border-color:rgba(120,235,175,.22)}
.gcard[data-tone="star"] .gnum{background:rgba(255,206,84,.14);color:#FFD97A;border-color:rgba(255,206,84,.20)}
.gpart{
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:9px;font-weight:800;letter-spacing:.01em;line-height:1.4;
  padding:1px 5px;border-radius:5px;
  background:rgba(255,206,84,.12);color:#FFD97A;border:1px solid rgba(255,206,84,.24);
}
/* 그리드 카드의 난이도 pill — 어두운 썸네일 위에서도 4색이 갈리게 */
.glvl{
  flex:none;font-size:8.5px;font-weight:800;letter-spacing:-.1px;line-height:1;
  padding:2px 5px;border-radius:999px;border:1px solid transparent;
  background:rgba(255,255,255,.12);color:#E7EAF2;border-color:rgba(255,255,255,.18);
}
.glvl[data-lvl="intro"]{background:rgba(88,225,150,.20);color:#A6F5CB;border-color:rgba(88,225,150,.42)}
.glvl[data-lvl="basic"]{background:rgba(88,225,150,.20);color:#A6F5CB;border-color:rgba(88,225,150,.42)}
.glvl[data-lvl="mid"]{background:rgba(110,168,255,.22);color:#BFD6FF;border-color:rgba(110,168,255,.45)}
.glvl[data-lvl="deep"]{background:rgba(255,110,145,.22);color:#FFC0CF;border-color:rgba(255,110,145,.45)}
.glvl[data-lvl="prac"]{background:rgba(178,146,255,.24);color:#DACBFF;border-color:rgba(178,146,255,.46)}
.gtitle{
  position:relative;z-index:1;
  font-size:clamp(16px,4.6vw,19px);font-weight:800;letter-spacing:-.55px;
  line-height:1.3;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
  word-break:keep-all;overflow-wrap:anywhere;
  display:block;margin:auto 0;
  max-height:calc(1.3em * 3);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
}
.gfoot{
  display:flex;align-items:center;gap:4px;width:100%;flex:none;
  padding:5px 5px 5px 8px;background:#0B0D11;
  border-top:1px solid rgba(255,255,255,.08);
}
.gmeta{
  flex:1;min-width:0;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.46);
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.gfoot .star{width:34px;height:34px;margin:-4px -2px -4px 0;font-size:18px;color:rgba(255,255,255,.42)}
.gfoot .star.on{color:#F5B800}
.gfoot .star:active{transform:scale(.92)}

/* ── 카드 옮기기(탭 이동) 버튼 ─────────── */
.mvb{
  flex:none;height:26px;padding:0 8px;margin:0 -2px 0 0;
  border:1.4px solid #DCD3BF;background:transparent;border-radius:8px;
  font-size:11px;font-weight:700;letter-spacing:-.2px;color:#867E6C;
  display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.mvb:active{transform:scale(.94)}
@media (hover:hover){.mvb:hover{background:#F2EBD9;color:var(--ink);border-color:#CEC4AC}}
.gbtop .mvb{
  margin:0 0 0 auto;height:19px;padding:0 6px;font-size:9px;border-radius:6px;
  border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.10);color:rgba(255,255,255,.82);
}
@media (hover:hover){.gbtop .mvb:hover{background:rgba(255,255,255,.20);color:#fff;border-color:rgba(255,255,255,.42)}}

/* ── 뷰어 ─────────────────────────────── */
/* 닫힌 뷰어는 화면만 투명할 뿐 실제로는 클릭을 가로채면 안 됩니다.
   visibility:hidden 이 없으면 내부의 .v-top/.v-bottom 자식(pointer-events:auto)이
   헤더의 보기 전환 버튼(⊞)과 화면 아래쪽 탭을 대신 받아 '눌러도 반응 없음'이 됩니다. */
.viewer{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:#0A0C13;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,visibility 0s linear .2s;
  -webkit-user-select:none;user-select:none;
}
.viewer.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .2s ease,visibility 0s;
}
.viewer .deck{position:absolute;inset:0;z-index:1}
.deck{
  display:flex;height:100%;width:100%;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
  scrollbar-width:none;
}
.deck::-webkit-scrollbar{display:none}
.slide{
  flex:0 0 100%;width:100%;height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center;
  padding:calc(52px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));
}
.slide img{
  max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  border-radius:10px;box-shadow:0 18px 48px rgba(0,0,0,.55);
  -webkit-user-drag:none;
}

.v-top{
  position:absolute;top:0;left:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(11px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(to bottom,rgba(10,12,19,.9),rgba(10,12,19,0));
  pointer-events:none;
}
.viewer.open .v-top > *{pointer-events:auto}
.v-label{font-size:11.5px;color:rgba(255,255,255,.66);letter-spacing:.02em;
  padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-tools{flex:none;display:flex;align-items:center;gap:7px}
.v-move{
  flex:none;height:34px;padding:0 12px;border-radius:17px;border:0;
  background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
  font-size:11.5px;font-weight:700;letter-spacing:-.2px;
  display:flex;align-items:center;gap:4px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-tap-highlight-color:transparent;
}
.v-move:active{background:rgba(255,255,255,.22)}
.v-close{
  flex:none;width:34px;height:34px;border-radius:50%;border:0;
  background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
  display:grid;place-items:center;backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;
}
.v-close svg{width:13px;height:13px;stroke:#fff;stroke-width:2.4;stroke-linecap:round}

.nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);
  color:#fff;font-size:17px;line-height:1;display:grid;place-items:center;
  cursor:pointer;opacity:.55;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent;
}
.nav.prev{left:5px}
.nav.next{right:5px}
.nav[disabled]{opacity:0;pointer-events:none}
@media (hover:hover){.nav:hover{opacity:1;background:rgba(255,255,255,.18)}}

.v-bottom{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  display:flex;flex-direction:column;align-items:stretch;gap:9px;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(10,12,19,.9),rgba(10,12,19,0));
  pointer-events:none;
}
.viewer.open .v-bottom > *{pointer-events:auto}
/* 주제 이동 — 슬라이드 화살표(‹ ›)와 헷갈리지 않게 글자 버튼으로 */
.v-topics{display:flex;align-items:center;gap:8px;width:100%}
.v-topics button{
  flex:none;display:flex;align-items:center;gap:3px;
  padding:7px 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.10);
  color:#fff;font-size:11.5px;font-weight:700;letter-spacing:-.2px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .18s ease,background .18s ease;
}
.v-topics button:active{background:rgba(255,255,255,.22)}
.v-topics button[disabled]{opacity:.26;pointer-events:none}
.v-tpos{flex:1;min-width:0;text-align:center;font-size:10.5px;color:rgba(255,255,255,.42);
  font-variant-numeric:tabular-nums;letter-spacing:.04em}
.v-meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%}
.v-date{justify-self:start;font-size:11px;color:rgba(255,255,255,.45);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;padding-left:2px}
.dots{justify-self:center;display:flex;align-items:center}
.dots button{width:20px;height:26px;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.dots i{display:block;width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);
  transition:width .22s ease,background .22s ease}
.dots button[aria-current="true"] i{width:17px;background:rgba(255,255,255,.92)}
.count{justify-self:end;font-size:11px;color:rgba(255,255,255,.5);
  font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* ── 카드 옮기기 시트 ───────────────── */
.mover{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .18s ease,visibility 0s linear .18s;
}
.mover.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .18s ease,visibility 0s}
.mover-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(12,14,20,.42);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.msheet{
  position:absolute;left:0;right:0;bottom:0;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  background:var(--paper);border-radius:20px 20px 0 0;
  box-shadow:0 -12px 40px rgba(10,12,19,.3);
  transform:translateY(14px);transition:transform .2s ease;
}
.mover.open .msheet{transform:translateY(0)}
.mgrab{width:38px;height:4px;border-radius:2px;background:#DCD3BF;margin:0 auto 12px}
.mttl{margin:0 0 3px;font-size:15px;font-weight:800;letter-spacing:-.45px}
.msub{margin:0 0 12px;font-size:11.5px;color:var(--muted);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:keep-all}
.mopts{display:flex;flex-direction:column;gap:7px}
.mopt{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:11px 12px;border-radius:12px;cursor:pointer;
  border:1.6px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:700;letter-spacing:-.3px;color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
.mopt:active{transform:scale(.99)}
.mopt .mem{font-size:15px;line-height:1}
.mopt .mlb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopt .mct{flex:none;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mopt.cur{border-color:var(--accent);background:var(--accent-soft);cursor:default}
.mopt.cur .mct{color:var(--accent);font-weight:800}
.mreset{margin-top:10px;width:100%;padding:10px;border-radius:11px;border:0;background:transparent;
  color:#8A8272;font-size:12px;font-weight:700;cursor:pointer}
.mreset[hidden]{display:none}
.mcancel{margin-top:2px;width:100%;padding:11px;border-radius:11px;border:1.6px solid var(--line);
  background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer}

/* ── 옮김 안내 토스트 ──────────────── */
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:80;
  transform:translate(-50%,14px);max-width:calc(100vw - 28px);
  display:flex;align-items:center;gap:10px;
  padding:9px 9px 9px 14px;border-radius:14px;
  background:rgba(18,20,27,.94);color:#fff;
  font-size:12px;font-weight:600;letter-spacing:-.2px;
  box-shadow:0 10px 30px rgba(10,12,19,.35);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s;
}
.toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0);
  transition:opacity .2s ease,transform .2s ease,visibility 0s}
.tmsg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tundo{flex:none;padding:5px 9px;border:0;border-radius:8px;background:rgba(255,255,255,.16);
  color:#FFE24A;font-size:11.5px;font-weight:800;cursor:pointer}

/* ── 목록 머리말(건수) ───────────────── */
.lhead{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#B0A793;
  padding:2px 20px 6px;font-variant-numeric:tabular-nums}
.list.grid ~ .lhead{padding:2px 20px 6px}

/* ── 📰 기사 목록 ───────────────────── */
.ahead{
  display:flex;align-items:center;gap:8px;
  padding:14px 4px 7px;font-size:11px;font-weight:800;color:#8B8F98;
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.ahead::after{content:"";flex:1;height:1px;background:var(--line)}
.arow{
  display:flex;align-items:flex-start;gap:9px;
  padding:12px 10px 12px 10px;border-radius:12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.arow + .arow{box-shadow:0 -1px 0 var(--line)}
.arow:active{background:rgba(20,22,28,.045)}
.atrk{
  flex:none;margin-top:2px;font-size:9.5px;font-weight:800;letter-spacing:-.1px;
  padding:2px 6px;border-radius:5px;line-height:1.35;
}
.atrk[data-track="ip"]{background:#EDEFFF;color:#2B49E0}
.atrk[data-track="license"]{background:#FFF0E6;color:#C4430E}
.atxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.atitle{font-size:15px;font-weight:700;letter-spacing:-.35px;line-height:1.4;
  word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ameta{font-size:11px;color:var(--muted);letter-spacing:.01em}
/* 기사 제목 위 재치 한 줄 — 목록·읽기 화면 공통 톤 */
.aone{
  display:block;font-size:11.5px;font-weight:800;letter-spacing:-.25px;line-height:1.45;
  color:#0F5F8A;
}
.aone-main{
  margin:14px 0 8px;padding:10px 13px;border-radius:12px;
  background:#E4F2F8;color:#0C5578;border:1px solid #C6E3EF;
  font-size:13.5px;font-weight:800;letter-spacing:-.3px;line-height:1.5;
  word-break:keep-all;
}
.ache{flex:none;align-self:center;color:#C6BEA9;font-size:17px;line-height:1;padding-right:2px}

/* ── 📰 기사 읽기 ───────────────────── */
.art{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--paper);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .18s ease,visibility 0s linear .18s;
}
.art.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .18s ease,visibility 0s}
.art-bar{
  position:absolute;top:0;left:0;right:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(252,250,243,.94);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.art-badge{font-size:10px;font-weight:800;letter-spacing:-.1px;
  padding:3px 8px;border-radius:6px;line-height:1.4}
.art-badge[data-track="ip"]{background:#EDEFFF;color:#2B49E0}
.art-badge[data-track="license"]{background:#FFF0E6;color:#C4430E}
.art .v-close{background:#F1EBDD;color:var(--ink)}
.art .v-close svg{stroke:var(--ink)}
.art-scroll{
  position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.art-inner{
  max-width:560px;margin:0 auto;
  padding:calc(70px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
}
.atitle-main{font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.42;
  margin:0 0 8px;word-break:keep-all}
.ameta-main{font-size:11.5px;color:var(--muted);margin:0 0 20px;letter-spacing:.01em}
.asec{margin:0 0 18px}
.alabel{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);
  margin:0 0 6px;text-transform:none}
.atext{font-size:14.5px;line-height:1.78;letter-spacing:-.2px;color:var(--ink2);
  margin:0;word-break:keep-all}
.apoint{
  margin:0 0 10px;padding:12px 14px;border-radius:12px;
  background:#F5F0E4;border-left:3px solid var(--accent);
}
.apoint[data-side="b"]{background:#F1F4ED;border-left-color:#7DA07A}
.alabel2{display:block;font-size:11px;font-weight:800;color:var(--ink);
  letter-spacing:-.2px;margin-bottom:4px}
.alink{
  display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  padding:11px 16px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:13px;font-weight:800;text-decoration:none;letter-spacing:-.2px;
}
.alink:active{opacity:.85}

/* ── 통합 검색 (돋보기 → 오버레이 + 가운데 흰 검색창) ── */
.findbtn{
  flex:none;width:34px;height:32px;padding:0;margin-left:-3px;
  border:0;border-radius:10px;background:var(--seg);color:#4E4838;
  display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.findbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
.findbtn:active{transform:scale(.94)}
@media (hover:hover){.findbtn:hover{background:#E7DFC9;color:var(--ink)}}

/* 카드 없이 어두운 오버레이 위에 큰 흰 검색바만 — 검색어가 들어오면 바가 살짝 올라가고 결과가 아래로 펼쳐진다 */
.find{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none;
  --find-h:100vh;
}
.find.open{display:block;animation:findIn .18s ease-out both}
@keyframes findIn{from{opacity:0}to{opacity:1}}
.find-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5)}
/* 뒤 화면은 살짝 흐리게 — 흰 검색바와 결과 글자가 또렷하게 읽히도록 */
body.find-open .app{filter:blur(7px);transform:scale(1.02)}
.find-x{
  position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 4px);right:4px;
  width:44px;height:44px;padding:0;border:0;background:transparent;color:#fff;
  display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.find-x svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.find-x:active{opacity:.55}
.find-wrap{
  position:absolute;top:0;right:0;bottom:0;left:0;z-index:2;
  display:flex;flex-direction:column;pointer-events:none;
  padding:calc((var(--find-h) - 96px) * .5) 20px calc(env(safe-area-inset-bottom) + 14px);
  transition:padding-top .28s cubic-bezier(.22,.8,.26,1);
}
.find.has-results .find-wrap{padding-top:calc(env(safe-area-inset-top) + var(--find-h) * .1)}
.find-bar{
  flex:none;display:flex;align-items:center;gap:4px;
  height:78px;padding:0 0 0 2px;
  background:transparent;border-bottom:3px solid #fff;
  pointer-events:auto;
}
.find-bar:focus-within{box-shadow:0 3px 0 -2px rgba(255,255,255,.55)}
.find-input{
  flex:1;min-width:0;width:100%;height:100%;padding:0;border:0;background:transparent;
  color:#fff;font:inherit;font-size:26px;font-weight:800;letter-spacing:-.9px;
  -webkit-appearance:none;appearance:none;
}
.find-input::placeholder{color:rgba(255,255,255,.78);font-weight:700;letter-spacing:-.7px}
.find-input::-webkit-search-cancel-button{display:none}
.find-input:focus{outline:none}
.find-clear,.find-go{
  flex:none;display:grid;place-items:center;padding:0;border:0;
  background:transparent;color:#fff;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.find-clear{width:38px;height:70px}
.find-clear[hidden]{display:none}
.find-clear svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.find-go{width:44px;height:70px}
.find-go svg{width:29px;height:29px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.find-clear:active,.find-go:active{opacity:.55}
.find-list{
  flex:1 1 auto;min-height:0;margin-top:6px;padding-bottom:6px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  pointer-events:none;opacity:0;transition:opacity .24s ease .04s;
}
.find:not(.has-results):not(.no-results) .find-list{display:none}
.find.has-results .find-list,.find.no-results .find-list{opacity:1}
.fhint{padding:16px 2px 8px;text-align:center;color:rgba(255,255,255,.62);font-size:12.5px;line-height:1.75;letter-spacing:-.2px}
.fres{
  display:flex;align-items:flex-start;gap:10px;pointer-events:auto;
  padding:13px 6px;border-radius:12px;cursor:pointer;
  border-top:1px solid rgba(255,255,255,.13);
  -webkit-tap-highlight-color:transparent;
}
.fres:first-child{border-top:0}
.fres:active{background:rgba(255,255,255,.12)}
.fkind{
  flex:none;margin-top:1px;font-size:9.5px;font-weight:800;line-height:1.4;
  padding:2px 7px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);
}
.fkind[data-kind="ip"]{background:rgba(112,142,255,.32);border-color:rgba(160,182,255,.6)}
.fkind[data-kind="license"]{background:rgba(255,146,86,.3);border-color:rgba(255,184,148,.58)}
.fkind[data-kind="basics"]{background:rgba(86,226,166,.26);border-color:rgba(140,240,196,.55)}
.fkind[data-kind="article"]{background:rgba(106,202,255,.26);border-color:rgba(154,222,255,.55)}
.fkind[data-kind="term"]{background:rgba(186,158,255,.28);border-color:rgba(212,192,255,.58)}
.fbody{flex:1;min-width:0}
.fttl{display:block;font-size:14px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.42}
.fsnip{display:block;margin-top:3px;font-size:12px;line-height:1.55;color:rgba(255,255,255,.66);letter-spacing:-.2px}

/* ── 사전(용어) 탭 ────────────────────── */
.gbar[hidden],.gfields[hidden]{display:none}
.gbar{position:relative;display:flex;margin-top:9px}
.gq{
  width:100%;padding:10px 34px 10px 12px;border-radius:12px;
  border:1px solid #E0D8C6;background:#fff;color:var(--ink);
  font:inherit;font-size:13.5px;font-weight:700;letter-spacing:-.2px;
  -webkit-appearance:none;appearance:none;
}
.gq::placeholder{color:#A9A294;font-weight:600}
.gq::-webkit-search-cancel-button{display:none}
.gq:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gclear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;padding:0;border:0;border-radius:50%;
  background:#EFE8D7;color:#6F6757;font-size:11px;font-weight:800;
  display:grid;place-items:center;cursor:pointer;
}
.gclear[hidden]{display:none}
.gfields{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:1px}
.gfields::-webkit-scrollbar{display:none}
.gfields button{
  flex:0 0 auto;border:1px solid #E0D8C6;background:transparent;color:#6F6757;
  border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;
  letter-spacing:-.2px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.gfields button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.gsec{margin:10px 4px 7px;font-size:11px;font-weight:800;color:#9A917E;letter-spacing:.02em}
.gterm{
  padding:12px 13px 13px;margin-bottom:9px;border-radius:14px;
  background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(20,22,28,.04);
}
.gthead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.gname{font-size:14.5px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.gen{font-size:10.5px;font-weight:700;color:#9B927F;letter-spacing:0}
.gtag{
  margin-left:auto;flex:none;font-size:9.5px;font-weight:800;line-height:1.4;
  padding:2px 7px;border-radius:999px;
  background:#EFEADC;color:#6B6352;border:1px solid #E2DAC6;
}
.gtag[data-field="ip"]{background:#EDEFFF;color:#2B49E0;border-color:#D2D8FF}
.gtag[data-field="license"]{background:#FFF0E6;color:#C2400E;border-color:#F7D8C6}
.gtag[data-field="contract"]{background:#EFEAFD;color:#5736C4;border-color:#D8CCF7}
.gmean{margin:0;font-size:12.5px;line-height:1.55;font-weight:700;color:var(--ink2);letter-spacing:-.2px}
.gtip{margin:5px 0 0;font-size:11.5px;line-height:1.6;color:#7C7466;letter-spacing:-.2px}
.gtip b{margin-right:1px;color:var(--accent);font-weight:800}
.gnone{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}

@media (max-width:374px){
  /* 아주 좁은 화면에서는 탭이 한 줄에 들어가도록 건수를 잠시 감춥니다 */
  .tabs button .tcnt{display:none}
}
@media (max-width:360px){
  .t{font-size:15px}
  .gcard{min-height:184px}
  .gthumb{min-height:150px}
  .gtitle{font-size:15.5px}
  .nav{width:32px;height:32px}
  .tabs button{font-size:11px;padding:9px 1px;gap:2px}
  .tabs button .em{font-size:11.5px}
  .star{width:38px;height:38px;font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}

<script>window.__IPNOTE__ = {"appName":"IP 수첩","latest":"2026-11-28","builtAt":"2026-11-28 12:13","tabs":[{"key":"ip","label":"상표권·IP","emoji":"","accent":"#2B49E0","accentSoft":"#EDEFFF","topics":[{"id":"ip-2026-11-23-1","num":"01","title":"선출원주의 vs 선사용주의","fullTitle":"선출원주의 vs 선사용주의","level":"초급","text":"핵심: 한국은 먼저 쓴 사람이 아니라 특허청에 '먼저 출원(신청)'한 사람에게 권리를 주는 선출원주의예요. 반면 미국은 실제로 먼저 상거래에 쓴 사람에게 무게를 두는 선사용주의 성격이 강합니다. 사례 연결: 어도어(ADOR) 미국 상표 분쟁에서 홍콩 업체가 \"우리가 2018년부터 먼저 팔았다\"고 주장하는 것도 미국이 실제 사용 시점을 따지기 때문이에요.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-ip-t01-1.webp","alt":"선출원주의 vs 선사용주의 카드 1 / 4","sha":"d0537596fcfa"},{"src":"assets/cards/2026-11-23-ip-t01-2.webp","alt":"선출원주의 vs 선사용주의 카드 2 / 4","sha":"a081ec739156"},{"src":"assets/cards/2026-11-23-ip-t01-3.webp","alt":"선출원주의 vs 선사용주의 카드 3 / 4","sha":"c2e561ee7f04"},{"src":"assets/cards/2026-11-23-ip-t01-4.webp","alt":"선출원주의 vs 선사용주의 카드 4 / 4","sha":"44b7f221fa95"}]},{"id":"ip-2026-11-23-2","num":"02","title":"니스(NICE) 분류와 지정상품","fullTitle":"니스(NICE) 분류와 지정상품","level":"초급","text":"핵심: 상표권은 이름 하나를 세상 모든 업종에 독점하는 게 아니라, 국제 표준 1~45류로 나뉜 상품·서비스 중 내가 고른 범위(지정상품) 안에서만 보호돼요. 예를 들어 41류(연예·공연) 상표가 있어도 굿즈 옷을 팔려면 25류(의류)를 따로 출원해야 합니다. 사례 연결: 다른 회사가 25류에 같은 이름을 먼저 쓰고 있으면 본업과 별개로 의류 상표 등록엔 제동이 걸릴 수 있어요.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-ip-t02-1.webp","alt":"니스(NICE) 분류와 지정상품 카드 1 / 4","sha":"fbb11bc28106"},{"src":"assets/cards/2026-11-23-ip-t02-2.webp","alt":"니스(NICE) 분류와 지정상품 카드 2 / 4","sha":"b27e2ab5409b"},{"src":"assets/cards/2026-11-23-ip-t02-3.webp","alt":"니스(NICE) 분류와 지정상품 카드 3 / 4","sha":"584e2e51f4b9"},{"src":"assets/cards/2026-11-23-ip-t02-4.webp","alt":"니스(NICE) 분류와 지정상품 카드 4 / 4","sha":"1cb3b267db70"}]},{"id":"ip-2026-11-23-3","num":"03","title":"지식재산권 5대 권리 구분","fullTitle":"지식재산권 5대 권리 구분","level":"초급","text":"핵심: 지식재산권은 특허(기술 발명, 20년), 실용신안(소발명, 10년), 디자인권(물품 외관, 20년), 상표권(이름·로고, 10년), 저작권(창작물, 창작 즉시 발생·사후 70년)으로 나뉩니다. 사례 연결: 기술·디자인은 기간이 끝나면 누구나 쓸 수 있는 공공 영역으로 풀리지만, 상표권만 10년마다 갱신하면 영구적으로 독점할 수 있어요.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-ip-t03-1.webp","alt":"지식재산권 5대 권리 구분 카드 1 / 4","sha":"5fd3aad0ab6d"},{"src":"assets/cards/2026-11-23-ip-t03-2.webp","alt":"지식재산권 5대 권리 구분 카드 2 / 4","sha":"7fe65132ff27"},{"src":"assets/cards/2026-11-23-ip-t03-3.webp","alt":"지식재산권 5대 권리 구분 카드 3 / 4","sha":"31a0fbd689f6"},{"src":"assets/cards/2026-11-23-ip-t03-4.webp","alt":"지식재산권 5대 권리 구분 카드 4 / 4","sha":"dd70b2e11ef1"}]},{"id":"ip-2026-11-23-4","num":"04","title":"상표 심사의 4단계","fullTitle":"상표 심사의 4단계 (출원 → 공고 → 이의신청 → 등록)","level":"초급","text":"핵심: 특허청에 상표를 내면(출원) 심사관이 유사 상표가 없는지 심사하고, 통과하면 대중에게 공개(출원공고)해 제3자가 반대할 기회(이의신청, 한국 2개월·미국 30일)를 줍니다. 이 기간을 넘겨야 비로소 등록이 돼요. 사례 연결: LG생활건강의 미국 상표('더 판타시컬 컬렉션')에 SC존슨이 제동을 건 단계가 바로 출원공고 후 이의신청 절차예요.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-ip-t04-1.webp","alt":"상표 심사의 4단계 카드 1 / 4","sha":"80c767085baa"},{"src":"assets/cards/2026-11-23-ip-t04-2.webp","alt":"상표 심사의 4단계 카드 2 / 4","sha":"ac9dd3880d0f"},{"src":"assets/cards/2026-11-23-ip-t04-3.webp","alt":"상표 심사의 4단계 카드 3 / 4","sha":"175921a141a9"},{"src":"assets/cards/2026-11-23-ip-t04-4.webp","alt":"상표 심사의 4단계 카드 4 / 4","sha":"09aa2557ba3e"}]},{"id":"ip-2026-11-23-5","num":"05","title":"상표권의 공유(공동 소유)","fullTitle":"상표권의 공유(공동 소유)","level":"초급","text":"핵심: 상표권은 여러 주체가 함께 출원·보유할 수 있습니다. 다만 '공유 상표'는 다른 공유자의 동의 없이는 내 지분만 따로 팔거나 제3자에게 사용 허락(라이선스)을 줄 수 없어요. 사례 연결: K컬처 축제 '패노메논'처럼 민관 합작·공동 프로젝트일수록 출원 단계부터 지분율(문체부 50% : 법인 50%)과 사용·수익 권한을 계약서로 못 박아 두는 게 중요합니다.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-ip-t05-1.webp","alt":"상표권의 공유(공동 소유) 카드 1 / 4","sha":"a1867c43b7e0"},{"src":"assets/cards/2026-11-23-ip-t05-2.webp","alt":"상표권의 공유(공동 소유) 카드 2 / 4","sha":"41dc00bd54f8"},{"src":"assets/cards/2026-11-23-ip-t05-3.webp","alt":"상표권의 공유(공동 소유) 카드 3 / 4","sha":"54a0ef726c15"},{"src":"assets/cards/2026-11-23-ip-t05-4.webp","alt":"상표권의 공유(공동 소유) 카드 4 / 4","sha":"9ac5e3c7b6ec"}]},{"id":"ip-2026-11-24-6","num":"06","title":"상표 거절이유 — 절대적 vs 상대적","fullTitle":"상표 거절이유 — 절대적 vs 상대적","level":"초급","text":"핵심: 출원했다고 다 등록되는 건 아니고, 심사에서 거절이유가 나오면 등록이 막힙니다. 거절이유는 크게 두 갈래예요. 절대적 거절이유는 표장 자체나 공익에 문제가 있어 남의 상표와 비교하지 않고도 거절되는 경우(식별력 없는 표장 — 상표법 제33조, 국기·공서양속·품질 오인 등 — 제34조 제1항 제1~6호·제12호)입니다. 상대적 거절이유는 타인의 선등록·선출원·주지저명 상표와 부딪히는 경우(제34조 제1항 제7호·제9호·제11호·제13호, 제35조 선출원)예요. 사례 연결: 노모어피자는 2023년 토끼 캐릭터와 'no more pizza'를 결합한 상표를 출원했지만, 2014년 등록된 서비스표에 같은 문구가 들어 있다는 이유로 2024년 9월 거절됐습니다. 특허법원은 2026년 11월 12일 선등록 표장의 요부가 위쪽 'PIZZA ICONIC'이고 작게 적힌 'NO MORE PIZZA'는 광고 구호에 가까워 식별력이 약하다며, 거절결정을 유지한 심결을 취소했어요. 실무 포인트: 절대적 거절이유는 표장이나 지정상품을 손보는 것 말고는 피하기 어렵고, 상대적 거절이유는 출원 전 KIPRIS 선행 조사로 미리 피하거나 지정상품을 좁히는 것이 기본입니다. 2023년 개정으로 상표등록 동의서(제34조 제1항 제7호 단서·제35조 제6항. 단 동일 상표+동일 상품은 제외)로 푸는 길도 열렸어요. 거절결정을 받으면 등본 송달일부터 30일 안에 거절결정불복심판(특허심판원)을 청구하고, 그 심결에 불복하면 특허법원으로 갑니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-ip-t06-1.webp","alt":"상표 거절이유 — 절대적 vs 상대적 카드 1 / 4","sha":"186e3db9d7ad"},{"src":"assets/cards/2026-11-24-ip-t06-2.webp","alt":"상표 거절이유 — 절대적 vs 상대적 카드 2 / 4","sha":"e9b0ff158840"},{"src":"assets/cards/2026-11-24-ip-t06-3.webp","alt":"상표 거절이유 — 절대적 vs 상대적 카드 3 / 4","sha":"2e752ceb0b97"},{"src":"assets/cards/2026-11-24-ip-t06-4.webp","alt":"상표 거절이유 — 절대적 vs 상대적 카드 4 / 4","sha":"af49df6d3825"}]},{"id":"ip-2026-11-25-7","num":"07","title":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계","fullTitle":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계","level":"상급","text":"핵심: 저작권 침해는 '비슷하게 생겼다'만으로 성립하지 않고, ① 보호범위(표현인가) → ② 의거관계 → ③ 실질적 유사성 → ④ 항변(공정이용·이용허락) 순서로 봅니다. 먼저 아이디어-표현 이분법으로 걸러냅니다 — 기능·알고리즘·구상 같은 아이디어는 보호 대상이 아니고, 구체적으로 표현된 부분만 보호됩니다. 여기서 표현의 합체(필수 불가결의 원칙) 와 업계 표준적 표현(프랑스어 scènes à faire)은 누구나 쓸 수밖에 없으므로 보호에서 빠집니다. 다음이 의거관계로, 피고가 원고 저작물에 접근할 수 있었고 그것을 토대로 만들었다는 점입니다(단순히 접근 가능성만으로는 인정되지 않고, 실질적 유사성이 매우 높으면 접근이 추정될 수 있습니다). 마지막이 실질적 유사성 — 보호받는 창작적 표현만 남긴 뒤(여과·제거) 전체적 감각·구성·전개를 비교합니다. 2차적저작물은 원저작물을 번역·편곡·변형·각색해 새 창작성을 더한 것으로, 작성자에게는 별도 저작권이 생기지만 원저작자의 이용허락 없이 만들면 2차적저작물작성권(저작권법 제22조) 침해입니다. 공정이용(제35조의3) 은 ① 이용 목적·성격(상업성·변형성) ② 저작물의 종류·용도 ③ 이용한 부분의 양·중요도 ④ 잠재적 시장·가치에 미치는 영향 네 가지를 종합해 판단하고, 패러디도 이 틀에서 봅니다. 사례 연결: 2026년 11월 24일 소프트웨어 저작권 실무 칼럼이 정리한 판례 경향이 정확히 이 구조입니다. 변수명·주석은 물론 저작자가 실수로 남긴 오탈자까지 그대로 남아 있던 사안에서는 의거관계와 실질적 유사성이 쉽게 인정돼 침해로 판단됐고, 반대로 기능은 같은데 프로그래밍 언어나 내부 구조를 다르게 재작성한 사안에서는 침해가 부정됐습니다. 감정 실무에서도 전체 코드 중 아이디어·필수적 표현·공공 라이브러리를 먼저 걷어낸 뒤 남은 창작적 표현을 비교합니다. 같은 원리가 캐릭터·일러스트에도 적용돼, 표정·눈 크기 같은 세부가 달라도 머리장식·얼굴형·의상·전체 인상이 겹치고 피고가 창작 원고(원본 작업 파일)를 내지 못하면 실질적 유사성이 인정된 사례가 있습니다. 실무 포인트: ① 권리자(공격) 는 세트로 준비합니다 — (a) 창작 증거(작업 파일·커밋 로그·최초 공표일) (b) 접근 경로(외주·이직·공유 폴더·납품 이력) (c) '지문' 증거(오탈자·변수명·주석·특이 표현). ② 피고(방어) 는 아이디어·표현 합체·표준 라이브러리를 하나씩 걷어내 비교 대상에서 빼고, 독자 개발 기록(커밋 히스토리·설계 문서)으로 의거를 부정합니다. ③ 계약이 판을 바꿉니다 — 외주 개발은 계약서에 저작권 귀속 특약이 없으면 대금을 다 냈어도 저작권이 개발사에 남고, 직원이 만든 것은 직무상저작물 3요건(법인 기획·업무 범위 내 작성·법인 명의 공표)을 갖춰야 회사에 귀속됩니다. 발주 계약서에 양도·이용허락·2차적저작물작성 허락을 명시하세요. ④ 창작 시점은 한국저작권위원회 프로그램·저작물 등록과 소스코드 임치(Escrow) 로 고정해 두면, 침해 입증과 손해배상 협상이 훨씬 빨라집니다.","meta":"11/25 · 6장","date":"2026-11-25","cards":[{"src":"assets/cards/2026-11-25-ip-t07-1.webp","alt":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계 카드 1 / 6","sha":"b3811ab32fa0"},{"src":"assets/cards/2026-11-25-ip-t07-2.webp","alt":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계 카드 2 / 6","sha":"5cb7d82dc6f2"},{"src":"assets/cards/2026-11-25-ip-t07-3.webp","alt":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계 카드 3 / 6","sha":"3ab3f86100b4"},{"src":"assets/cards/2026-11-25-ip-t07-4.webp","alt":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계 카드 4 / 6","sha":"5342efad72c1"},{"src":"assets/cards/2026-11-25-ip-t07-5.webp","alt":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계 카드 5 / 6","sha":"e1374a947e8d"},{"src":"assets/cards/2026-11-25-ip-t07-6.webp","alt":"저작권 침해 판단 3요소 — 의거관계·실질적 유사성·2차적저작물/공정이용 한계 카드 6 / 6","sha":"fb7f38972c11"}]},{"id":"ip-2026-11-26-8","num":"08","title":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응","fullTitle":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응","level":"상급","text":"핵심: 상표·디자인·특허로 등록하지 못했더라도 영업 이익은 부정경쟁방지 및 영업비밀보호에 관한 법률(부정경쟁방지법) 제2조 제1호로 지킬 수 있습니다. 실무에서 자주 붙는 유형은 네 갈래입니다. 가목(상품표지 혼동) 은 국내에 널리 인식된(주지성) 타인의 상품명·표장·용기·포장 등과 같거나 비슷한 표지를 써서 출처를 혼동시키는 행위, 나목(영업표지 혼동) 은 널리 알려진 영업표지·매장의 종합적 외관 등으로 영업주체를 혼동시키는 행위입니다. 자목(상품형태 모방) 은 타인이 제작한 상품의 형태(형상·모양·색채·광택 또는 이들을 결합한 것)에 의거해 실질적으로 동일한 상품을 양도·대여·전시·수입·수출하는 행위로, 가목·나목과 달리 주지성을 요구하지 않는 대신 ① 보호할 구체적 상품형태가 존재 ② 모방(의거) ③ 실질적 동일성 3요소와 시제품 제작 등으로 형태가 갖추어진 날부터 3년이라는 시간 제한을 통과해야 합니다(3년 경과, 동종 상품의 통상적 형태, 기능·효용 확보에 불가결한 형태, 국내에 널리 알려진 형태는 제외). 파목(성과 등의 무단사용) 은 2021년 개정으로 신설된 보충적 일반조항으로, 타인이 상당한 투자나 노력으로 만든 성과 등을 공정한 거래 관행이나 경쟁질서에 반하는 방법으로 자신의 영업에 무단 사용해 타인의 경제적 이익을 침해하는 행위입니다. 구제수단은 금지·예방청구(제4조) 와 침해물 폐기·광고 삭제, 손해배상(제5조), 신용회복 조치(제6조)이고, 손해액은 제14조의2(판매량·침해자 이익·사용료 상당액 추정)로 산정하며 일반 부정경쟁행위는 최대 3배, 영업비밀 침해·아이디어 탈취는 2024년 8월 시행 개정으로 최대 5배까지 증액 배상이 가능합니다. 다만 파목은 형사처벌 대상이 아니어서 민사 구제만 가능하고, 가목·나목·자목 등은 3년 이하 징역 또는 3천만 원 이하 벌금이 붙습니다. 사례 연결: 2026년 11월 24일 보도에 따르면 CJ제일제당 냉동치킨 '소바바'의 뿌리즐링·황금홀릭·고추 바삭바삭 등이 bhc 뿌링클, BBQ 황금올리브, 굽네 고추바사삭과 이름·콘셉트가 닮았다는 지적이 이어졌고, 한국프랜차이즈산업협회가 공식 입장문을 내고 \"대기업이 중소 외식 브랜드의 인지도에 무임승차한다\"며 시정 조치를 요구했습니다. CJ제일제당은 자체 기술력으로 개발하고 출시 전 법무 검토를 거쳤으며, 프랜차이즈 치킨과 냉동식품은 판매 채널·소비 방식이 다르다고 반박했습니다. 아직 소송이 아니라 '경고장 전 단계' 의 분쟁이고, 그래서 오히려 교과서적입니다 — 권리자 측은 등록상표·주지성·혼동 증거와 \"냉동이 배달 치킨의 대체재가 되어 채널 경계가 무너졌다\"는 논거를, 상대방은 독자 개발 기록·채널과 소비 방식의 차이·흔한 메뉴 명칭이라는 항변을 준비하는 구도입니다. 실무 포인트: ① 경고장(내용증명)은 판결이 아니고 강제력도 없으며, 적힌 회신 기한도 법정 기한이 아닙니다. 그러나 받은 날 이후의 판매·광고는 고의와 손해액을 키우는 자료가 되므로(증액 배상·형사 고의 판단) 원본과 봉투, 받은 날짜를 그대로 보존하고 기한 안에 \"검토 중\"이라는 서면 회신을 남기는 것이 안전합니다. ② 받은 쪽 5단계 — 원본·수령일 보존 → 상대 권리의 실체 확인(등록번호·지정상품·존속 여부, 대리권) → 문제된 사용 형태와 판매 이력을 페이지를 내리기 전에 캡처 → 침해를 성급히 인정하거나 합의금을 약정하지 않기 → 무효심판·불사용취소심판·권리범위확인심판, 선사용권, 상표적 사용 부정 같은 항변 검토. ③ 보내는 쪽은 ㉮ 당사자·권리 특정(등록번호) ㉯ 상대 행위 특정(언제·어디서·무엇) ㉰ 침해 비교 자료(외관·호칭·관념, 상품 유사, 형태 대비표) ㉱ 요구사항(중단·재고 처리·손해배상) ㉲ 회신 기한 14~30일 ㉳ 불응 시 조치(단정적 위협은 피하기) ㉴ 권리 유보 문구를 넣고, 내용증명·배달증명으로 보내 발송 사실을 남깁니다(우체국 3년 보관). ④ 자목의 3년은 '출시일'이 아니라 '시제품 제작 등으로 형태가 갖추어진 날' 부터 세고, 파목은 형사처벌이 없다는 점을 상담 첫 자리에서 구분해 설명해야 고객이 전략을 잘못 세우지 않습니다. ⑤ 상표 출원·디자인 등록이 가능한 형태라면 등록 권리를 먼저 만들고 부정경쟁을 보조 청구원인으로 두는 것이 회수율이 높습니다.","meta":"11/26 · 7장","date":"2026-11-26","cards":[{"src":"assets/cards/2026-11-26-ip-t08-1.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 1 / 7","sha":"6a818580aa5e"},{"src":"assets/cards/2026-11-26-ip-t08-2.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 2 / 7","sha":"b8808d2686dc"},{"src":"assets/cards/2026-11-26-ip-t08-3.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 3 / 7","sha":"8f095e78f0b6"},{"src":"assets/cards/2026-11-26-ip-t08-4.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 4 / 7","sha":"186f040db2bd"},{"src":"assets/cards/2026-11-26-ip-t08-5.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 5 / 7","sha":"ca3e4b025a49"},{"src":"assets/cards/2026-11-26-ip-t08-6.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 6 / 7","sha":"7f101d1ed0cf"},{"src":"assets/cards/2026-11-26-ip-t08-7.webp","alt":"부정경쟁방지법 — 상품형태 모방·타인 성과 도용과 경고장(내용증명) 초동 대응 카드 7 / 7","sha":"89247d368b4d"}]},{"id":"ip-2026-11-27-9","num":"09","title":"도형·결합상표의 권리범위와 지정상품 추가등록","fullTitle":"도형·결합상표의 권리범위와 지정상품 추가등록","level":"초급","text":"핵심: 상표는 문자만, 도형만, 또는 둘을 붙인 결합상표로 출원할 수 있는데, 등록되는 것은 출원한 표장 그대로이고 권리는 그 등록표장과 동일·유사한 표장에만 미칩니다(상표법 제89조 — 지정상품에 관하여 등록상표를 사용할 권리를 독점). 그래서 결합상표 하나만 등록해 두면, 경쟁사가 문자 부분만 따로 쓰거나 도형만 바꿔 쓰는 경우 대응이 약해집니다. 유사 판단에서는 결합상표끼리 원칙적으로 전체를 대비(분리관찰 금지) 하지만, 결합이 불가분적이지 않고 식별력 있는 요부(要部) 로 분리해 인식될 수 있으면 그 요부의 외관·호칭·관념으로 비교합니다. '국수·토스트·피자'처럼 상품의 보통명칭이나 성질 표시는 식별력이 약해 요부에서 빠지고, 남는 이름('곰표')이 같으면 그림이 달라도 유사하다고 봅니다. 지정상품은 이름이 아니라 출원서에 적은 목록이 정합니다 — 상표 이름에 '국수'가 들어가도 등록범위는 지정상품 전체입니다. 등록 뒤 상품을 늘릴 때는 지정상품추가등록출원(상표법 제86조) 을 씁니다: ① 원 상표권(또는 출원)이 존재 ② 출원인이 그 상표권자·출원인과 동일인 ③ 추가하는 상표가 등록상표와 동일 ④ 통상의 상표등록출원과 같은 거절이유가 없을 것. 추가된 지정상품의 존속기간 만료일은 원 상표와 같고, 원 상표권이 소멸하면 함께 소멸하며, 무효사유·침해 여부는 원 등록과 독립적으로 판단합니다(지정상품추가등록출원은 상표등록출원으로 변경 가능 — 제44조 제2항. 단 원 상표에 무효·취소심판이 청구되면 제한). 사례 연결: 2026년 11월 26일 공개된 특허법원 2026. 9. 15. 선고 2026허10002 판결(등록취소(상))이 이 구조를 그대로 보여줍니다. 문제된 등록상표 제113134호는 '네 발로 선 곰 도형 + 곰표국수' 결합상표로 1984년 출원·1985년 등록됐고, 지정상품에는 국수뿐 아니라 당면·마카로니·토스트까지 들어 있었습니다(이름은 '국수'지만 범위는 더 넓음). 대한제분도 1955년 등록된 별도 '곰표' 상표권자였고, 가공식품으로 넓히려 2021년 2월 A(영동식품 대표)에게 '곰표' 문자 포함 상표 3건의 2년 사용허락을 받아 국수를 납품받았습니다. 계약이 2023년 2월 갱신 없이 끝난 뒤 A 측 사용업체들(남향푸드또띠아·피자코리아·위두케이·가메골푸드)이 피자·브리또·토스트·왕만두 포장에 '곰표'를 계속 썼고, 대한제분이 혼동을 이유로 A의 등록취소를 청구해 특허심판원(2025. 11. 27. 취소심결)과 특허법원이 모두 인정했습니다. 법원은 등록상표와 실사용 표장의 외관은 유사하지 않지만 둘 다 '곰표'로 불리고 '곰 형상 상표'라는 관념이 같아 전체적으로 유사하다고 봤고, 토스트는 지정상품과 동일, 피자·브리또·또띠아·왕만두는 유사 상품으로 판단했습니다. 결정적 대목은 상표법 제119조 제1항 제2호 — 사용권자가 지정상품·유사상품에 등록상표·유사상표를 사용해 품질을 오인시키거나 출처를 혼동시키면 그 상표권자의 등록 자체가 취소될 수 있고(상표권자가 상당한 주의를 한 경우만 예외), A가 포장 디자인 일부를 바꾸라고 지시한 것만으로는 상당한 주의를 다했다고 볼 수 없다는 것입니다. 확정 여부는 공개 자료로 확인되지 않습니다. 실무 포인트: ① 출원 설계는 3종 세트로 — 문자상표·도형상표·결합상표를 각각 출원해 권리를 겹겹이 쌓고, 지정상품은 지금 파는 상품 + 3년 안에 낼 상품까지 미리 넣습니다(나중에 넣으려면 추가등록이나 새 출원, 비용과 거절 위험이 따라옵니다). ② 지정상품추가등록은 '같은 상표'만 됩니다. 표장을 다듬었거나 색을 바꿨다면 추가등록이 아니라 새 출원이고, 추가분은 원 상표와 운명을 같이하므로(갱신·소멸) 원 상표 관리가 곧 추가분 관리입니다. ③ 사용허락 계약에는 감독 장치를 넣습니다 — 표장 사용 가이드(색·비율·여백·변형 금지), 포장·광고·상세페이지 사전승인, 위반 시 시정 요구·판매 중단, 정기 사용 실태 점검, 계약 종료 시 포장·라벨·인쇄물 회수. ④ 상당한 주의의 기록이 항변의 핵심입니다: 승인 시안과 승인자·승인일, 변경 이력, 반려 사유, 시정·중단 조치 문서, 시중 판매화면 점검 기록을 남깁니다. 곰표 사례는 '승인해 준 포장'이 문제가 됐고 그 승인 과정의 기록이 부족했던 사안입니다. ⑤ 분쟁 상담 첫 자리에서 등록원부의 지정상품·존속기간 → 사용허락 범위 → 실사용 표장 → 상대 상표의 인지도 순으로 확인하면, 등록취소·침해·부정경쟁 중 어느 청구원인이 유효한지 빠르게 갈립니다.","meta":"11/27 · 7장","date":"2026-11-27","cards":[{"src":"assets/cards/2026-11-27-ip-t09-1.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 1 / 7","sha":"3405c405aebe"},{"src":"assets/cards/2026-11-27-ip-t09-2.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 2 / 7","sha":"9fd80b3a6e19"},{"src":"assets/cards/2026-11-27-ip-t09-3.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 3 / 7","sha":"dd6898ca342f"},{"src":"assets/cards/2026-11-27-ip-t09-4.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 4 / 7","sha":"fecf4f6c7b8e"},{"src":"assets/cards/2026-11-27-ip-t09-5.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 5 / 7","sha":"5d8c988a8acf"},{"src":"assets/cards/2026-11-27-ip-t09-6.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 6 / 7","sha":"deb0785db8a0"},{"src":"assets/cards/2026-11-27-ip-t09-7.webp","alt":"도형·결합상표의 권리범위와 지정상품 추가등록 카드 7 / 7","sha":"1c0ea8af5a26"}]},{"id":"ip-2026-11-28-10","num":"10","title":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감","fullTitle":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감","level":"상급","text":"핵심: 디자인권은 물품의 형상·모양·색채 또는 이들의 결합으로 시각을 통해 미감을 일으키게 하는 디자인을 보호하고, 등록디자인 또는 이와 유사한 디자인을 업으로서 실시하면 침해가 됩니다(디자인보호법 제92조·제113조. '실시'는 생산·사용·양도·대여·수출·수입과 양도·대여의 청약). 판단은 네 단계입니다. ① 보호범위 확정 — 범위는 출원서 기재사항과 도면(사진·견본)·디자인 설명으로 표현된 디자인으로 정해집니다(제93조). 도면에 그리지 않은 부분은 보호되지 않으니, 도면과 설명이 곧 계약서입니다. ② 대비 — 등록디자인에서 요부(독창적 특징) 를 뽑습니다. 이때 공지디자인·업계 관용 형태·기능 확보에 불가결한 형상(제34조 제4호)·흔한 색채 조합은 요부에서 걷어냅니다. ③ 유사 판단 — 남은 요부가 실시디자인에 포함되어 전체적 심미감이 유사한지 봅니다. 개별 요소가 흔해도 조합 전체가 특정 제품을 떠올리게 하면 유사로 갈 수 있습니다. ④ 주의 정도 조정 — 물품의 성질·용도·가격·구매층에 따라 보는 사람의 주의가 다릅니다. 고가·내구재는 세부를 꼼꼼히 보므로 유사가 부정되기 쉽고, 저가 일상 소모품·충동구매 품목은 대략적 인상으로 판단됩니다. 등록 단계의 급소는 신규성(제33조 제1항) 과 창작비용이성(같은 조 제2항 — 공지디자인이나 널리 알려진 형상·모양·색채 또는 그 결합으로 쉽게 창작) 이고, 침해 단계의 방어 논리는 무효심판, 제94조 효력 제한(연구·시험, 통과 수송수단, 출원 시부터 국내에 있던 물건), 이용관계(제95조 — 타인의 등록디자인·특허·실용신안·상표·저작물을 이용하면 그 권리자의 허락 필요), 선행 디자인 항변입니다. 사례 연결: 2026년 11월 26일 서울중앙지법 민사63부(이규영 부장판사)가 CJ제일제당이 동원F&B를 상대로 낸 '부산어묵' 포장 디자인권 침해 금지 소송의 첫 변론을 열었습니다. 쟁점은 ㉮ CJ가 등록한 디자인의 보호범위가 어디까지인지 ㉯ 동원 포장이 그 범위에 들어오는지이고, 동원 측은 \"어묵 시장에서 비슷한 색상과 디자인이 널리 쓰인다\"는 공지·관용 항변으로 맞섭니다. 이 사건에서 지식재산처 특별사법경찰은 2026년 9월 10일 동원F&B 사무실을 압수수색해 민사와 형사가 동시에 움직이는 구도를 보여줬습니다. 기사가 함께 소환한 판례가 기준을 정리해 줍니다 — 빙그레 '메로나' vs 서주 '메론바'는 1심(2024년 9월)이 청구를 기각(멜론 아이스크림의 연녹색·과일 사진 배치는 업계 관행)했지만 항소심(2025년 8월, 서울고법)이 뒤집어 포장 사용 금지와 기존 포장 폐기를 명령했고 지금 대법원 판단을 기다립니다. 뒤집힌 근거는 소비자 조사였습니다: 소비자 2,000명 중 메로나 포장을 보고 '메로나'라고 답한 비율 89.1%, 메론바 포장을 보고 '메론바'라고 답한 비율 6.4%, 두 포장이 유사해 오인·혼동할 수 있다는 응답 79.2%. 크린랲 '크린장갑' vs 우정산업 '크린센스 장갑'(2021년)도 포장 외형만으로 출처 혼동을 인정해 제조·판매를 금지했습니다. 반대로 1978년 롯데제과·해태제과 껌 포장 사건에서 대법원은 부정경쟁행위는 인정하면서 등록 의장권 침해는 부정했습니다 — 같은 포장이라도 권리별로 결론이 갈립니다. 실무 포인트: ① 공격 측 준비물 5종 — (a) 등록원부·도면·디자인 설명 (b) 요부를 3개 이내로 정리한 대비표(사진 나란히, 요부 표시) (c) 판매·광고 이력(언제부터, 어디서, 얼마나) (d) 혼동 증거(소비자 인지도·오인율 조사, 같은 채널·가격대·진열 위치) (e) 경고장 → 가처분(급박성·담보) → 본안 순서. 손해액은 양도수량×단위당 이익액, 침해자 이익액, 실시료 상당액 세 가지 추정(제115조)이 있고 과실은 추정되므로(제116조) \"몰랐다\"는 항변은 거의 통하지 않습니다. ② 방어 측 순서 — 권리범위 대비에서 공지·관용·기능 불가결 부분을 걷어내고 남는 요부를 먼저 다투고, 다음으로 무효심판(신규성·창작비용이성) 을 검토합니다. 공지 증거는 날짜가 찍힌 자료(해외 카탈로그, 옛 신문·잡지, SNS 게시물, 거래명세서)라야 힘이 있습니다. ③ 청구원인을 겹쳐 설계합니다 — 포장·용기처럼 형태가 기능과 붙은 디자인은 권리가 좁아지기 쉬우므로, 오래 써서 인지도를 쌓은 제품이면 부정경쟁방지법 제2조 제1호 가목(상품표지 혼동) 을 함께 두는 것이 안전합니다(메로나 항소심이 그 경로). 디자인 등록만 믿으면 롯데·해태처럼 지는 문이 생깁니다. ④ 출원 단계 보강 — 공개한 뒤에도 12개월 안이면 신규성 상실 예외(제36조) 로 구제되고, 변형·부분 형태는 관련디자인(제35조, 기본디자인 출원일부터 3년 이내) 으로 묶어 둘 수 있습니다. ⑤ 손해액 다툼에서는 총매출 전체가 아니라 브랜드·기존 제품 기여도를 분리해 기초 손해액을 낮추는 것이 실무의 승부처입니다.","meta":"11/28 · 7장","date":"2026-11-28","cards":[{"src":"assets/cards/2026-11-28-ip-t10-1.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 1 / 7","sha":"feb2c261842b"},{"src":"assets/cards/2026-11-28-ip-t10-2.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 2 / 7","sha":"fdd46cd0d136"},{"src":"assets/cards/2026-11-28-ip-t10-3.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 3 / 7","sha":"799e26c153c0"},{"src":"assets/cards/2026-11-28-ip-t10-4.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 4 / 7","sha":"b10cf279ed8e"},{"src":"assets/cards/2026-11-28-ip-t10-5.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 5 / 7","sha":"b3454196916e"},{"src":"assets/cards/2026-11-28-ip-t10-6.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 6 / 7","sha":"6d4a27161aba"},{"src":"assets/cards/2026-11-28-ip-t10-7.webp","alt":"디자인권 침해 판단 — 공지 부분 걷어내기·요부 대비·전체 심미감 카드 7 / 7","sha":"3d9a5c67331d"}]}]},{"key":"license","label":"라이선스","emoji":"","accent":"#DC4A12","accentSoft":"#FFF0E6","topics":[{"id":"license-2026-11-23-1","num":"01","title":"인바운드 vs 아웃바운드 라이선싱","fullTitle":"인바운드 vs 아웃바운드 라이선싱","level":"초급","text":"핵심: 외부 인기 IP의 사용권을 돈을 주고 빌려와 내 상품·서비스에 입히는 게 인바운드 라이선싱, 반대로 내 자체 브랜드·캐릭터 IP를 다른 업종 기업에 빌려주고 로열티·협업 수익을 얻는 게 아웃바운드 라이선싱이에요. 사례 연결: 스타벅스×헬로키티, 카카오×디즈니 협업은 대표적인 인바운드 라이선싱이고, 롯데홈쇼핑이 자체 캐릭터 '벨리곰'을 다이소·아워홈·MINI와 협업시키는 건 아웃바운드 라이선싱입니다.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-license-t01-1.webp","alt":"인바운드 vs 아웃바운드 라이선싱 카드 1 / 4","sha":"0ff6995159c8"},{"src":"assets/cards/2026-11-23-license-t01-2.webp","alt":"인바운드 vs 아웃바운드 라이선싱 카드 2 / 4","sha":"3ce02f234b95"},{"src":"assets/cards/2026-11-23-license-t01-3.webp","alt":"인바운드 vs 아웃바운드 라이선싱 카드 3 / 4","sha":"24e43ee7be48"},{"src":"assets/cards/2026-11-23-license-t01-4.webp","alt":"인바운드 vs 아웃바운드 라이선싱 카드 4 / 4","sha":"6508ae7317ca"}]},{"id":"license-2026-11-24-2","num":"02","title":"로열티 산정 방식 — 총매출% vs 순매출% vs 개수당 정액","fullTitle":"로열티 산정 방식 — 총매출% vs 순매출% vs 개수당 정액","level":"중급","text":"핵심: 로열티는 ① 총매출(Gross Sales)의 % ② 순매출(Net Sales)의 % ③ 개수당 정액(per unit) 세 가지가 기본형입니다. 총매출%는 계산이 단순하고 IP 주인(라이선서)에게 유리하지만 반품·할인·부가세까지 실려 실제보다 부풀 수 있고, 순매출%는 무엇을 빼는지 정하는 싸움이 핵심이며, 개수당 정액은 저가·대량 굿즈에 맞고 판매량만 세면 되니 정산·검증이 쉽습니다. 사례 연결: 그라비티가 라그나로크 IP로 태국 쇼피에서 휴대폰 케이스 78종을 주문형 생산(POD) 방식으로 판매합니다(개당 788바트·약 3만 1천 원). 개수가 정확히 집계되는 구조라 개수당 정액이 자연스럽고, 정가의 10%면 개당 약 3,100원, 5%면 약 1,550원이 로열티가 됩니다. 실무 포인트: 계약서에서는 '순매출' 정의에서 무엇을 빼는지(반품·할인·부가세·배송비·결제수수료·플랫폼 수수료·자사 유통마진)를 먼저 확인해야 합니다. 공제 항목이 무제한이면 요율이 같아도 실효 로열티가 반 토막 납니다. 여기에 MG(최소보장금)·선급금 정산, 분기 리포트와 감사권(audit), 통화·환율, 원천징수 조항까지 함께 봐야 실제 수령액이 정해집니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-license-t02-1.webp","alt":"로열티 산정 방식 — 총매출% vs 순매출% vs 개수당 정액 카드 1 / 4","sha":"57ef0c1d9465"},{"src":"assets/cards/2026-11-24-license-t02-2.webp","alt":"로열티 산정 방식 — 총매출% vs 순매출% vs 개수당 정액 카드 2 / 4","sha":"dfc81ae9a09f"},{"src":"assets/cards/2026-11-24-license-t02-3.webp","alt":"로열티 산정 방식 — 총매출% vs 순매출% vs 개수당 정액 카드 3 / 4","sha":"31c6bf298d18"},{"src":"assets/cards/2026-11-24-license-t02-4.webp","alt":"로열티 산정 방식 — 총매출% vs 순매출% vs 개수당 정액 카드 4 / 4","sha":"a92b9bdd36b0"}]},{"id":"license-2026-11-25-3","num":"03","title":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무","fullTitle":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무","level":"중급","text":"핵심: 선급금(Advance) 은 계약 때 미리 주고받는 돈이고, MG(Minimum Guarantee, 최소보장금) 는 계약 기간에 최소한 이만큼은 지급하겠다는 보장 하한입니다. 둘은 다릅니다 — Advance는 이후 발생 로열티에서 회수(recoup) 되는 구조가 보통이고(회수 조건과 미회수분 반환 여부를 문구로 못 박아야 함), MG는 실제 로열티가 그 금액에 못 미치면 차액(shortfall)을 라이선시가 채워야 합니다. 실무에서는 \"Advance 3,000만 원, 이후 로열티에서 우선 회수, 회수되지 않은 Advance는 반환하지 않음\" 같은 형태로 Advance를 MG처럼 쓰는 경우가 많아, 어느 쪽으로 합의했는지를 계약서 문구로 구분해야 분쟁이 없습니다. 정산은 ① 보고서(Royalty Report: SKU별 판매수량·정가·할인·반품·순매출·요율·로열티액) ② 제출·지급 기한(보고 후 30~45일) ③ 최소보장 미달분 처리(즉시 납부·다음 기간 이월·해지권) 순으로 굴러가고, 감사(Audit) 는 라이선서가 장부·판매기록·세금계산서·플랫폼 정산서를 열람해 누락을 찾아내는 권리입니다. 통상 1년 1회·사전 통보 15~30일·비용은 라이선시 부담이되 오차가 일정 비율(예: 5%)을 넘으면 라이선서 부담 + 미지급 로열티·이자·감사비용 청구로 설계합니다. 사례 연결: 2026년 11월 24일, IP 라이선싱·실물 컬렉터블 기업 레어온이 데즈카 프로덕션과 라이선스 계약을 맺고 선보이는 '리틀아톰(GO ASTRO BOY GO!)' 한정판 카드에 개별 시리얼 번호와 발행 이력을 블록체인(소니움)에 기록하는 3자 파트너십을 맺었습니다. 카드가 한정 수량으로만 발행되고 발행·유통 기록이 시스템에 남으면, 라이선서 입장에서는 판매량 보고를 믿어야 하는 부담과 초과 생산(overrun)·미보고 판매 위험이 크게 줄어듭니다. 다만 그 기록을 '정산의 기준 자료'로 인정할지, 블록체인 파트너가 바뀌거나 계약이 끝날 때 발행 데이터의 소유권·열람권·이관을 누가 갖는지는 계약서에 없으면 감사 국면에서 그대로 분쟁이 됩니다. 실무 포인트: ① MG는 기간·영역(Territory)·채널별로 쪼개서 설정하세요. 전 세계를 하나의 MG로 묶으면 특정 국가 부진이 전체를 덮어 버립니다. ② Advance는 회수 가능(recoupable) 여부와 미회수분 반환 의무를 명시하고, MG와 혼용하지 않게 정의 조항에 따로 적습니다. ③ 순매출 공제 항목은 목록으로 한정하고 \"그 밖의 공제는 불가\" 문구를 넣습니다. ④ 보고서 양식을 계약서 별첨으로 붙여 SKU·수량·정가·할인·반품·순매출·요율·금액 칸을 고정합니다. ⑤ Audit 조항에는 열람 범위(장부·세금계산서·플랫폼 정산서·재고), 통보 기간, 회차 제한, 비용 부담, 오차 허용치, 청구 시효(보고 후 2~3년 경과분 제한) 를 함께 적습니다. ⑥ POS·온체인·물류 시스템 기록을 쓰는 딜은 그 기록을 '정산 기준 자료'로 지정하고, 시스템 장애·교체 시 대체 증빙 방법까지 정해 둡니다.","meta":"11/25 · 6장","date":"2026-11-25","cards":[{"src":"assets/cards/2026-11-25-license-t03-1.webp","alt":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무 카드 1 / 6","sha":"69a8b9f6cacd"},{"src":"assets/cards/2026-11-25-license-t03-2.webp","alt":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무 카드 2 / 6","sha":"c180d1a7ecbe"},{"src":"assets/cards/2026-11-25-license-t03-3.webp","alt":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무 카드 3 / 6","sha":"9f55c4ee7403"},{"src":"assets/cards/2026-11-25-license-t03-4.webp","alt":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무 카드 4 / 6","sha":"543a8ca4e509"},{"src":"assets/cards/2026-11-25-license-t03-5.webp","alt":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무 카드 5 / 6","sha":"e4f6e03ff6d6"},{"src":"assets/cards/2026-11-25-license-t03-6.webp","alt":"MG(최소보장금)·선급금(Advance)과 로열티 정산·누락 감사(Audit) 실무 카드 6 / 6","sha":"f1fc6050c836"}]},{"id":"license-2026-11-25-4","num":"04","title":"업종별 로열티 시세표 & MG·선급금 실무 기준","fullTitle":"업종별 로열티 시세표 & MG·선급금 실무 기준","level":"실무","text":"핵심: 로열티는 업종마다 통상 범위가 다릅니다 — 캐릭터·엔터 8~12%(대형 IP 10~15%) · 패션 4~12%(미국 10~12%) · 스포츠 15~20%(미국 기준) · F&B 3~6%(한국 실무 0.5~1.5%) · 소비재 3~7% · 완구·출판 10% 안팎. 숫자보다 중요한 건 기준입니다. 정가(소비자가)·출고가·순매출 중 무엇을 기준으로 삼느냐에 따라 같은 요율의 실지급액이 2~3배 달라지고, 미국·유럽은 순매출(Net Sales) 이 표준입니다. 순매출에서는 반품·할인·리베이트·운송비를 빼는데, 무제한 공제를 허용하면 로열티가 거의 남지 않으므로 실무에서는 공제 총액을 순매출의 10% 안팎으로 캡을 씌웁니다. 유통 구조의 25% 룰(원가 25 → 출고가 50 → 도매가 75 → 소비자가 100)을 알면 소비자가 기준 10%가 출고가 기준 20%와 같은 돈이라는 게 바로 보입니다. MG(최소보장금) 는 계약기간 동안 보장하는 최소 로열티로 통상 예상 로열티의 약 50%, 선급금(Advance) 은 MG의 25~50%를 계약 시 미리 받고 이후 로열티에서 차감(환불 불가)하는 구조입니다. 사례 연결: 개별 계약의 요율은 비공개가 원칙이라, 공개된 숫자는 대부분 재무제표 역산 참고치입니다. 노스페이스는 골드윈에 지급한 로열티 337억 ÷ 영원아웃도어 매출 9,614억 = 3.5%(2023), 포켓몬코리아는 로열티수익 24억 ÷ 매출 334억 = 7.2%(2021), 산리오코리아는 본사 송금 195.6억 ÷ 매출 394.6억 = 49.6%(2025)인데 이는 재라이선스(master license) 법인이라 구조 자체가 다릅니다. SPC삼립 포켓몬빵 로열티는 10% 미만으로 알려졌을 뿐 공개되지 않았습니다. 역산 비율은 계약상 기준(순매출·출고가)과 회사 매출이 달라 실제 계약 요율과 일치하지 않으므로, \"이 브랜드는 ○%\"라고 단정하면 안 됩니다. 게다가 한국 실무에는 \"통상 매출의 5~10% 또는 수익의 25%\" 라는 또 다른 기준점도 있어(DKL 법률사무소 칼럼, 2011), 편의점 김밥처럼 유통기한이 짧고 마진이 얇은 품목은 1~2%까지 내려갑니다. 실무 포인트: ① 협상 전에 기준(정가·출고가·순매출·FOB) 을 먼저 정하고, 계약서의 공제 항목 목록과 공제 캡(10% 내외) 을 숫자로 확인하세요. ② MG는 예상 로열티의 50%, 선급금은 MG의 25~50% 를 출발점으로 잡되, MG를 다 채웠는지와 무관하게 초과분 정산 주기·보고 의무를 따로 적습니다. ③ 업종 통상 범위는 협상의 출발선일 뿐이라, 독점 범위·테리토리·기간이 요율보다 큰 돈을 좌우합니다. ④ 공시 역산치는 참고치로만 쓰고, 인용할 때는 계산식과 연도를 함께 적으세요.","meta":"11/25 · 7장","date":"2026-11-25","cards":[{"src":"assets/cards/2026-11-25-license-t04-1.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 1 / 7","sha":"c0080add081a"},{"src":"assets/cards/2026-11-25-license-t04-2.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 2 / 7","sha":"aaede67bd747"},{"src":"assets/cards/2026-11-25-license-t04-3.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 3 / 7","sha":"b89c3009a188"},{"src":"assets/cards/2026-11-25-license-t04-4.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 4 / 7","sha":"2668b6569fe5"},{"src":"assets/cards/2026-11-25-license-t04-5.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 5 / 7","sha":"e3d35c661f4f"},{"src":"assets/cards/2026-11-25-license-t04-6.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 6 / 7","sha":"5b96b5b13d57"},{"src":"assets/cards/2026-11-25-license-t04-7.webp","alt":"업종별 로열티 시세표 & MG·선급금 실무 기준 카드 7 / 7","sha":"d11445297ecc"}]},{"id":"license-2026-11-25-5","num":"05","title":"국내외 IP 라이선스 시장 지도 & 대박 공식","fullTitle":"국내외 IP 라이선스 시장 지도 & 대박 공식","level":"실무","text":"핵심: 2025년 세계 라이선스 상품 소매 판매액은 3,898억 달러(+5.45%)이고, 미국·캐나다 2,272억(58.3%) · 서유럽 701억(18%) · 북아시아 413억(10.6%, +14.1%) 순입니다. 국가별로 보면 중국 1,798.5억 위안(+15.9%), 일본 캐릭터 비즈니스 2조 7,773억 엔(2024), 한국 21.6억 달러(2024, 세계 0.6%)입니다. 미국은 성숙·플랫폼화, 일본은 성숙·해외 확장, 유럽은 문학·예술 IP의 본고장, 중국은 자국 IP·구즈 경제로 성장하는 단계입니다. 한국은 규모(2024년 캐릭터 산업 매출 7조 958억원)는 작지만 패션 라이선시 운영 역량은 세계 상위권입니다. 사례 연결: 국내 '대박'은 대부분 비(非)패션 IP를 패션·식품으로 번역한 라이선시가 만들었습니다 — MLB(F&F, 2025 매출 1조9,340억), 디스커버리(54억→4,648억), 내셔널지오그래픽(3,864억), 노스페이스(1조564억), 코닥(132억→1,044억), 포켓몬빵(소매 1,107억). 반복되는 공식은 셋입니다: ① 라이선시가 카테고리를 새로 정의했다(아웃도어를 일상복으로, 필름 브랜드를 MZ 패션으로) ② 계약기간이 5~10년+α로 길고 해외 판권까지 묶었다(F&F 11개국 2039년, 노스페이스 2032년) ③ 원권리자에게 가는 돈은 매출의 한 자릿수지만 라이선시 이익률은 15~25% 로 두껍다. 아웃바운드는 뽀로로(아이코닉스, 2025 라이선스 206억)와 티니핑(SAMG, 121억→211억)이 이끕니다. 실무 포인트: ① 라이선싱을 검토할 때 시장 규모표는 정의가 제각각(소매판매액·사업체 매출·상품화권 시장)이라 단순 비교하지 말고, 같은 기준의 숫자끼리 놓으세요. ② 국내 사업성은 카테고리 재정의 여지에서 갈리므로, 원 IP의 사용 맥락과 다른 카테고리에 붙였을 때의 수요를 먼저 봅니다. ③ 계약은 기간·해외 판권·갱신 조건을 한 묶음으로 협상하세요. 짧은 계약은 마케팅 투자를 회수하기 전에 끝납니다. ④ 원권리자와 라이선시의 수익 배분 구조(한 자릿수 로열티 vs 이익률 15~25%) 를 미리 계산해 남는 장사인지 확인하세요.","meta":"11/25 · 7장","date":"2026-11-25","cards":[{"src":"assets/cards/2026-11-25-license-t05-1.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 1 / 7","sha":"5aacc8dd537d"},{"src":"assets/cards/2026-11-25-license-t05-2.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 2 / 7","sha":"996cc0f5d8c5"},{"src":"assets/cards/2026-11-25-license-t05-3.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 3 / 7","sha":"7fa24079424b"},{"src":"assets/cards/2026-11-25-license-t05-4.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 4 / 7","sha":"b59797334e23"},{"src":"assets/cards/2026-11-25-license-t05-5.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 5 / 7","sha":"96736723e678"},{"src":"assets/cards/2026-11-25-license-t05-6.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 6 / 7","sha":"def8602ac5a9"},{"src":"assets/cards/2026-11-25-license-t05-7.webp","alt":"국내외 IP 라이선스 시장 지도 & 대박 공식 카드 7 / 7","sha":"6c244556931c"}]},{"id":"license-2026-11-26-6","num":"06","title":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무","fullTitle":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무","level":"실무","text":"핵심: 라이선스의 값은 요율 한 줄이 아니라 '누구에게, 어디서, 어느 채널로, 얼마나 오래' 에서 정해집니다. ① 독점(Exclusive) 은 계약한 영역·기간·채널에서 라이선시만 사용하고 라이선서도 사용하지 못하며(라이선서의 직접 판매 유보 여부는 문구로 정합니다), 그 대가로 높은 MG·최소 로열티와 최소실적(Performance) 조항이 붙습니다. ② 비독점(Non-exclusive) 은 여러 라이선시에게 동시에 허락하는 형태로 라이선서에게 유리하지만, 라이선시는 마케팅 투자를 회수하기 어려워 요율·기간·채널을 좁히고 경쟁사 제한을 요구하게 됩니다. ③ 그 사이의 솔(Sole) 은 라이선시와 라이선서만 사용하고 제3자에게는 주지 않는 중간형으로, 실무에서 가장 자주 협상됩니다. ④ 마스터 라이선스 는 한 회사에 특정 영역의 재라이선스 권한과 제조·유통을 통째로 맡기는 구조(산리오코리아처럼 본사로 가는 로열티 비중이 커짐)이고, 서브 라이선스 는 그 아래에서 제3자에게 다시 허락하는 것입니다. 서브라이선시는 원계약에 구속되므로 원계약이 끝나면 서브 계약도 함께 흔들립니다 — 원 라이선서의 사전 승인, 서브 계약서 사본 제공, 로열티 패스스루(전달), 원계약 종료 시 서브 계약처리 조항이 없으면 종료 국면에서 그대로 분쟁이 됩니다. ⑤ Territory(영역) 는 등록 권리의 범위와 일치해야 하고(등록 없는 나라에 독점을 줘도 실효가 없습니다), 온라인 판매는 배송지 기준인지 판매자 소재지 기준인지를 정해야 하며, 수출·병행수입·해외 직구가 영역을 뚫는 통로가 됩니다. ⑥ 채널 제한 은 오프라인(백화점·테마파크), 편의점, 이커머스, 홈쇼핑, 면세점, 리셀 플랫폼을 나눠 채널별 요율·MG·최저가를 따로 정하는 방식입니다. 사례 연결: 2026년 11월 25일, 에버랜드가 일본 캐릭터 '먼작귀(치이카와)'와 다음 달 19일부터 2027년 3월 24일까지 겨울 축제 '홀리데이 위시'를 열고, 캐리비안 베이 워터파크 협업(12월 3일~3월 1일)도 함께 진행한다고 밝혔습니다. 국내 테마파크·워터파크 협업은 처음이고, 더현대 서울 팝업은 내년 1월까지, 용산 아이파크몰 '치이카와숍'은 수 시간 대기가 이어집니다. 크림에서는 영화 개봉 직후 검색량이 전월 대비 14배 뛰고 정가 2만4,400원짜리 키링이 최고 44만 원에 거래됐으며, 중국에서만 파는 굿즈를 사려는 타오바오 국내 이용자가 월 102만 명으로 역대 최고를 기록했습니다. 업계에서는 \"협업하려는 브랜드가 줄을 서 최소 반년은 기다려야 한다\"는 말이 나옵니다. 같은 캐릭터 하나가 테마파크(대형·독점), 백화점 팝업(단기·비독점), 리셀 플랫폼(계약 밖), 해외 직구(영역 밖) 네 채널에서 동시에 움직이는, 채널·영역 설계의 실제 교과서입니다. 실무 포인트: ① 라이선서 — 수요가 폭발하는 시점에는 한 곳에 전부 주지 말고 카테고리·채널·기간을 쪼개 비독점으로 여러 곳에 허락하고 경쟁 입찰로 MG를 끌어올립니다. 독점은 대형 채널 한 곳에만 주고 최소실적 미달 시 비독점 전환·해지 조항을 반드시 붙입니다. 리셀·병행수입은 계약 채널 밖 유통이므로 정품 인증·MSRP(권장소비자가)·유통 채널 제한·재판매 금지 조항으로 막습니다. ② 라이선시 — 독점이 아니면 마케팅 투자 회수 계획부터 다시 세우고, 독점을 받았다면 채널 배타 범위(편의점·면세점·온라인 제외 여부)와 영역 정의(배송지 기준) 를 문구로 확보합니다. MG는 채널별로 쪼개고, 원 라이선서가 같은 채널에 경쟁 라이선시를 들이지 못하게 하는 조항을 넣습니다. ③ 마스터를 받는 쪽은 서브라이선시 관리 의무(품질·최저가·보고)와 원계약 종료 시 서브 계약 정리 비용을 미리 계산해야 하고, 원 라이선서는 서브 계약서 사본·감사권·승인 절차를 확보해야 합니다. ④ 계약서 목차에서 독점 범위 → 최소실적 → 영역 정의 → 채널 목록 → 서브라이선스 승인 → 종료 시 처리 여섯 줄을 먼저 확인하는 습관이 상담 시간을 줄입니다. ⑤ 독점을 줬다면 등록 유지 비용(갱신·분쟁 대응) 을 누가 부담하는지도 함께 정하세요. 영역 안 권리가 죽으면 독점의 값도 함께 죽습니다.","meta":"11/26 · 7장","date":"2026-11-26","cards":[{"src":"assets/cards/2026-11-26-license-t06-1.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 1 / 7","sha":"9f2667690a98"},{"src":"assets/cards/2026-11-26-license-t06-2.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 2 / 7","sha":"e8ff7303ee54"},{"src":"assets/cards/2026-11-26-license-t06-3.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 3 / 7","sha":"9c8db6386959"},{"src":"assets/cards/2026-11-26-license-t06-4.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 4 / 7","sha":"215f314b1338"},{"src":"assets/cards/2026-11-26-license-t06-5.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 5 / 7","sha":"0cfad620fd60"},{"src":"assets/cards/2026-11-26-license-t06-6.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 6 / 7","sha":"bc755ed69f6e"},{"src":"assets/cards/2026-11-26-license-t06-7.webp","alt":"독점 vs 비독점 · 마스터/서브 라이선스 · Territory·채널 제한 실무 카드 7 / 7","sha":"7257b037ae03"}]},{"id":"license-2026-11-27-7","num":"07","title":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무","fullTitle":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무","level":"실무","text":"핵심: 라이선싱 계약에서 품질관리(QC) 는 라이선서의 통제권이자 의무입니다. 상표를 빌려준 쪽은 자기 표장의 신용을 유지할 책임이 있고(상표법 제119조 제1항 제2호 — 사용권자의 부정사용으로 등록이 취소될 수 있음), 그래서 계약서에는 ① 표장 사용 가이드(로고 색·비율·여백·최소 크기, 변형·재조합 금지, ®·TM·저작권 병기 문구) ② 아트워크 승인(Artwork/Label Approval) — 패키지·라벨·상세페이지·광고 시안 단계 승인 ③ 샘플 승인(Pre-production Sample) — 양산 전 실물 승인 ④ 양산품 검사·시중 점검 ⑤ 불합격 시 출하·판매 금지와 시정 기간 ⑥ 승인 기록의 보관·열람을 넣습니다. 승인은 '품질 보증'이 아니라 권리 유지 장치라는 점이 핵심입니다. 절차는 숫자로 박아 둡니다 — 신청 서식, 승인 기한(예: 접수 후 10영업일), 거절 사유(가이드 위반·품질 미달), 재신청 횟수, 시즌 상품용 패스트트랙, 그리고 '기한 내 무응답을 승인으로 볼지'(라이선서는 거부, 라이선시는 요구). 그 위에 완전합의(Entire Agreement) 조항을 두어 구두 약속·이메일·영업 담당자 발언을 계약 밖으로 밀어내고, 변경은 양사 서명한 서면으로만 하도록 합니다. 종료 국면은 해지 사유(로열티 지급 지체, 품질 기준 위반, 무단 서브라이선스, 표장 훼손·사회적 논란, 최소실적 미달, 파산)와 시정 기간(Cure Period, 통상 30일), 즉시 해지 사유를 나누고, 해지 시 판매 중단·재고 처리(Sell-off 60~90일, 이후 라벨 제거·폐기)·승인 자료 반환을 정합니다. 위약금은 민법 제398조의 손해배상액 예정으로 설계하되, 부당하게 과다하면 법원이 감액할 수 있으므로 ① 위반 유형별로 금액을 나누고 ② 실손해와 별도로 청구할 수 있는지 ③ 지급 보증금·이행보증보험으로 담보합니다. 사례 연결: 2026년 11월 26일, 노브랜드가 인기 캐릭터 '오리덕후'와 협업한 신상품 16종(포켓 티슈·핸드크림·쿠션 중목양말 3족·데일리 라인 노트 등)을 내놓으며 생활용품·패션·리빙까지 비식품 PB로 캐릭터 IP를 넓혔습니다. 지난해 '슈퍼말차' 협업을 시작으로 여러 IP와 손잡은 결과 올 1~9월 협업 상품 누계 매출이 전년 동기 대비 2배 이상 늘었고, 아우어 베이커리 협업은 출시 3개월 만에 누적 85만 개를 넘겼습니다. 반대로 보면 SKU 16종은 승인 요청 16건 이상이라는 뜻이고, 저가 생활용품일수록 불량 한 건의 리콜·반품 비용이 그 SKU의 로열티를 쉽게 넘어섭니다. 같은 날 화제가 된 '곰표국수' 등록취소 사건은 반대편 리스크를 보여줍니다 — 사용허락을 받은 업체들이 쓴 포장을 제대로 감독하지 못해 상표권자 쪽 등록이 취소된 사례로, QC·사전승인 조항은 라이선시를 묶는 문서이면서 동시에 라이선서의 권리를 지키는 보험입니다. 실무 포인트: ① 승인 조항 6칸 체크 — 신청 서식 / 승인 기한·무응답 처리 / 거절 사유 / 샘플·양산 검사 / 불합격 시 조치 / 기록 보관·열람. 이 여섯 칸이 비면 출시 일정과 품질 분쟁이 동시에 터집니다. ② SKU가 많은 콜라보는 SKU군별로 승인 기준을 나누고(패키지·인쇄물·잡화), 승인 리드타임을 역산한 출시 일정표를 계약서 별첨으로 붙입니다. ③ 리콜·제조물책임(PL) 은 제조·판매자 부담 원칙으로 쓰고, 라이선서의 승인 사실이 책임 확대로 이어지지 않도록 면책·보험 가입(PL 보험, 한도·피보험자 범위) 조항을 둡니다. ④ 완전합의 조항만 믿지 말고 현장에서 구두로 한 약속(추가 지원, 마케팅비 분담)은 반드시 서면 변경으로 남깁니다. ⑤ 해지·위약금은 '무엇을 어겼을 때 얼마'를 표로 만들고, 시정 기간을 거치지 않은 즉시 해지는 상대가 다툴 여지를 남긴다는 점을 기억합니다. ⑥ 계약 종료 3개월 전부터 재고 실사·Sell-off 계획·라벨 제거 견적을 준비하면 잔여 재고 분쟁을 대부분 피할 수 있습니다.","meta":"11/27 · 7장","date":"2026-11-27","cards":[{"src":"assets/cards/2026-11-27-license-t07-1.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 1 / 7","sha":"ba1340579e48"},{"src":"assets/cards/2026-11-27-license-t07-2.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 2 / 7","sha":"69b7ce2920fa"},{"src":"assets/cards/2026-11-27-license-t07-3.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 3 / 7","sha":"1d6cc92fe560"},{"src":"assets/cards/2026-11-27-license-t07-4.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 4 / 7","sha":"51f498aa3323"},{"src":"assets/cards/2026-11-27-license-t07-5.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 5 / 7","sha":"afcfccb55cc9"},{"src":"assets/cards/2026-11-27-license-t07-6.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 6 / 7","sha":"ce47c8a29192"},{"src":"assets/cards/2026-11-27-license-t07-7.webp","alt":"품질관리(QC)·사전승인 조항과 완전합의·해지·위약금 실무 카드 7 / 7","sha":"8b7d4b71287c"}]},{"id":"license-2026-11-28-8","num":"08","title":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어","fullTitle":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어","level":"실무","text":"핵심: 콜라보·굿즈 계약은 '캐릭터를 쓴다'는 합의가 아니라 개발비·고정지급·광고·정산·재고·귀속 여섯 개의 돈줄이 한 문서에 섞인 거래입니다. 라이선시(제조·판매자)를 가장 자주 무너뜨리는 독소조항은 여덟 가지입니다. ① 개발비·금형비 전가 — 계약서 없이 개발·시제품을 먼저 시키고 조건은 나중에 바꾸는 구조. ② 실적과 무관한 고정 지급 — 최소보증금·보증금·판촉비를 '매출 연동'처럼 포장해 총액으로 묶는 조항. ③ 광고·부대상품 구매 강제(푸시머니) — 라이선서 계열 채널의 광고나 자사 상품 구매를 계약 조건으로 넣는 것. ④ 로열티 기준 과다 — 총매출(반품·할인·부가세 포함) 기준, 무상 증정품·샘플·사은품까지 과금, 반품된 물량의 로열티 환급 불가. ⑤ 정산 불투명 — 보고 주기·정산 기일·지연이자가 없고, 감사 비용을 라이선시가 전액 부담하며, 채널별 보고가 누락되는 구조. ⑥ 위탁판매의 공백 — 소유권·수수료율·정산 기일·미판매 재고의 소재와 반환 주체가 비어 있는 경우. ⑦ 종료 국면 — Sell-off 기간이 없거나 30일 미만, 잔여 재고 폐기·라벨 제거 비용 부담, 금형·목형·디자인 원본·2차 창작물의 귀속 미정. ⑧ 책임 전가 — 제3자 권리 침해(권리 흠결) 시 라이선서 면책, 승인 제품의 품질·리콜·IP 클레임 전부 라이선시 부담, 손해배상 상한 없음, 일방 즉시 해지권. 여기에 요즘은 2차 창작·AI 학습·생성물 활용 범위와 원본 파일·디자인 소스의 반환·삭제 조항이 새 독소 지점으로 붙습니다. 사례 연결: ① '신비아파트' 완구 분쟁 — 2021년 CJ ENM이 중소 완구업체에 보증금 없는 공동사업을 제안해 개발을 진행시킨 뒤 계약 구조가 바뀌었고, 변경된 계약에 판매 실적과 무관하게 총 14억4,000만 원 지급(일부는 투니버스 광고 구매에 사용) 조건이 들어 있었다는 것이 국회에서 제기된 당사자 주장입니다. 1심은 '계약조건이 현저하게 불공정하다'는 업체 측 주장을 받아들이지 않았지만, 사안은 2026년 10월 12일 국회 정무위(공정위)와 10월 23일 문체위(문체부) 국감으로 번졌고 문체부 장관이 상품화 라이선스 표준계약서 마련을 검토하겠다고 답했습니다. 업계 4개 단체는 개발비 정산 기준, 최소보증금 산정 근거, 광고 등 부대상품 구매 강제 금지, 계약 종료 후 재고 판매 보장을 표준계약서에 담아 달라고 요구합니다. ② 츠키 내한공연 굿즈 미정산 — 2026년 2월 26일 5,775만 엔(약 4억8,000만 원) 규모 굿즈 공급계약(대금 절반 3월 31일, 나머지 4월 30일, 운송비·관세는 국내 주최사 부담)과 별도로 위탁판매 약정(판매대금의 20% 수수료, 상품 소유권은 일본 공급사) 을 맺었는데, 대금과 정산금(수수료 제외 5,096만 원 등)이 지급되지 않고 미판매 재고의 소재까지 불분명해져 공급사가 사기·업무상횡령으로 고소했습니다(세계일보 2026-11-06 보도). 청구액은 물품대금과 대납한 운송비·관세를 합쳐 약 7억1,200만 원입니다. ③ 더캐리 하도급법 위반 — 공정위는 2026년 11월 23일 디즈니·산리오 등과 협업해 온 유아동복 업체가 협력사에 위탁하며 대금·지급기일이 빠진 납기확인서 376건을 발급하고 작업 시작 후 41~159일 늦게 계약서를 준 30건에 시정명령을 내렸습니다(하도급법 제3조 서면 발급 의무). ④ 반대편 성공 사례로, 2026년 11월 28일 보도된 핑크퐁 '씰룩'은 일본 수족관 전시(체험), 유럽 패션 라이선싱(에르베), 포토부스 14개국 197개 매장으로 채널·지역·카테고리를 쪼개 계약해 서로 잠식하지 않게 설계했습니다. 실무 포인트: ① 서명 전 12칸 체크 — ㉮ 허락 대상(캐릭터·표장·저작물을 각각) ㉯ 채널·지역·기간 ㉰ SKU·수량 상한 ㉱ 로열티 기준(총매출/순매출, 반품·무상 제공 처리) ㉲ 최소보증금·고정지급 총액과 산정 근거 ㉳ 광고·부대상품 구매 분리 ㉴ 개발비·금형비 정산과 귀속 ㉵ 정산 주기·기일·지연이자·감사 ㉶ 승인 절차와 리드타임 ㉷ 재고·Sell-off·폐기 비용 ㉸ 해지·시정 기간·위약금 상한 ㉹ 2차 창작·AI 활용·원본 반환. ② '무보증 공동사업 → 조건 변경' 패턴을 경계합니다. 개발 착수 전에 조건이 바뀌면 개발비를 정산하고 손해를 보전한다는 조항을 넣고, 최소보증금은 예상 판매량×요율로 근거를 요구하세요. ③ 고정지급은 총액으로 보라 — MG·보증금·광고 구매·판촉비를 합친 금액이 예상 마진을 넘으면 그 계약은 이미 마이너스입니다. ④ 국내 위탁생산이 끼면 하도급법이 적용됩니다. 작업 시작 전에 대금과 지급기일이 적힌 서면을 발급하고, 납기확인서만 주고받는 관행을 끊으세요(더캐리 사례의 핵심). ⑤ 위탁판매는 소유권·재고 소재·정산 기일 세 줄이 비면 형사 사건이 됩니다. 반환·실사·보험 조항을 넣고 월별 재고 명세를 받으세요. ⑥ 표준계약서가 없으니 자체 표준안이 무기입니다. 라이선서용·라이선시용 두 벌을 만들어 협상의 시작점으로 쓰면, 조항 하나씩 다투는 시간이 줄어듭니다.","meta":"11/28 · 7장","date":"2026-11-28","cards":[{"src":"assets/cards/2026-11-28-license-t08-1.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 1 / 7","sha":"a7454d4bfe30"},{"src":"assets/cards/2026-11-28-license-t08-2.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 2 / 7","sha":"1b949faad4d7"},{"src":"assets/cards/2026-11-28-license-t08-3.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 3 / 7","sha":"128a71fc5cd3"},{"src":"assets/cards/2026-11-28-license-t08-4.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 4 / 7","sha":"3d84a41933e9"},{"src":"assets/cards/2026-11-28-license-t08-5.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 5 / 7","sha":"0b0bd7b176ae"},{"src":"assets/cards/2026-11-28-license-t08-6.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 6 / 7","sha":"b178e93aa20f"},{"src":"assets/cards/2026-11-28-license-t08-7.webp","alt":"굿즈·콜라보 계약의 독소조항 체크리스트와 실무 방어 카드 7 / 7","sha":"5a7eceeaf73b"}]}]},{"key":"basics","label":"필수지식","emoji":"","accent":"#0C7A52","accentSoft":"#E7F7EE","topics":[{"id":"basics-2026-11-23-1","num":"01","title":"상표 vs 상호, 뭐가 다를까?","fullTitle":"상표 vs 상호, 뭐가 다를까?","level":"초급","text":"핵심: 상호는 사업자(가게·회사)를 표시하는 이름으로 상법이 다루고, 상표는 상품·서비스를 표시하는 표시로 상표법이 다룹니다. 상호를 법인 등기하거나 사업자등록을 해도 상표권은 생기지 않으며, 다른 사람이 같은 이름을 먼저 상표로 등록하면 내 간판이 오히려 침해가 될 수 있습니다. 사례 연결: 동네 가게·프랜차이즈 이름 분쟁의 다수가 \"상호 등기는 했지만 상표 출원은 하지 않은\" 구조에서 나옵니다.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-basics-t01-1.webp","alt":"상표 vs 상호, 뭐가 다를까? 카드 1 / 4","sha":"be996659fd7f"},{"src":"assets/cards/2026-11-23-basics-t01-2.webp","alt":"상표 vs 상호, 뭐가 다를까? 카드 2 / 4","sha":"bc9a3eddf70a"},{"src":"assets/cards/2026-11-23-basics-t01-3.webp","alt":"상표 vs 상호, 뭐가 다를까? 카드 3 / 4","sha":"df31ec3a8bf0"},{"src":"assets/cards/2026-11-23-basics-t01-4.webp","alt":"상표 vs 상호, 뭐가 다를까? 카드 4 / 4","sha":"e24e33deff62"}]},{"id":"basics-2026-11-23-2","num":"02","title":"™ vs ® 표시, 아무나 써도 될까?","fullTitle":"™ vs ® 표시, 아무나 써도 될까?","level":"초급","text":"핵심: ™(Trademark)는 출원 중이거나 실제로 사용 중인 상표에 붙이는 표시로 누구나 쓸 수 있고, ®(Registered)는 등록이 완료된 상표에만 붙일 수 있습니다. 등록되지 않은 상표에 ®를 붙이는 것은 상표법이 금지하는 거짓 표시입니다. 사례 연결: 출원만 해 두고 상세페이지에 ®를 붙였다가 근거 없는 권리를 내세운 것으로 문제가 되는 경우가 있습니다.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-basics-t02-1.webp","alt":"™ vs ® 표시, 아무나 써도 될까? 카드 1 / 4","sha":"ab3d4b9ffe55"},{"src":"assets/cards/2026-11-23-basics-t02-2.webp","alt":"™ vs ® 표시, 아무나 써도 될까? 카드 2 / 4","sha":"478436d383ca"},{"src":"assets/cards/2026-11-23-basics-t02-3.webp","alt":"™ vs ® 표시, 아무나 써도 될까? 카드 3 / 4","sha":"fd437c4183b3"},{"src":"assets/cards/2026-11-23-basics-t02-4.webp","alt":"™ vs ® 표시, 아무나 써도 될까? 카드 4 / 4","sha":"dbce145cdec9"}]},{"id":"basics-2026-11-23-3","num":"03","title":"상표 등록의 핵심 '식별력'이란?","fullTitle":"상표 등록의 핵심 '식별력'이란?","level":"초급","text":"핵심: 식별력은 내 상품과 남의 상품을 구별하게 해 주는 힘입니다. '사과'를 사과 주스 상표로 쓸 수 없듯 보통명칭·성질표시는 식별력이 없어 등록되지 않고, '애플'을 컴퓨터에 쓰는 것처럼 원래 뜻과 다른 상품에 붙인 독창적인 이름·조어는 등록이 잘 됩니다. 사례 연결: \"맛있는 사과주스\"처럼 품질을 그대로 설명하는 말은 거절되고, 만들어 낸 조어는 권리 범위도 넓게 인정됩니다.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-basics-t03-1.webp","alt":"상표 등록의 핵심 '식별력'이란? 카드 1 / 4","sha":"eb9ec2bbd658"},{"src":"assets/cards/2026-11-23-basics-t03-2.webp","alt":"상표 등록의 핵심 '식별력'이란? 카드 2 / 4","sha":"b57cf79eea69"},{"src":"assets/cards/2026-11-23-basics-t03-3.webp","alt":"상표 등록의 핵심 '식별력'이란? 카드 3 / 4","sha":"12c574fbd76b"},{"src":"assets/cards/2026-11-23-basics-t03-4.webp","alt":"상표 등록의 핵심 '식별력'이란? 카드 4 / 4","sha":"4a0175bffd0b"}]},{"id":"basics-2026-11-23-4","num":"04","title":"마드리드 국제출원, 한 번에 여러 나라 등록하기","fullTitle":"마드리드 국제출원, 한 번에 여러 나라 등록하기","level":"초급","text":"핵심: 상표권은 속지주의라 나라마다 따로 등록해야 합니다. 마드리드 의정서(WIPO)를 이용하면 한국 특허청에 출원서 1장을 내고 미국·일본·유럽 등 원하는 나라를 한꺼번에 지정 출원할 수 있습니다. 다만 한국에 기본 출원·등록이 있어야 하고, 지정한 나라마다 심사를 따로 받습니다. 사례 연결: 국제등록은 \"전 세계 등록\"이 아니라 \"여러 나라에 동시에 출원한 것\"이라, 지정국에서 거절되면 그 나라만 보호를 받지 못합니다.","meta":"11/23 · 4장","date":"2026-11-23","cards":[{"src":"assets/cards/2026-11-23-basics-t04-1.webp","alt":"마드리드 국제출원, 한 번에 여러 나라 등록하기 카드 1 / 4","sha":"88fa1ea8bbd7"},{"src":"assets/cards/2026-11-23-basics-t04-2.webp","alt":"마드리드 국제출원, 한 번에 여러 나라 등록하기 카드 2 / 4","sha":"402c14815bff"},{"src":"assets/cards/2026-11-23-basics-t04-3.webp","alt":"마드리드 국제출원, 한 번에 여러 나라 등록하기 카드 3 / 4","sha":"c56b8655501d"},{"src":"assets/cards/2026-11-23-basics-t04-4.webp","alt":"마드리드 국제출원, 한 번에 여러 나라 등록하기 카드 4 / 4","sha":"751baad1b2da"}]},{"id":"basics-2026-11-24-5","num":"05","title":"유사 판단 기준 — 외관·호칭·관념","fullTitle":"유사 판단 기준 — 외관·호칭·관념","level":"초급","text":"핵심: 두 상표가 비슷한지는 외관(글자 생김새·도형)·호칭(불리는 소리)·관념(떠오르는 의미) 세 가지를 나눠 비교하고, 그중 하나만 겹쳐도 유사하다고 볼 수 있습니다. 보통 각 요소를 따로 떼어 대보는 '분리관찰'로 대비한 뒤 전체 인상을 함께 보고, 일반 수요자가 출처를 혼동할 우려가 있는지로 최종 판단해요. 여기에 지정상품까지 겹쳐야 거절이나 침해가 성립합니다. 사례 연결: 노모어피자 사건에서 특허심판원은 글자체와 색이 달라도 호칭·관념이 같다며 유사하다고 봤고(외관이 달라도 유사), 특허법원은 표장 안에서 그 문구가 차지하는 비중(요부)까지 따져 결론을 뒤집었습니다. '새소년'과 'SAESONYEON'은 눈으로 보면 전혀 다르지만 읽으면 같은 소리이고, '애플'과 사과 그림은 소리·모양이 달라도 뜻이 같아 유사 판단 대상이 됩니다. 실무 포인트: 이름을 정할 때 ① 같은 소리로 읽히는 다른 표기(한글·영문·숫자) ② 같은 뜻의 다른 언어·그림 ③ 결합상표에서 내 이름이 놓이는 크기와 위치를 확인하세요. 지식재산처의 유사상표 검색에서 '호칭'으로도 조회해 보면 놓치는 선행 상표를 줄일 수 있습니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t05-1.webp","alt":"유사 판단 기준 — 외관·호칭·관념 카드 1 / 4","sha":"e93f3ef6a4da"},{"src":"assets/cards/2026-11-24-basics-t05-2.webp","alt":"유사 판단 기준 — 외관·호칭·관념 카드 2 / 4","sha":"6f050b11868e"},{"src":"assets/cards/2026-11-24-basics-t05-3.webp","alt":"유사 판단 기준 — 외관·호칭·관념 카드 3 / 4","sha":"b026e4ec78b1"},{"src":"assets/cards/2026-11-24-basics-t05-4.webp","alt":"유사 판단 기준 — 외관·호칭·관념 카드 4 / 4","sha":"4282c402d196"}]},{"id":"basics-2026-11-24-6","num":"06","title":"키프리스(KIPRIS) 실무 & 상표 상태 읽기","fullTitle":"키프리스(KIPRIS) 실무 & 상표 상태 읽기","level":"초급","text":"핵심: 키프리스(kipris.or.kr)에서 상표를 조회하면 출원 → 공고 → 등록 또는 거절·취하·포기·소멸 상태가 함께 나옵니다. 같은 이름이라도 상태가 '출원'이면 아직 권리가 없고, 등록결정·등록공고까지 가야 독점권이 생깁니다. 등록 후 존속기간은 10년이고 갱신등록을 반복하면 계속 유지되므로, 등록번호만 보지 말고 존속기간·권리자·지정상품을 같이 확인해야 합니다. 사례 연결: '출원 중'인 상표를 '등록'으로 오해하고 경고장을 보냈다가, 상대가 출원 상태와 거절 이력을 지적하며 역으로 문제를 삼는 경우가 있습니다. 반대로 공고 단계(이의신청 2개월)를 놓치면 등록을 막을 기회를 잃습니다. 실무 포인트: 선행조사는 ① 호칭(한글·영문·숫자·중국어 발음) ② 유사군코드(G코드) ③ 지정상품 류·항목 세 갈래로 넓히세요. 등록 상표의 지정상품 표와 고객사가 실제 파는 상품을 나란히 놓고 겹치는 항목을 표시하면 빈틈이 바로 보입니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t06-1.webp","alt":"키프리스(KIPRIS) 실무 & 상표 상태 읽기 카드 1 / 4","sha":"dc7004be3dca"},{"src":"assets/cards/2026-11-24-basics-t06-2.webp","alt":"키프리스(KIPRIS) 실무 & 상표 상태 읽기 카드 2 / 4","sha":"144c2bb9816a"},{"src":"assets/cards/2026-11-24-basics-t06-3.webp","alt":"키프리스(KIPRIS) 실무 & 상표 상태 읽기 카드 3 / 4","sha":"a0d5cad4503b"},{"src":"assets/cards/2026-11-24-basics-t06-4.webp","alt":"키프리스(KIPRIS) 실무 & 상표 상태 읽기 카드 4 / 4","sha":"f617ae09e650"}]},{"id":"basics-2026-11-24-7","num":"07","title":"에이전시 필수 라이선싱 용어 한눈에","fullTitle":"에이전시 필수 라이선싱 용어 한눈에","level":"초급","text":"핵심: 라이선싱 계약은 누가(라이선서=권리자 / 라이선시=실시권자) · 얼마(MG 최소보장금·선급금 Advance·런닝로열티) · 어디까지(독점 vs 비독점, 테리토리, 기간·채널) · 끝나면(Sell-off) 네 칸으로 읽습니다. MG는 '선급 로열티'가 아니라 최소보장금이라, 실제 로열티가 MG를 넘으면 초과분을 더 정산하고 못 미치면 MG까지만 받는 구조가 일반적입니다. 사례 연결: MG를 선급금처럼 생각해 초과분 정산을 빠뜨리거나, 반대로 MG를 다 채웠다고 보고를 멈춰 감사에서 문제가 되는 경우가 있습니다. 계약서에 'MG 대비 초과분 정산 주기'와 '보고 의무'가 따로 적혀 있는지가 갈림길입니다. 실무 포인트: 독점(exclusive)이면 최소 판매량·MG를 높게 잡고 해지 조건을 붙이며, 비독점이면 테리토리·채널·상품을 촘촘히 나눕니다. MG·독점 범위·테리토리·Sell-off 네 줄을 표로 만들어 두면 협상이 훨씬 빨라집니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t07-1.webp","alt":"에이전시 필수 라이선싱 용어 한눈에 카드 1 / 4","sha":"b1950b10fa58"},{"src":"assets/cards/2026-11-24-basics-t07-2.webp","alt":"에이전시 필수 라이선싱 용어 한눈에 카드 2 / 4","sha":"cb941d2ca7ef"},{"src":"assets/cards/2026-11-24-basics-t07-3.webp","alt":"에이전시 필수 라이선싱 용어 한눈에 카드 3 / 4","sha":"57107c882d6a"},{"src":"assets/cards/2026-11-24-basics-t07-4.webp","alt":"에이전시 필수 라이선싱 용어 한눈에 카드 4 / 4","sha":"0e7210cf1394"}]},{"id":"basics-2026-11-24-8","num":"08","title":"분쟁 초동 대응 & 침해 증빙 기본기","fullTitle":"분쟁 초동 대응 & 침해 증빙 기본기","level":"초급","text":"핵심: 침해를 발견하면 증거 고정이 먼저입니다. URL과 접속 시각이 보이는 화면 전체 캡처, 판매자·가격·판매량이 함께 나오는 페이지, 가능하면 테스트 구매로 실물과 영수증을 확보하세요. 그다음 권리 상태(등록번호·지정상품·존속기간)를 확인하고, 경고장(내용증명) 에는 사실관계·권리 근거·요구사항(판매 중지·회수·정산)과 이행 기한을 숫자로 적습니다. 사례 연결: 캡처만 있고 구매·영수증이 없으면 상대가 \"이미 삭제했다\"며 버티기 쉽습니다. 테스트 구매로 실물을 확보하면 판매 사실·수량·가격이 고정되어 협상력이 달라집니다. 반대로 근거 없는 과장 경고는 손해배상이나 부정경쟁방지법 위반 리스크로 되돌아옵니다. 실무 포인트: 경고장을 보내기 전에 무효·불사용취소 가능성부터 점검하세요. 오픈마켓·SNS는 권리침해 신고 채널에 등록증·위임장·침해 캡처를 붙이는 방식이 가장 빠르고, 신고 뒤 같은 상품이 다른 계정으로 다시 올라오는지 재등록 감시가 필요합니다.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t08-1.webp","alt":"분쟁 초동 대응 & 침해 증빙 기본기 카드 1 / 4","sha":"926c9735f079"},{"src":"assets/cards/2026-11-24-basics-t08-2.webp","alt":"분쟁 초동 대응 & 침해 증빙 기본기 카드 2 / 4","sha":"d45302bdc8ce"},{"src":"assets/cards/2026-11-24-basics-t08-3.webp","alt":"분쟁 초동 대응 & 침해 증빙 기본기 카드 3 / 4","sha":"cedec1fd460e"},{"src":"assets/cards/2026-11-24-basics-t08-4.webp","alt":"분쟁 초동 대응 & 침해 증빙 기본기 카드 4 / 4","sha":"f5d545140a87"}]},{"id":"basics-2026-11-24-9","num":"09","title":"브랜드 IP 관리 — 등록 빈틈과 침해 모니터링","fullTitle":"브랜드 IP 관리 — 등록 빈틈과 침해 모니터링","level":"실무","text":"핵심: 상표권은 출원할 때 지정한 지정상품(류) 안에서만 효력이 있습니다. 브랜드가 향수·문구·앱·팝업처럼 새 카테고리로 나가면 그 상품은 권리 공백이 되므로, 인접 류에 방어상표를 두고 신상품이 나올 때마다 추가출원으로 지도를 넓혀야 합니다. 등록만 해 두고 쓰지 않으면 3년 이상 불사용 시 불사용취소심판 대상이 되므로 사용 증거(상세페이지·매출·광고)도 함께 쌓아야 합니다. 사례 연결: 옷(25류)만 등록한 브랜드가 향수·문구 굿즈를 냈을 때, 그 카테고리에서는 등록상표를 내세울 수 없어 형태모방·성과도용(부정경쟁방지법)이나 디자인권·저작권으로 우회해야 합니다. 넓게 등록한 쪽이 협상에서도 유리합니다. 실무 포인트: ① 오픈마켓·SNS·역직구몰을 상표명·오타·영문·중국어 변형으로 정기 검색 ② 발견 시 캡처·구매·공증으로 시점 고정 ③ 라이선스 계약에는 신규 채널 추가 시 로열티 보고 의무, 감사권, Sell-off(종료 후 재고 판매) 기간·수량·채널을 명시하세요.","meta":"11/24 · 4장","date":"2026-11-24","cards":[{"src":"assets/cards/2026-11-24-basics-t09-1.webp","alt":"브랜드 IP 관리 — 등록 빈틈과 침해 모니터링 카드 1 / 4","sha":"9f43663d7cc5"},{"src":"assets/cards/2026-11-24-basics-t09-2.webp","alt":"브랜드 IP 관리 — 등록 빈틈과 침해 모니터링 카드 2 / 4","sha":"d062aa47686c"},{"src":"assets/cards/2026-11-24-basics-t09-3.webp","alt":"브랜드 IP 관리 — 등록 빈틈과 침해 모니터링 카드 3 / 4","sha":"af371c8c325b"},{"src":"assets/cards/2026-11-24-basics-t09-4.webp","alt":"브랜드 IP 관리 — 등록 빈틈과 침해 모니터링 카드 4 / 4","sha":"6b366348fdf5"}]},{"id":"basics-2026-11-24-10","num":"10","title":"에이전시 수익화 — 단발 분쟁에서 반복 수익으로","fullTitle":"에이전시 수익화 — 단발 분쟁에서 반복 수익으로","level":"실무","text":"핵심: 분쟁 대응은 한 건씩 끊기는 매출입니다. 같은 고객에게 매달 필요한 일(침해 스캔·사전 검수·계약 검
